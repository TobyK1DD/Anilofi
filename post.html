<script>
const SUPABASE_URL  = 'https://jfxyzehiaynabzsnncjp.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpmeHl6ZWhpYXluYWJ6c25uY2pwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA2NDczNjIsImV4cCI6MjA5NjIyMzM2Mn0.k9nqufXZO-wu0UuKBYu5VVZ8y4t4QhCpLUNoSvTfi7I';
const { createClient } = window.supabase;
const db = createClient(SUPABASE_URL, SUPABASE_ANON);

let isAdmin = false;
let postId  = null;

// ── Utilities ──────────────────────────────
function esc(s) { return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function renderContent(c) {
  if (!c) return '';
  if (/<[a-zA-Z][\s\S]*>/.test(c)) return c;
  return esc(c).replace(/\n/g,'<br>');
}

function toast(msg) {
  const root = document.getElementById('toast-root');
  if (!root) return;
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  root.appendChild(t);
  setTimeout(() => t.classList.add('show'), 10);
  setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 300); }, 3000);
}

// ── Theme + UI ─────────────────────────────
document.addEventListener('DOMContentLoaded', function() {
  function tick() {
    var n = new Date(), p = x => String(x).padStart(2,'0');
    var el = document.getElementById('clock');
    if (el) el.textContent = p(n.getHours())+':'+p(n.getMinutes())+':'+p(n.getSeconds());
  }
  tick(); setInterval(tick, 1000);

  var btn = document.getElementById('theme-btn');
  if (btn) {
    btn.textContent = document.body.classList.contains('darkmode') ? '☀️' : '🌙';
    btn.addEventListener('click', function() {
      document.body.classList.toggle('darkmode');
      var dark = document.body.classList.contains('darkmode');
      localStorage.setItem('theme', dark ? 'dark' : 'light');
      btn.textContent = dark ? '☀️' : '🌙';
    });
  }

  window.addEventListener('scroll', function() {
    var s = document.getElementById('scroll-top');
    if (s) s.classList.toggle('visible', window.scrollY > 300);
  });
});

// ── Load post ──────────────────────────────
async function loadPost() {
  const params = new URLSearchParams(window.location.search);
  postId = params.get('id');

  if (!postId) { showError('No post ID in URL.', true); return; }

  // Check admin session
  const { data: { session } } = await db.auth.getSession();
  isAdmin = !!session;

  const { data: post, error } = await db
    .from('blog_posts').select('*').eq('id', postId).single();

  document.getElementById('post-loading').style.display = 'none';

  if (error || !post) {
    showError("This post doesn't exist or has been removed.", true);
    return;
  }

  // Update page title + winbar
  document.title = post.title + ' — TobyK1DD Blog';
  document.getElementById('post-winbar-title').textContent = 'post.exe — ' + post.title;

  // ── Dynamic og / twitter meta ──────────────────────────────────────────
  // Updates tags so Discord, Twitter, and Slack show the real post title
  // and description when someone shares the link
  const excerpt  = (post.content || '').replace(/<[^>]+>/g, '').replace(/\s+/g,' ').trim().slice(0, 200);
  const ogImage  = (post.images && post.images.length) ? post.images[0] : 'https://tobyk1dd.com/og-image.png';
  const ogUrl    = window.location.href;

  function setMeta(attr, attrVal, content) {
    let el = document.querySelector(`meta[${attr}="${attrVal}"]`);
    if (!el) { el = document.createElement('meta'); el.setAttribute(attr, attrVal); document.head.appendChild(el); }
    el.setAttribute('content', content);
  }

  setMeta('property', 'og:title',         post.title + ' — TobyK1DD Blog');
  setMeta('property', 'og:description',   excerpt + (excerpt.length === 200 ? '...' : ''));
  setMeta('property', 'og:url',           ogUrl);
  setMeta('property', 'og:image',         ogImage);
  setMeta('name',     'description',      excerpt + (excerpt.length === 200 ? '...' : ''));
  setMeta('name',     'twitter:title',    post.title + ' — TobyK1DD Blog');
  setMeta('name',     'twitter:description', excerpt + (excerpt.length === 200 ? '...' : ''));
  setMeta('name',     'twitter:image',    ogImage);
  // ────────────────────────────────────────────────────────────────────────

  // Build hero image
  const heroHtml = post.images && post.images.length
    ? `<img class="post-hero-img" src="${esc(post.images[0])}" alt="${esc(post.title)}">`
    : '';

  // Extra gallery images
  const extraImgs = (post.images||[]).slice(1)
    .map(img => `<img src="${esc(img)}" style="max-width:100%;border-radius:6px;margin-top:10px;border:3px solid var(--border)" alt="Post image">`)
    .join('');

  // Tags
  const tagsHtml = (post.tags||[]).map(t => `<span class="tag">${esc(t)}</span>`).join('');

  // Date
  const dateStr = new Date(post.created_at).toLocaleDateString('en-GB', {
    day:'numeric', month:'long', year:'numeric'
  });

  // Admin controls
  const adminHtml = isAdmin
    ? `<div style="margin-top:20px;padding-top:16px;border-top:3px solid var(--border);display:flex;gap:10px">
        <a href="Blog.html" class="btn" style="font-size:0.8rem;padding:7px 16px" onclick="sessionStorage.setItem('editPostId','${esc(postId)}')">✏️ Edit post</a>
       </div>` : '';

  // Share row
  const postUrl = encodeURIComponent(window.location.href);
  const postTitle = encodeURIComponent(post.title);
  const shareHtml = `<div class="post-share">
    <span class="share-label">Share</span>
    <a class="share-btn" href="https://twitter.com/intent/tweet?text=${postTitle}&url=${postUrl}" target="_blank" rel="noopener">𝕏 Twitter</a>
    <button class="share-btn" onclick="navigator.clipboard.writeText(window.location.href);toast('Link copied ✓')">🔗 Copy link</button>
  </div>`;

  document.getElementById('post-inner').innerHTML = `
    ${heroHtml}
    <div class="post-meta-row">
      <span class="post-date-full">${dateStr}</span>
      ${tagsHtml}
    </div>
    <h1 class="post-title-full">${esc(post.title)}</h1>
    <div class="post-body-content">${renderContent(post.content)}</div>
    ${extraImgs}
    ${shareHtml}
    ${adminHtml}`;

  document.getElementById('post-win').style.display = 'flex';

  // Init polls within content
  await initPollsInPost(document.getElementById('post-inner'));

  // Load comments
  document.getElementById('post-comments-section').style.display = 'block';
  await loadComments();
}

function showError(msg, showBack) {
  document.getElementById('post-loading').style.display = 'none';
  const page = document.querySelector('.post-page');
  const div = document.createElement('div');
  div.className = 'win';
  div.innerHTML = `
    <div class="winbar"><div class="winbar-title">error.exe</div>
    <div class="wbtns"><span class="wbtn r"></span><span class="wbtn y"></span><span class="wbtn g"></span></div></div>
    <div class="state-msg">
      <h2>404.</h2>
      <p>${esc(msg)}</p>
      ${showBack ? '<br><a href="Blog.html" class="btn" style="font-size:0.85rem">← Back to Blog</a>' : ''}
    </div>`;
  page.appendChild(div);
}

// ── Polls ──────────────────────────────────
function getVoterKey() {
  let k = localStorage.getItem('voter_key');
  if (!k) { k = crypto.randomUUID(); localStorage.setItem('voter_key', k); }
  return k;
}

async function initPollsInPost(container) {
  const embeds = container.querySelectorAll('.poll-embed[data-poll-id]');
  for (const embed of embeds) await renderPollWidget(embed.dataset.pollId, embed);
}

async function renderPollWidget(pid, container) {
  const vk = getVoterKey();
  const [{ data:poll }, { data:votes }, { data:myVote }] = await Promise.all([
    db.from('polls').select('*').eq('id', pid).single(),
    db.from('poll_votes').select('option_index').eq('poll_id', pid),
    db.from('poll_votes').select('option_index').eq('poll_id', pid).eq('voter_key', vk).maybeSingle()
  ]);
  if (!poll) { container.innerHTML = '<p style="opacity:0.4;font-size:0.82rem">Poll unavailable</p>'; return; }
  const opts = typeof poll.options === 'string' ? JSON.parse(poll.options) : poll.options;
  if (myVote) { renderPollResults(container, poll, opts, votes||[], myVote.option_index); }
  else {
    const total = (votes||[]).length;
    container.innerHTML =
      `<div class="poll-widget"><p class="poll-question">📊 ${esc(poll.question)}</p>`+
      `<div class="poll-vote-options">${opts.map((o,i)=>`<button class="poll-vote-btn" onclick="castVote('${pid}',${i},this.closest('.poll-widget'))">${esc(o)}</button>`).join('')}</div>`+
      `<p class="poll-total-label">${total} vote${total!==1?'s':''}</p></div>`;
  }
}

async function castVote(pid, idx, widget) {
  widget.querySelectorAll('.poll-vote-btn').forEach(b => b.disabled = true);
  const { error } = await db.from('poll_votes').insert([{ poll_id:pid, option_index:idx, voter_key:getVoterKey() }]);
  if (error) { toast(error.code==='23505'?'Already voted!':'Vote failed: '+error.message); widget.querySelectorAll('.poll-vote-btn').forEach(b=>b.disabled=false); return; }
  const container = widget.closest('.poll-embed') || widget.parentElement;
  const { data:poll } = await db.from('polls').select('*').eq('id', pid).single();
  const { data:votes } = await db.from('poll_votes').select('option_index').eq('poll_id', pid);
  const opts = typeof poll.options === 'string' ? JSON.parse(poll.options) : poll.options;
  renderPollResults(container, poll, opts, votes||[], idx);
}

function renderPollResults(container, poll, opts, votes, myIdx) {
  const total  = votes.length;
  const counts = opts.map((_,i) => votes.filter(v => v.option_index===i).length);
  const rows   = opts.map((o,i) => {
    const pct = total>0 ? Math.round((counts[i]/total)*100) : 0;
    const mine = i===myIdx;
    return `<div class="poll-result-row${mine?' my-vote':''}">
      <div class="poll-result-header"><span class="poll-result-label">${esc(o)}${mine?' ✓':''}</span><span class="poll-result-pct">${pct}%</span></div>
      <div class="poll-bar-track"><div class="poll-bar-fill" style="width:${pct}%"></div></div>
      <span class="poll-result-count">${counts[i]} vote${counts[i]!==1?'s':''}</span></div>`;
  }).join('');
  container.innerHTML = `<div class="poll-widget"><p class="poll-question">📊 ${esc(poll.question)}</p><div class="poll-results">${rows}</div><p class="poll-total-label">${total} vote${total!==1?'s':''} total &nbsp;·&nbsp; <span style="opacity:0.5;font-size:0.85em">You voted</span></p></div>`;
}

// ── Comments ───────────────────────────────
async function loadComments() {
  const inner = document.getElementById('comments-inner');
  const { data, error } = await db.from('comments')
    .select('*').eq('post_id', postId).order('created_at', { ascending:true });
  if (error) { inner.innerHTML = '<p>Error loading comments.</p>'; return; }
  const list = (data && data.length)
    ? data.map(c => `<div class="comment-item">
        <div class="comment-meta">
          <span class="comment-author">${esc(c.author)}</span>
          <span class="comment-date">${new Date(c.created_at).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}</span>
          ${isAdmin?`<button class="comment-del" onclick="deleteComment('${c.id}')">🗑️ delete</button>`:''}
        </div>
        <p class="comment-text">${esc(c.content)}</p>
      </div>`).join('')
    : '<p class="no-comments">No comments yet — be the first!</p>';

  inner.innerHTML = `
    <p class="comments-title">💬 ${(data||[]).length} Comment${(data||[]).length!==1?'s':''}</p>
    <div>${list}</div>
    <div style="margin-top:20px;border-top:3px solid var(--border);padding-top:18px">
      <p class="comment-form-title">Leave a comment</p>
      <input type="text" class="comment-input" id="cmt-name" placeholder="Your name" maxlength="50">
      <textarea class="comment-textarea" id="cmt-text" placeholder="Write your comment..." rows="3" maxlength="500"></textarea>
      <div style="display:flex;justify-content:space-between;align-items:center">
        <span class="comment-charcount" id="cmt-chars">500 chars left</span>
        <button class="comment-submit" onclick="submitComment()">Post comment →</button>
      </div>
    </div>`;

  const ta = document.getElementById('cmt-text');
  if (ta) ta.addEventListener('input', () => {
    const el = document.getElementById('cmt-chars');
    if (el) el.textContent = (500 - ta.value.length) + ' chars left';
  });
}

async function submitComment() {
  const name = (document.getElementById('cmt-name')?.value||'').trim();
  const text = (document.getElementById('cmt-text')?.value||'').trim();
  if (!name) { toast('Enter your name'); return; }
  if (!text) { toast('Write a comment first'); return; }
  const btn = document.querySelector('.comment-submit');
  if (btn) { btn.disabled=true; btn.textContent='Posting...'; }
  const { error } = await db.from('comments').insert([{ post_id:postId, author:name, content:text }]);
  if (error) { toast('Error: '+error.message); if (btn){btn.disabled=false;btn.textContent='Post comment →';} return; }
  toast('Comment posted ✓');
  await loadComments();
}

async function deleteComment(id) {
  if (!confirm('Delete this comment?')) return;
  const { error } = await db.from('comments').delete().eq('id', id);
  if (error) { toast('Error: '+error.message); return; }
  toast('Comment deleted');
  await loadComments();
}

/* Scroll progress bar */
window.addEventListener('scroll', function() {
  var bar = document.getElementById('read-progress');
  if (!bar) return;
  var h = document.documentElement.scrollHeight - window.innerHeight;
  bar.style.width = (h > 0 ? Math.min((window.scrollY / h) * 100, 100) : 0) + '%';
});

loadPost();
</script>

      <div class="lp-dots">
        <button class="lp-dot lp-close" id="lofiClose"  title="Close"></button>
        <button class="lp-dot lp-min"   id="lofiToggle" title="Minimise"></button>
        <button class="lp-dot lp-max"   aria-hidden="true"></button>
      </div>
      <span class="lp-title">lofi.fm</span>
    </div>
    <div id="lofiBody">
      <div class="lp-info">
        <div id="lofiThumb">🎵</div>

          <p class="lp-track">lofi hip hop radio</p>
          <span id="lofiStatus">— paused</span>
        </div>
      </div>
      <div class="lp-controls">
        <button id="lofiPlay" aria-label="Play">▶</button>
        <div class="lp-vol-wrap">
          <span class="lp-vol-icon">🔈</span>
          <input type="range" id="lofiVol" min="0" max="100" value="50" aria-label="Volume">
        </div>
      </div>
    </div>
  </div>

  <script>
  (function () {
    var ytPlayer = null, isPlaying = false, minimized = false;
    var VIDEO_ID = 'X4VbdwhkE10';
    var tag = document.createElement('script');
    tag.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(tag);
    window.onYouTubeIframeAPIReady = function () {
      ytPlayer = new YT.Player('lofi-yt', {
        videoId: VIDEO_ID,
        playerVars: { autoplay:0, controls:0, disablekb:1, loop:1,
                      playlist:VIDEO_ID, iv_load_policy:3, modestbranding:1, rel:0 },
        events: {
          onReady: function (e) { e.target.setVolume(50); },
          onStateChange: function (e) { setPlayState(e.data === YT.PlayerState.PLAYING); }
        }
      });
    };
    function setPlayState(playing) {
      isPlaying = playing;
      document.getElementById('lofiPlay').textContent = playing ? '⏸' : '▶';
      document.getElementById('lofiPlay').setAttribute('aria-label', playing ? 'Pause' : 'Play');
      document.getElementById('lofiStatus').textContent = playing ? '♪ now playing' : '— paused';
      document.getElementById('lofiPlayer').classList.toggle('playing', playing);
    }
    document.getElementById('lofiPlay').addEventListener('click', function () {
      if (!ytPlayer || typeof ytPlayer.playVideo !== 'function') return;
      isPlaying ? ytPlayer.pauseVideo() : ytPlayer.playVideo();
    });
    document.getElementById('lofiVol').addEventListener('input', function () {
      if (ytPlayer && typeof ytPlayer.setVolume === 'function') ytPlayer.setVolume(+this.value);
    });
    document.getElementById('lofiToggle').addEventListener('click', function () {
      minimized = !minimized;
      document.getElementById('lofiPlayer').classList.toggle('minimized', minimized);
    });
    document.getElementById('lofiClose').addEventListener('click', function () {
      if (ytPlayer && typeof ytPlayer.pauseVideo === 'function') ytPlayer.pauseVideo();
      document.getElementById('lofiPlayer').style.display = 'none';
    });
  })();
  </script>
