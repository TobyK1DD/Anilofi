<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Code School · TobyK1DD</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sour+Gummy:wght@400;600;700&display=swap">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#c8d0d3;--soft:#e3edf0;--text:#000;--pri:#f64e4e;--brd:#fff;--acc:#aac6d3;--btxt:#000;--cbg:#c2cfd4;--muted:#555;--green:#2e7d32}
body.dark{--bg:#121212;--soft:#1e1e1e;--text:#fff;--pri:#f78af2;--brd:#333;--acc:#2a2a2a;--btxt:#000;--cbg:#0d0d0d;--muted:#888}
html,body{height:100%;font-family:'Sour Gummy',sans-serif;background:var(--bg);color:var(--text)}

/* AUTH */
#auth-screen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:999;padding:20px}
.auth-card{background:var(--soft);border:3px solid var(--brd);border-radius:16px;padding:36px 32px;width:100%;max-width:380px;text-align:center}
.auth-logo{font-size:26px;font-weight:700;color:var(--pri);margin-bottom:6px}
.auth-tagline{font-size:13px;opacity:.65;margin-bottom:24px}
.auth-tabs{display:flex;border:3px solid var(--brd);border-radius:8px;margin-bottom:22px;overflow:hidden}
.auth-tab{flex:1;background:transparent;border:none;padding:9px;cursor:pointer;font-family:'Sour Gummy',sans-serif;font-size:14px;color:var(--text);transition:all .15s}
.auth-tab.on{background:var(--pri);color:var(--btxt);font-weight:700}
.auth-form-wrap input{display:block;width:100%;padding:11px 14px;margin-bottom:12px;border:3px solid var(--acc);border-radius:8px;font-size:15px;font-family:'Sour Gummy',sans-serif;background:var(--bg);color:var(--text);outline:none}
.auth-form-wrap input:focus{border-color:var(--pri)}
.auth-submit{width:100%;padding:12px;background:var(--pri);color:var(--btxt);border:3px solid var(--brd);border-radius:8px;font-size:15px;cursor:pointer;font-family:'Sour Gummy',sans-serif;font-weight:700;margin-bottom:8px}
.auth-submit:hover{opacity:.88}
.auth-msg{font-size:13px;color:#e53935;min-height:20px;margin-top:4px}
.auth-note{font-size:12px;opacity:.5;margin-top:16px}

/* TOAST */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:#333;color:#fff;padding:10px 22px;border-radius:30px;font-size:14px;z-index:9999;transition:transform .3s ease;pointer-events:none;white-space:nowrap}
body.dark #toast{background:#e3edf0;color:#000}
#toast.show{transform:translateX(-50%) translateY(0)}

/* HEADER */
header{background:var(--bg);border-bottom:3px solid var(--brd);padding:9px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100;height:54px}
#logo{cursor:pointer;color:var(--pri);font-weight:700;font-size:19px;flex:1;white-space:nowrap}
#hdr-sub{font-size:12px;opacity:.6;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:160px}
.hdr-acct{display:flex;align-items:center;gap:8px;flex-shrink:0}
.acct-name{font-size:13px;font-weight:600;color:var(--pri)}
.btn{font-family:'Sour Gummy',sans-serif;background:var(--pri);color:var(--btxt);border:3px solid var(--brd);padding:8px 16px;border-radius:8px;cursor:pointer;font-size:14px;white-space:nowrap}
.btn:hover{opacity:.85}
.btn.sec{background:var(--soft);color:var(--text)}
.btn.sml{padding:5px 11px;font-size:12px}
.btn.ico{border-radius:50%;width:38px;height:38px;padding:0;font-size:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ham{background:transparent;border:none;font-size:22px;cursor:pointer;color:var(--text);flex-shrink:0;line-height:1}

/* LAYOUT */
#layout{display:flex;height:calc(100vh - 54px)}

/* SIDEBAR */
#sb{width:240px;flex-shrink:0;background:var(--soft);border-right:1px solid var(--acc);overflow-y:auto;transition:width .2s}
#sb.closed{width:0;overflow:hidden}
.ph-btn{width:100%;background:transparent;border:none;border-bottom:1px solid var(--acc);padding:11px 14px;text-align:left;cursor:pointer;display:flex;align-items:center;gap:8px;font-family:'Sour Gummy',sans-serif;color:var(--text)}
.ph-btn:disabled{cursor:default;opacity:.45}
.ph-meta{flex:1;min-width:0}
.ph-tag{font-size:11px;color:var(--pri);font-weight:700;letter-spacing:.3px}
.ph-name{font-size:13px;font-weight:600;white-space:nowrap}
.ph-bar{height:3px;background:var(--acc);border-radius:2px;margin-top:4px}
.ph-fill{height:100%;background:var(--pri);border-radius:2px;transition:width .3s}
.ls-btn{width:100%;background:transparent;border:none;border-bottom:1px solid var(--acc);padding:8px 10px 8px 28px;text-align:left;cursor:pointer;display:flex;align-items:center;gap:8px;font-family:'Sour Gummy',sans-serif;color:var(--text);font-size:13px}
.ls-btn:hover,.ls-btn.on{background:var(--acc)}
.ck{font-size:13px;color:var(--muted);flex-shrink:0}
.ck.done{color:var(--green)}
.pj-btn{width:100%;background:transparent;border:none;border-bottom:1px solid var(--acc);padding:8px 10px 8px 28px;text-align:left;cursor:pointer;display:flex;align-items:center;gap:8px;font-family:'Sour Gummy',sans-serif;color:var(--pri);font-size:13px;font-weight:700}
.pj-btn:hover,.pj-btn.on{background:var(--acc)}

/* MAIN */
#main{flex:1;min-width:0;overflow-y:auto;display:flex;flex-direction:column}

/* HOME */
#home{padding:28px 24px}
#home h1{color:var(--pri);font-size:28px;margin-bottom:8px}
.h-intro{font-size:15px;line-height:1.7;margin-bottom:24px;opacity:.85;max-width:520px}
.pc{background:var(--soft);border:2px solid var(--acc);border-radius:14px;padding:15px 18px;margin-bottom:12px;display:flex;align-items:center;gap:14px;transition:border-color .15s;cursor:default}
.pc.go{cursor:pointer}.pc.go:hover{border-color:var(--pri)}.pc.soon{opacity:.5}
.pc-ic{font-size:26px;flex-shrink:0}
.pc-info{flex:1;min-width:0}
.pc-tag{font-size:11px;color:var(--pri);font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.pc-name{font-weight:700;font-size:15px}
.pc-desc{font-size:13px;opacity:.65}
.pc-pg{display:flex;align-items:center;gap:8px;margin-top:5px}
.pc-bar{height:4px;background:var(--acc);border-radius:4px;width:120px;overflow:hidden}
.pc-fill{height:100%;background:var(--pri);border-radius:4px;transition:width .3s}
.pc-ct{font-size:12px;color:var(--pri);font-weight:700}
.soon-badge{font-size:12px;background:var(--acc);padding:5px 12px;border-radius:20px;flex-shrink:0}

/* LESSON */
#lv{display:flex;flex-direction:column;flex:1}
.lscroll{padding:18px 22px;border-bottom:2px solid var(--acc);overflow-y:auto;max-height:420px;flex-shrink:0}
.crumb{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.ctag{font-size:11px;background:var(--pri);color:var(--btxt);padding:3px 10px;border-radius:20px;font-weight:700}
.dtag{font-size:11px;background:var(--green);color:#fff;padding:3px 10px;border-radius:20px}
.qtag{font-size:11px;padding:3px 10px;border-radius:20px;font-weight:700}
.lh{color:var(--pri);font-size:22px;margin:2px 0 14px;line-height:1.3}
.lt{line-height:1.75;margin:8px 0;font-size:14px}
pre.cb{background:var(--cbg);border:1px solid var(--acc);border-radius:8px;padding:14px 16px;margin:10px 0;font-family:'Courier New',Courier,monospace;font-size:12.5px;overflow-x:auto;color:var(--text);line-height:1.7;white-space:pre;border-left:4px solid var(--pri)}
.tip{background:var(--soft);border-left:4px solid var(--pri);border-radius:0 8px 8px 0;padding:10px 16px;margin:10px 0;font-size:14px;line-height:1.6}
.chal{background:var(--soft);border:2px solid var(--pri);border-radius:12px;padding:16px 18px;margin-top:16px}
.chal h3{color:var(--pri);margin:0 0 8px;font-size:16px}
.chal .desc{margin:0 0 10px;line-height:1.65;font-size:14px}
.chal details summary{cursor:pointer;color:var(--pri);font-size:13px;user-select:none}
.chal details pre{margin-top:10px}
.lact{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}

/* PROJECT */
#pv{display:flex;flex-direction:column;flex:1}
.pscroll{padding:16px 22px;border-bottom:2px solid var(--acc);overflow-y:auto;max-height:200px;flex-shrink:0}
.ptag{font-size:11px;color:var(--pri);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.pscroll h2{color:var(--pri);font-size:20px;margin:0 0 10px;line-height:1.3}
.pscroll p{line-height:1.7;font-size:14px}

/* EDITOR */
.ep{display:flex;flex:1;border-top:2px solid var(--acc);min-height:320px}
.cs{width:50%;display:flex;flex-direction:column;border-right:2px solid var(--acc)}
.tbar{display:flex;background:var(--soft);border-bottom:1px solid var(--acc);flex-shrink:0}
.tb-btn{font-family:'Sour Gummy',sans-serif;background:transparent;color:var(--text);border:none;border-right:1px solid var(--acc);padding:7px 14px;cursor:pointer;font-size:13px;flex-shrink:0}
.tb-btn.on{background:var(--pri);color:var(--btxt);font-weight:700}
.run-btn{margin-left:auto;font-family:'Sour Gummy',sans-serif;background:var(--green);color:#fff;border:none;padding:6px 14px;cursor:pointer;font-size:12px;flex-shrink:0}
textarea.ed{flex:1;background:var(--cbg);font-family:'Courier New',Courier,monospace;font-size:12.5px;padding:12px;border:none;outline:none;resize:none;line-height:1.75;color:var(--text)}
.ps{width:50%;display:flex;flex-direction:column}
.phdr{padding:5px 12px;background:var(--soft);border-bottom:1px solid var(--acc);font-size:12px;color:var(--muted);flex-shrink:0;display:flex;justify-content:space-between;align-items:center}
iframe{flex:1;border:none;background:#fff}
.hidden{display:none!important}

/* ── QUIZ OVERLAY ── */
#quiz-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,0.65);
  display:flex;align-items:center;justify-content:center;z-index:200;padding:20px
}
.quiz-box{
  background:var(--soft);border:3px solid var(--brd);border-radius:16px;
  width:100%;max-width:520px;padding:28px 28px 24px;
}
.quiz-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.quiz-hdr h2{color:var(--pri);font-size:18px}
.quiz-prog{font-size:13px;color:var(--muted)}
.quiz-q{font-size:16px;line-height:1.5;margin-bottom:18px;color:var(--text)}
.quiz-opts{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.quiz-opt{
  font-family:'Sour Gummy',sans-serif;background:var(--bg);color:var(--text);
  border:3px solid var(--acc);border-radius:10px;padding:11px 16px;
  text-align:left;cursor:pointer;font-size:14px;line-height:1.4;transition:all .15s
}
.quiz-opt:hover:not(:disabled){border-color:var(--pri);background:var(--soft)}
.quiz-opt.correct{background:#e8f5e9!important;border-color:#2e7d32!important;color:#1b5e20!important}
.quiz-opt.wrong{background:#ffebee!important;border-color:#c62828!important;color:#b71c1c!important}
.quiz-opt:disabled{cursor:default}
.quiz-fb{font-size:14px;min-height:22px;font-weight:700;margin-bottom:12px}
.quiz-next{display:block;width:100%}
.quiz-result{text-align:center;padding:10px 0}
.quiz-score-big{font-size:4rem;font-weight:700;color:var(--pri);line-height:1}
.quiz-pct{font-size:1.3rem;color:var(--muted);margin:4px 0 16px}
.quiz-msg{font-size:16px;margin-bottom:20px}
.quiz-result-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

/* ── CHEAT SHEET PANEL ── */
#cheat-panel{
  position:fixed;top:54px;right:-420px;width:420px;bottom:0;
  background:var(--soft);border-left:3px solid var(--brd);
  z-index:90;transition:right .3s ease;
  display:flex;flex-direction:column;
}
#cheat-panel.open{right:0}
.cheat-hdr{padding:12px 16px;background:var(--pri);color:var(--btxt);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.cheat-hdr h3{font-size:15px}
.cheat-tabs{display:flex;background:var(--bg);border-bottom:2px solid var(--acc);flex-shrink:0}
.cheat-tab{flex:1;background:transparent;border:none;border-bottom:3px solid transparent;padding:9px 4px;cursor:pointer;font-family:'Sour Gummy',sans-serif;font-size:13px;color:var(--text);transition:all .15s}
.cheat-tab.on{border-bottom-color:var(--pri);color:var(--pri);font-weight:700}
.cheat-body{flex:1;overflow-y:auto;padding:12px 14px}
.cheat-section{margin-bottom:16px}
.cheat-section h4{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--pri);margin-bottom:8px;font-weight:700}
.cheat-row{display:flex;gap:8px;margin-bottom:5px;align-items:flex-start}
.cheat-code{font-family:'Courier New',monospace;font-size:11.5px;background:var(--cbg);border:1px solid var(--acc);border-radius:4px;padding:3px 7px;flex-shrink:0;color:var(--text);white-space:nowrap}
.cheat-desc{font-size:12px;color:var(--muted);line-height:1.4;padding-top:2px}

@media(max-width:700px){
  .ep{flex-direction:column}
  .cs{width:100%;border-right:none;border-bottom:2px solid var(--acc);min-height:200px}
  .ps{width:100%}
  #sb{position:fixed;top:54px;bottom:0;z-index:50;width:240px}
  #sb.closed{width:0}
  #cheat-panel{width:100%;right:-100%}
  #cheat-panel.open{right:0}
  .auth-card{padding:28px 20px}
}
</style>
</head>
<body>

<!-- AUTH -->
<div id="auth-screen">
  <div class="auth-card">
    <div class="auth-logo">⚡ Code School</div>
    <p class="auth-tagline">Learn HTML, CSS &amp; JavaScript from scratch</p>
    <div class="auth-tabs">
      <button class="auth-tab on" data-tab="login"  onclick="authTab('login')">🔑 Login</button>
      <button class="auth-tab"    data-tab="signup" onclick="authTab('signup')">✏️ Sign Up</button>
    </div>
    <div id="auth-login" class="auth-form-wrap">
      <input type="text"     id="liUser" placeholder="Username" autocomplete="username"     onkeydown="if(event.key==='Enter')doLogin()">
      <input type="password" id="liPass" placeholder="Password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
      <button class="auth-submit" onclick="doLogin()">Login</button>
      <div class="auth-msg" id="liMsg"></div>
    </div>
    <div id="auth-signup" class="auth-form-wrap hidden">
      <input type="text"     id="suUser"  placeholder="Username (letters, numbers, _)" autocomplete="username"    onkeydown="if(event.key==='Enter')doSignup()">
      <input type="email"    id="suEmail" placeholder="Email address"                  autocomplete="email"        onkeydown="if(event.key==='Enter')doSignup()">
      <input type="password" id="suPass"  placeholder="Password (min 6 chars)"        autocomplete="new-password" onkeydown="if(event.key==='Enter')doSignup()">
      <button class="auth-submit" onclick="doSignup()">Create Account</button>
      <div class="auth-msg" id="suMsg"></div>
    </div>
    <p class="auth-note">📱 Progress saved locally on this device</p>
  </div>
</div>

<!-- TOAST -->
<div id="toast"></div>

<!-- QUIZ OVERLAY -->
<div id="quiz-overlay" class="hidden">
  <div class="quiz-box">
    <div id="quiz-content"></div>
    <button class="btn sec sml" onclick="closeQuiz()" style="margin-top:12px;width:100%">✕ Close</button>
  </div>
</div>

<!-- CHEAT SHEET PANEL -->
<div id="cheat-panel">
  <div class="cheat-hdr">
    <h3>📖 Cheat Sheet</h3>
    <button class="btn ico sec" onclick="toggleCheat()" style="font-size:16px;background:rgba(255,255,255,0.2);border-color:rgba(255,255,255,0.4);color:var(--btxt)">✕</button>
  </div>
  <div class="cheat-tabs">
    <button class="cheat-tab on" data-tab="html" onclick="setCheatTab('html')">HTML</button>
    <button class="cheat-tab"    data-tab="css"  onclick="setCheatTab('css')">CSS</button>
    <button class="cheat-tab"    data-tab="js"   onclick="setCheatTab('js')">JS</button>
  </div>
  <div class="cheat-body" id="cheat-body"></div>
</div>

<!-- HEADER -->
<header>
  <button class="ham" onclick="toggleSB()">☰</button>
  <div id="logo" onclick="goHome()">⚡ Code School</div>
  <span id="hdr-sub"></span>
  <button class="btn sml sec" onclick="toggleCheat()" style="flex-shrink:0">📖 Cheat Sheet</button>
  <div id="acct-area" class="hdr-acct" style="display:none">
    <span class="acct-name" id="acct-name"></span>
    <button class="btn sml sec" onclick="doLogout()">Log out</button>
  </div>
  <button class="btn ico sec" id="dark-btn" onclick="toggleDark()">🌙</button>
</header>

<!-- APP -->
<div id="layout">
  <aside id="sb"></aside>
  <main id="main">
    <div id="home"></div>

    <!-- LESSON VIEW -->
    <div id="lv" class="hidden">
      <div class="lscroll" id="lcontent"></div>
      <div class="ep">
        <div class="cs">
          <div class="tbar">
            <button class="tb-btn on" onclick="setTab('html','lv')">HTML</button>
            <button class="tb-btn"    onclick="setTab('css','lv')">CSS</button>
            <button class="tb-btn"    onclick="setTab('js','lv')">JS</button>
            <button class="run-btn"   onclick="runPv()">▶ Run</button>
          </div>
          <textarea class="ed" id="led" spellcheck="false" oninput="onInput('lv')"></textarea>
        </div>
        <div class="ps">
          <div class="phdr"><span>👁 Live Preview</span><span style="font-size:11px;opacity:.6">auto-updates</span></div>
          <iframe id="lif" sandbox="allow-scripts" title="Preview"></iframe>
        </div>
      </div>
    </div>

    <!-- PROJECT VIEW -->
    <div id="pv" class="hidden">
      <div class="pscroll" id="pcontent"></div>
      <div class="ep">
        <div class="cs">
          <div class="tbar">
            <button class="tb-btn on" onclick="setTab('html','pv')">HTML</button>
            <button class="tb-btn"    onclick="setTab('css','pv')">CSS</button>
            <button class="tb-btn"    onclick="setTab('js','pv')">JS</button>
            <button class="run-btn"   onclick="runPv()">▶ Run</button>
          </div>
          <textarea class="ed" id="ped" spellcheck="false" oninput="onInput('pv')"></textarea>
        </div>
        <div class="ps">
          <div class="phdr"><span>👁 Live Preview</span><span style="font-size:11px;opacity:.6">auto-updates</span></div>
          <iframe id="pif" sandbox="allow-scripts" title="Preview"></iframe>
        </div>
      </div>
    </div>
  </main>
</div>

<script>
const PHASES = [{"id": "html", "label": "Phase 1", "title": "HTML", "icon": "🏗️", "desc": "Build the structure of every webpage", "lessons": [{"id": "h1", "title": "What is HTML? & Document Structure", "content": [{"t": "p", "v": "HTML (HyperText Markup Language) is the skeleton of every webpage. It defines what content exists and what it <em>means<\/em> — is this a heading? A paragraph? A link? An image?"}, {"t": "p", "v": "HTML uses <strong>tags<\/strong> — keywords in angle brackets. Most come in pairs: an opening tag and a closing tag. Content goes between them:"}, {"t": "c", "v": "<h1>This is a big heading<\/h1>\n<p>This is a paragraph of text.<\/p>\n<strong>This is bold.<\/strong>\n<em>This is italic.<\/em>"}, {"t": "p", "v": "Every HTML page must follow this exact structure — the browser relies on it:"}, {"t": "c", "v": "<!DOCTYPE html>\n<html lang=\"en\">\n  <head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>My Page Title<\/title>\n  <\/head>\n  <body>\n    <!-- Everything the user sees goes here -->\n    <h1>Hello World!<\/h1>\n    <p>My first webpage!<\/p>\n  <\/body>\n<\/html>"}, {"t": "t", "v": "💡 &lt;!DOCTYPE html&gt; = \"this is HTML5\". &lt;head&gt; = invisible settings. &lt;body&gt; = everything the user sees. Always include all three."}], "code": {"html": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <title>My First Page<\/title>\n<\/head>\n<body>\n  <h1>Hello World!<\/h1>\n  <p>I am learning HTML!<\/p>\n  <!-- This is a comment — the browser ignores it -->\n<\/body>\n<\/html>", "css": "body {\n  font-family: sans-serif;\n  padding: 20px;\n  background: #f0f4f6;\n  color: #333;\n}", "js": ""}, "ch": {"title": "Introduce Yourself", "desc": "Change the heading to your name. Replace the paragraph with one about where you're from. Add a second paragraph about your hobbies.", "hint": "<h1>Toby<\/h1>\n<p>I'm from Nuneaton, England.<\/p>\n<p>My hobbies are gaming and learning to code.<\/p>"}, "quiz": [{"q": "What does HTML stand for?", "opts": ["HyperText Markup Language", "High Tech Modern Language", "HyperText Making Language", "Hyper Tool Markup Language"], "a": 0}, {"q": "Which section of the HTML document holds everything the user actually sees?", "opts": ["<head>", "<title>", "<body>", "<html>"], "a": 2}, {"q": "What does <!DOCTYPE html> tell the browser?", "opts": ["The page title", "The stylesheet to use", "This document is HTML5", "The character encoding"], "a": 2}, {"q": "HTML comments look like which of these?", "opts": ["// comment", "/* comment */", "<!-- comment -->", "# comment"], "a": 2}]}, {"id": "h2", "title": "Headings, Text Formatting & Links", "content": [{"t": "p", "v": "HTML has 6 heading levels. Use them like a book — h1 is the chapter title, h2 is a section, h3 is a subsection. Use only ONE h1 per page."}, {"t": "c", "v": "<h1>Page Title (only one!)<\/h1>\n<h2>Section Heading<\/h2>\n<h3>Subsection<\/h3>\n\n<p>Normal paragraph text here.<\/p>\n<p>You can make text <strong>bold<\/strong>, <em>italic<\/em>,\n   <u>underlined<\/u>, or <mark>highlighted<\/mark>.<\/p>\n\n<!-- Line break inside a paragraph -->\n<p>Line one.<br>Line two (still same paragraph).<\/p>\n\n<!-- Horizontal rule -->\n<hr>"}, {"t": "p", "v": "Links use the &lt;a&gt; anchor tag. The href attribute is the destination. target=\"_blank\" opens in a new tab:"}, {"t": "c", "v": "<!-- Basic link -->\n<a href=\"https://google.com\">Visit Google<\/a>\n\n<!-- New tab (always add rel=\"noopener\" for security) -->\n<a href=\"https://youtube.com\" target=\"_blank\" rel=\"noopener\">YouTube<\/a>\n\n<!-- Jump to a section on the same page -->\n<a href=\"#about\">Jump to About section<\/a>\n\n<!-- Email link -->\n<a href=\"mailto:toby@example.com\">Email me<\/a>"}, {"t": "t", "v": "💡 Only use ONE &lt;h1&gt; per page — it's the page title. Screen readers and search engines use it. Using many h1s confuses both."}], "code": {"html": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"UTF-8\">\n  <title>My Favourite Sites<\/title>\n<\/head>\n<body>\n  <h1>My Favourite Websites<\/h1>\n  <p>Here are the sites I visit most:<\/p>\n\n  <h2>Entertainment<\/h2>\n  <!-- Add 2-3 links here -->\n\n  <h2>Learning<\/h2>\n  <!-- Add 2-3 links here -->\n\n  <hr>\n  <p><strong>Tip:<\/strong> Add <em>target=\"_blank\"<\/em> to open links in a new tab!<\/p>\n<\/body>\n<\/html>", "css": "body { font-family: sans-serif; padding: 30px; background: #f0f4f6; }\nh1 { color: #f64e4e; }\nh2 { color: #555; margin-top: 24px; }\na { color: #f64e4e; font-size: 18px; display: block; margin: 8px 0; }\na:hover { color: #333; }", "js": ""}, "ch": {"title": "Favourite Sites Directory", "desc": "Add at least 3 links under each heading. All links must open in a new tab. Use strong or em formatting somewhere on the page.", "hint": "<a href=\"https://youtube.com\" target=\"_blank\" rel=\"noopener\">YouTube<\/a>\n<a href=\"https://twitch.tv\" target=\"_blank\" rel=\"noopener\">Twitch<\/a>"}, "quiz": [{"q": "How many <h1> tags should a page ideally have?", "opts": ["As many as you like", "Exactly one", "Two — one per section", "None, use <p> instead"], "a": 1}, {"q": "Which attribute opens a link in a new browser tab?", "opts": ["href=\"_blank\"", "link=\"new\"", "target=\"_blank\"", "open=\"tab\""], "a": 2}, {"q": "Which HTML tag makes text italic with semantic meaning?", "opts": ["<i>", "<italic>", "<em>", "<slant>"], "a": 2}, {"q": "What HTML element draws a horizontal dividing line?", "opts": ["<line>", "<rule>", "<br>", "<hr>"], "a": 3}]}, {"id": "h3", "title": "Images, Lists & Block vs Inline", "content": [{"t": "p", "v": "The &lt;img&gt; tag is self-closing — no closing tag. src is the URL, alt describes it for screen readers (required!), width controls the size:"}, {"t": "c", "v": "<!-- Basic image -->\n<img src=\"https://placecats.com/400/250\" alt=\"A cute cat\" width=\"400\">\n\n<!-- Image with tooltip -->\n<img src=\"photo.jpg\" alt=\"Sunset over the sea\" title=\"My holiday photo\" width=\"300\">"}, {"t": "p", "v": "Lists come in two types. &lt;ul&gt; for unordered (bullets), &lt;ol&gt; for ordered (numbered). Each item is &lt;li&gt;. Lists can be nested:"}, {"t": "c", "v": "<!-- Bullet list -->\n<ul>\n  <li>HTML<\/li>\n  <li>CSS<\/li>\n  <li>JavaScript<\/li>\n<\/ul>\n\n<!-- Numbered list -->\n<ol>\n  <li>Learn HTML first<\/li>\n  <li>Then CSS<\/li>\n  <li>Then JavaScript<\/li>\n<\/ol>\n\n<!-- Nested list -->\n<ul>\n  <li>Frontend\n    <ul>\n      <li>HTML<\/li>\n      <li>CSS<\/li>\n    <\/ul>\n  <\/li>\n  <li>Backend<\/li>\n<\/ul>"}, {"t": "t", "v": "💡 Block elements (p, h1, div, ul) take up the full width and start on a new line. Inline elements (a, strong, em, img) only take as much space as needed, sitting within text."}], "code": {"html": "<!DOCTYPE html>\n<html>\n<head><meta charset=\"UTF-8\"><title>My Bucket List<\/title><\/head>\n<body>\n  <h1>My Bucket List<\/h1>\n  <img src=\"https://placecats.com/500/250\" alt=\"adventure\" width=\"500\">\n\n  <h2>Top 5 Things I Want to Do<\/h2>\n  <!-- Add an ordered list here -->\n\n  <h2>Skills I Want to Learn<\/h2>\n  <!-- Add an unordered list here -->\n<\/body>\n<\/html>", "css": "body { font-family: sans-serif; padding: 20px; background: #f0f4f6; }\nimg { border-radius: 12px; display: block; margin-bottom: 24px; max-width: 100%; }\nh1 { color: #f64e4e; }\nli { margin: 6px 0; font-size: 17px; }", "js": ""}, "ch": {"title": "Bucket List Page", "desc": "Replace the placeholder image with a real image URL. Create an ordered list of 5 bucket list items. Create an unordered list of 4 skills to learn. Nest one sub-list somewhere.", "hint": "Right-click any image online → \"Copy image address\"\n\n<ol>\n  <li>Visit Japan<\/li>\n  <li>Learn to code\n    <ul>\n      <li>HTML<\/li>\n      <li>JavaScript<\/li>\n    <\/ul>\n  <\/li>\n<\/ol>"}, "quiz": [{"q": "Which attribute on <img> describes the image for screen readers?", "opts": ["title", "src", "description", "alt"], "a": 3}, {"q": "Which list type produces numbered items?", "opts": ["<ul>", "<nl>", "<ol>", "<dl>"], "a": 2}, {"q": "The <img> tag is self-closing, meaning:", "opts": ["It closes itself automatically — no closing tag needed", "It must have <\/img>", "It only works inside <figure>", "It requires a title attribute"], "a": 0}, {"q": "Which tag wraps each item in both ordered and unordered lists?", "opts": ["<item>", "<bullet>", "<entry>", "<li>"], "a": 3}]}, {"id": "h4", "title": "Tables — Displaying Data", "content": [{"t": "p", "v": "HTML tables display structured data like a spreadsheet. Use them for actual data — never for page layout (that's what CSS is for)."}, {"t": "c", "v": "<table>\n  <thead>              <!-- Header row(s) -->\n    <tr>               <!-- Table row -->\n      <th>Name<\/th>    <!-- Header cell (bold, centred) -->\n      <th>Age<\/th>\n      <th>City<\/th>\n    <\/tr>\n  <\/thead>\n  <tbody>              <!-- Body rows -->\n    <tr>\n      <td>Toby<\/td>   <!-- Data cell -->\n      <td>22<\/td>\n      <td>Nuneaton<\/td>\n    <\/tr>\n    <tr>\n      <td>Sarah<\/td>\n      <td>25<\/td>\n      <td>London<\/td>\n    <\/tr>\n  <\/tbody>\n<\/table>"}, {"t": "p", "v": "Use colspan to span columns and rowspan to span rows:"}, {"t": "c", "v": "<tr>\n  <!-- This cell takes up 2 columns -->\n  <td colspan=\"2\">Spans two columns<\/td>\n  <td>Normal cell<\/td>\n<\/tr>"}, {"t": "t", "v": "💡 Always use &lt;thead&gt; and &lt;tbody&gt;. It helps screen readers, browsers style tables correctly, and JavaScript sort/filter libraries find the right rows."}], "code": {"html": "<!DOCTYPE html>\n<html>\n<head><meta charset=\"UTF-8\"><title>Games Table<\/title><\/head>\n<body>\n  <h1>My Favourite Games<\/h1>\n  <table>\n    <thead>\n      <tr>\n        <th>Game<\/th>\n        <th>Genre<\/th>\n        <th>Rating<\/th>\n        <th>Platform<\/th>\n      <\/tr>\n    <\/thead>\n    <tbody>\n      <tr>\n        <td>FIFA 25<\/td>\n        <td>Sports<\/td>\n        <td>⭐⭐⭐⭐<\/td>\n        <td>PS5<\/td>\n      <\/tr>\n      <!-- Add 3 more games -->\n    <\/tbody>\n  <\/table>\n<\/body>\n<\/html>", "css": "body { font-family: sans-serif; padding: 20px; background: #f0f4f6; }\nh1 { color: #f64e4e; }\ntable { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }\nth { background: #f64e4e; color: white; padding: 12px 16px; text-align: left; }\ntd { padding: 12px 16px; border-bottom: 1px solid #eee; }\ntr:last-child td { border-bottom: none; }\ntr:hover td { background: #f9f9f9; }", "js": ""}, "ch": {"title": "Games Rankings Table", "desc": "Add at least 4 more game rows. Add a 5th column called \"Hours Played\". Make the last row span 2 columns with a total summary.", "hint": "<tr>\n  <td colspan=\"2\"><strong>Total games: 5<\/strong><\/td>\n  <td>⭐⭐⭐⭐ avg<\/td>\n  <td colspan=\"2\">Multiple platforms<\/td>\n<\/tr>"}, "quiz": [{"q": "Which tag creates a header cell in a table (bold and centred by default)?", "opts": ["<td>", "<tr>", "<th>", "<thead>"], "a": 2}, {"q": "What does the colspan attribute do?", "opts": ["Adds a new column", "Makes a cell span multiple columns", "Sets the column width", "Merges two rows"], "a": 1}, {"q": "Table body rows should go inside which element?", "opts": ["Directly inside <table>", "<thead>", "<tbody>", "<tfoot>"], "a": 2}, {"q": "Which CSS property removes the double border between table cells?", "opts": ["border-spacing: 0", "table-layout: fixed", "border-collapse: collapse", "cell-padding: 0"], "a": 2}]}, {"id": "h5", "title": "Forms & User Input", "content": [{"t": "p", "v": "Forms let users send data — logins, sign ups, contact forms, search. The &lt;form&gt; wraps all inputs. &lt;label&gt; describes each input — always link them with matching for/id attributes:"}, {"t": "c", "v": "<form>\n  <!-- Text input -->\n  <label for=\"name\">Your name:<\/label>\n  <input type=\"text\" id=\"name\" name=\"name\" placeholder=\"Enter your name\" required>\n\n  <!-- Email input -->\n  <label for=\"email\">Email:<\/label>\n  <input type=\"email\" id=\"email\" name=\"email\" required>\n\n  <!-- Password -->\n  <input type=\"password\" id=\"pwd\" placeholder=\"Password\">\n\n  <!-- Number with min/max -->\n  <input type=\"number\" min=\"0\" max=\"100\" value=\"50\">\n\n  <!-- Submit button -->\n  <button type=\"submit\">Send<\/button>\n<\/form>"}, {"t": "p", "v": "More input types for different data:"}, {"t": "c", "v": "<!-- Checkbox -->\n<input type=\"checkbox\" id=\"agree\" name=\"agree\">\n<label for=\"agree\">I agree to the terms<\/label>\n\n<!-- Radio buttons (grouped by name) -->\n<input type=\"radio\" id=\"yes\" name=\"answer\" value=\"yes\">\n<label for=\"yes\">Yes<\/label>\n<input type=\"radio\" id=\"no\" name=\"answer\" value=\"no\">\n<label for=\"no\">No<\/label>\n\n<!-- Dropdown select -->\n<select name=\"country\">\n  <option value=\"\">Select country...<\/option>\n  <option value=\"uk\">United Kingdom<\/option>\n  <option value=\"us\">United States<\/option>\n<\/select>\n\n<!-- Multi-line text -->\n<textarea name=\"message\" rows=\"4\" placeholder=\"Your message...\"><\/textarea>"}, {"t": "t", "v": "💡 Always pair &lt;label for=\"id\"&gt; with &lt;input id=\"...\"&gt;. It improves accessibility AND makes the label clickable to focus the input — a small detail users notice."}], "code": {"html": "<!DOCTYPE html>\n<html>\n<head><meta charset=\"UTF-8\"><title>Contact Form<\/title><\/head>\n<body>\n  <h1>Contact Me<\/h1>\n  <form id=\"contactForm\">\n    <div class=\"field\">\n      <label for=\"name\">Name:<\/label>\n      <input type=\"text\" id=\"name\" placeholder=\"Your name\" required>\n    <\/div>\n    <div class=\"field\">\n      <label for=\"email\">Email:<\/label>\n      <input type=\"email\" id=\"email\" placeholder=\"your@email.com\" required>\n    <\/div>\n    <div class=\"field\">\n      <label for=\"subject\">Subject:<\/label>\n      <select id=\"subject\">\n        <option>General Enquiry<\/option>\n        <option>Collaboration<\/option>\n        <option>Feedback<\/option>\n      <\/select>\n    <\/div>\n    <div class=\"field\">\n      <label for=\"msg\">Message:<\/label>\n      <textarea id=\"msg\" rows=\"4\" placeholder=\"Your message...\"><\/textarea>\n    <\/div>\n    <button type=\"submit\">Send Message<\/button>\n  <\/form>\n<\/body>\n<\/html>", "css": "body { font-family: sans-serif; padding: 30px; background: #f0f4f6; max-width: 500px; margin: 0 auto; }\nh1 { color: #f64e4e; }\n.field { margin-bottom: 16px; }\nlabel { display: block; font-weight: bold; margin-bottom: 6px; font-size: 14px; }\ninput, select, textarea { width: 100%; padding: 10px; border: 3px solid #aac6d3; border-radius: 8px; font-size: 16px; font-family: sans-serif; outline: none; box-sizing: border-box; }\ninput:focus, select:focus, textarea:focus { border-color: #f64e4e; }\nbutton { background: #f64e4e; color: white; border: 3px solid white; padding: 12px 24px; border-radius: 8px; font-size: 16px; cursor: pointer; width: 100%; }", "js": ""}, "ch": {"title": "Extended Contact Form", "desc": "Add a checkbox for \"Subscribe to newsletter\". Add a radio group asking \"How did you find me?\" with 3 options. Add a file upload with type=\"file\". Every input must have a matching label.", "hint": "<input type=\"checkbox\" id=\"newsletter\">\n<label for=\"newsletter\">Subscribe to newsletter<\/label>\n\n<input type=\"radio\" id=\"social\" name=\"source\" value=\"social\">\n<label for=\"social\">Social Media<\/label>\n\n<label for=\"cv\">Upload CV:<\/label>\n<input type=\"file\" id=\"cv\">"}, "quiz": [{"q": "Which attribute makes a form field mandatory to fill in?", "opts": ["mandatory", "must-fill", "validate=\"true\"", "required"], "a": 3}, {"q": "How do you correctly link a <label> to its <input>?", "opts": ["Nest the input inside the label only", "Use matching for and id attributes", "Give them the same class", "Use the name attribute"], "a": 1}, {"q": "Which input type automatically validates email format?", "opts": ["type=\"text\"", "type=\"string\"", "type=\"email\"", "type=\"mail\""], "a": 2}, {"q": "Which HTML element creates a multi-line text field?", "opts": ["<input type=\"multiline\">", "<text>", "<bigtext>", "<textarea>"], "a": 3}]}, {"id": "h6", "title": "Semantic HTML — Structure that Means Something", "content": [{"t": "p", "v": "Semantic HTML uses tags that describe their meaning, not just appearance. Compare &lt;div&gt; (meaningless box) vs &lt;nav&gt; (navigation). Semantics help search engines, screen readers, and other developers understand your page."}, {"t": "c", "v": "<!-- Old non-semantic way -->\n<div class=\"header\">...<\/div>\n<div class=\"nav\">...<\/div>\n<div class=\"main\">...<\/div>\n<div class=\"footer\">...<\/div>\n\n<!-- Modern semantic way -->\n<header>...<\/header>      <!-- Site header/logo area -->\n<nav>...<\/nav>            <!-- Navigation links -->\n<main>                    <!-- Primary page content -->\n  <section>...<\/section>  <!-- Standalone section with heading -->\n  <article>...<\/article>  <!-- Self-contained content (blog post, card) -->\n  <aside>...<\/aside>      <!-- Related but secondary content -->\n<\/main>\n<footer>...<\/footer>      <!-- Footer info, copyright -->"}, {"t": "p", "v": "A complete semantic page structure:"}, {"t": "c", "v": "<header>\n  <nav>\n    <a href=\"/\">Home<\/a>\n    <a href=\"/about\">About<\/a>\n  <\/nav>\n<\/header>\n\n<main>\n  <section id=\"hero\">\n    <h1>Welcome<\/h1>\n    <p>I build things for the web.<\/p>\n  <\/section>\n\n  <section id=\"projects\">\n    <h2>Projects<\/h2>\n    <article>\n      <h3>Project One<\/h3>\n      <p>Description of the project.<\/p>\n    <\/article>\n  <\/section>\n<\/main>\n\n<footer>\n  <p>&copy; 2025 TobyK1DD<\/p>\n<\/footer>"}, {"t": "t", "v": "💡 Google ranks pages with proper semantic HTML higher in search results. Screen reader users jump between &lt;nav&gt;, &lt;main&gt;, &lt;footer&gt; landmarks — non-semantic &lt;div&gt;s are invisible to them."}], "code": {"html": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  <title>Semantic Portfolio<\/title>\n<\/head>\n<body>\n  <header>\n    <nav class=\"navbar\">\n      <div class=\"logo\">TobyK1DD<\/div>\n      <div class=\"nav-links\">\n        <a href=\"#about\">About<\/a>\n        <a href=\"#projects\">Projects<\/a>\n        <a href=\"#contact\">Contact<\/a>\n      <\/div>\n    <\/nav>\n  <\/header>\n\n  <main>\n    <section id=\"about\">\n      <h1>Hi, I'm Toby 👋<\/h1>\n      <p>I'm learning to build websites from scratch.<\/p>\n    <\/section>\n\n    <section id=\"projects\">\n      <h2>My Projects<\/h2>\n      <article class=\"card\">\n        <h3>Project One<\/h3>\n        <p>Built with HTML and CSS.<\/p>\n      <\/article>\n    <\/section>\n  <\/main>\n\n  <footer>\n    <p>Made by Toby &middot; 2025<\/p>\n  <\/footer>\n<\/body>\n<\/html>", "css": "* { box-sizing: border-box; margin: 0; }\nbody { font-family: sans-serif; background: #c8d0d3; }\n.navbar { display: flex; justify-content: space-between; align-items: center; background: #f64e4e; padding: 15px 30px; }\n.logo { color: white; font-size: 22px; font-weight: 700; }\n.nav-links a { color: white; text-decoration: none; margin-left: 20px; }\nsection { padding: 60px 40px; }\n#about { background: #e3edf0; }\n#about h1 { font-size: 40px; color: #f64e4e; }\n#projects { background: white; }\n.card { background: #e3edf0; padding: 20px; border-radius: 12px; max-width: 400px; margin-top: 20px; }\nfooter { background: #f64e4e; color: white; text-align: center; padding: 20px; }", "js": ""}, "ch": {"title": "Full Page Structure", "desc": "Add a second article card. Add an aside inside the about section with a fun fact. Add 2 more nav links. Give every section a unique id attribute.", "hint": "<aside>\n  <h3>Fun Fact<\/h3>\n  <p>I can name every Premier League club!<\/p>\n<\/aside>"}, "quiz": [{"q": "Which semantic element wraps the main navigation links?", "opts": ["<menu>", "<links>", "<nav>", "<sidebar>"], "a": 2}, {"q": "What is the main benefit of using semantic HTML?", "opts": ["Faster page loads", "Smaller file sizes", "Better accessibility and SEO", "More CSS options"], "a": 2}, {"q": "Self-contained content like a blog post should use which element?", "opts": ["<section>", "<div>", "<content>", "<article>"], "a": 3}, {"q": "Site-wide footer information belongs in which element?", "opts": ["<bottom>", "<end>", "<aside>", "<footer>"], "a": 3}]}, {"id": "cm1", "title": "10 Common HTML Mistakes", "content": [{"t": "p", "v": "These are the mistakes nearly every beginner makes. Read through them — some you may have already made!"}, {"t": "c", "v": "<!-- ❌ MISTAKE 1: Multiple h1 tags -->\n<h1>Page Title<\/h1>\n<h1>Another Heading<\/h1>  <!-- wrong! -->\n\n<!-- ✅ FIX: One h1, use h2 for sections -->\n<h1>Page Title<\/h1>\n<h2>Section Heading<\/h2>"}, {"t": "c", "v": "<!-- ❌ MISTAKE 2: Missing alt on images -->\n<img src=\"photo.jpg\">  <!-- bad for accessibility! -->\n\n<!-- ✅ FIX: Always include alt -->\n<img src=\"photo.jpg\" alt=\"A sunset over the sea\">"}, {"t": "c", "v": "<!-- ❌ MISTAKE 3: Using <br> for spacing -->\n<p>First section<\/p>\n<br><br><br>\n<p>Second section<\/p>\n\n<!-- ✅ FIX: Use CSS margin -->\n<p style=\"margin-bottom: 40px;\">First section<\/p>\n<p>Second section<\/p>"}, {"t": "c", "v": "<!-- ❌ MISTAKE 4: <div> for everything -->\n<div class=\"header\">...<\/div>\n<div class=\"nav\">...<\/div>\n<div class=\"footer\">...<\/div>\n\n<!-- ✅ FIX: Semantic HTML -->\n<header>...<\/header>\n<nav>...<\/nav>\n<footer>...<\/footer>"}, {"t": "c", "v": "<!-- ❌ MISTAKE 5: Form inputs without labels -->\n<input type=\"text\" placeholder=\"Name\">\n\n<!-- ✅ FIX: Always pair label with input -->\n<label for=\"name\">Name:<\/label>\n<input type=\"text\" id=\"name\" placeholder=\"Your name\">"}, {"t": "c", "v": "<!-- ❌ MISTAKE 6: Missing viewport meta -->\n<!-- (no meta viewport tag in head) -->\n<!-- Mobile browsers scale to desktop width -->\n\n<!-- ✅ FIX: Always include in <head> -->\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">"}, {"t": "c", "v": "<!-- ❌ MISTAKE 7: Block elements inside inline elements -->\n<a href=\"#\"><p>Link with paragraph<\/p><\/a>  <!-- invalid! -->\n\n<!-- ✅ FIX: Inline elements inside block -->\n<p><a href=\"#\">Link text inside paragraph<\/a><\/p>"}, {"t": "c", "v": "<!-- ❌ MISTAKE 8: Using <b> and <i> instead of semantic tags -->\n<b>Important!<\/b>  <!-- just styling, no meaning -->\n<i>Book title<\/i>  <!-- just styling, no meaning -->\n\n<!-- ✅ FIX: Use semantic alternatives -->\n<strong>Important!<\/strong>  <!-- means \"strong importance\" -->\n<em>Book title<\/em>          <!-- means \"emphasis\" -->"}, {"t": "t", "v": "💡 Quick checklist: one h1 per page ✓ — alt on all images ✓ — viewport meta in head ✓ — labels for all inputs ✓ — semantic structure over divs ✓"}], "code": {"html": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <title>HTML Best Practices<\/title>\n<\/head>\n<body>\n\n  <!-- Fix all the mistakes below: -->\n\n  <h1>My Website<\/h1>\n  <h1>About Me<\/h1>  <!-- BUG: should be h2 -->\n\n  <img src=\"https://placecats.com/300/200\">  <!-- BUG: missing alt -->\n\n  <br><br><br>  <!-- BUG: use CSS margin instead -->\n\n  <div class=\"nav\">  <!-- BUG: use semantic tag -->\n    <a href=\"#\">Home<\/a>\n  <\/div>\n\n<\/body>\n<\/html>", "css": "body { font-family: sans-serif; padding: 20px; }", "js": ""}, "ch": {"title": "Fix All 4 Bugs", "desc": "Fix the 4 HTML mistakes in the editor: wrong heading level, missing alt, spacing with br tags, and a non-semantic div nav.", "hint": "<!-- 1. Change second h1 to h2 -->\n<h2>About Me<\/h2>\n\n<!-- 2. Add alt attribute -->\n<img src=\"...\" alt=\"A cute cat\">\n\n<!-- 3. Remove br tags, use CSS margin -->\n\n<!-- 4. Use semantic nav tag -->\n<nav>...<\/nav>"}}], "project": {"title": "🏆 Project 1: Semantic Profile Page", "desc": "Build a full personal profile using semantic HTML. Must include: a header with nav (3+ links), main with sections for About, Skills and Hobbies, a table of favourite games/films, a contact form with 4+ fields, and a footer. No CSS required — focus on clean semantic structure.", "code": {"html": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  <title>My Profile<\/title>\n<\/head>\n<body>\n\n  <header>\n    <nav>\n      <!-- 3+ links: About, Skills, Projects, Contact -->\n    <\/nav>\n  <\/header>\n\n  <main>\n    <section id=\"about\">\n      <!-- h1 name, profile picture, bio -->\n    <\/section>\n\n    <section id=\"skills\">\n      <h2>My Skills<\/h2>\n      <!-- Unordered list -->\n    <\/section>\n\n    <section id=\"favourites\">\n      <h2>Favourites<\/h2>\n      <!-- A table -->\n    <\/section>\n\n    <section id=\"contact\">\n      <h2>Contact Me<\/h2>\n      <!-- Form with 4+ fields -->\n    <\/section>\n  <\/main>\n\n  <footer>\n    <!-- Name, year, links -->\n  <\/footer>\n\n<\/body>\n<\/html>", "css": "* { box-sizing: border-box; margin: 0; }\nbody { font-family: sans-serif; background: #c8d0d3; }", "js": ""}}}, {"id": "css", "label": "Phase 2", "title": "CSS", "icon": "🎨", "desc": "Make your pages look amazing", "lessons": [{"id": "c1", "title": "CSS Selectors — Targeting Elements Precisely", "content": [{"t": "p", "v": "CSS (Cascading Style Sheets) controls appearance. A CSS rule has a selector (what to target) and declarations (how to style it). Selectors go far beyond tag names:"}, {"t": "c", "v": "p { color: #333; }          /* all <p> tags */\n.card { background: white; } /* class=\"card\" */\n#hero { font-size: 40px; }   /* id=\"hero\" */\nh1, h2, h3 { font-family: sans-serif; } /* multiple */\nnav a { color: white; }      /* <a> inside <nav> */\nnav > a { font-weight: bold; } /* DIRECT child only */\nbutton:hover { background: darkred; } /* on hover */\nli:first-child { color: red; } /* first item */\nli:nth-child(2) { color: blue; } /* 2nd item */\nli:last-child { opacity: 0.5; } /* last item */\ninput[type=\"email\"] { border: 2px solid blue; } /* attribute */"}, {"t": "p", "v": "Specificity decides which rule wins when multiple rules match the same element:"}, {"t": "c", "v": "/* Specificity (low → high):\n   tag = 1 pt  |  class = 10 pts  |  id = 100 pts\n\n   Higher specificity always wins: */\np { color: blue; }          /* 1 pt — loses */\n.intro { color: green; }    /* 10 pts — wins */\n#main p { color: red; }     /* 101 pts — wins */"}, {"t": "t", "v": "💡 Avoid IDs in CSS — use classes instead (they're reusable). Avoid !important — it breaks the cascade and makes debugging very hard."}], "code": {"html": "<!DOCTYPE html>\n<html>\n<head><title>CSS Selectors<\/title><\/head>\n<body>\n  <nav id=\"main-nav\">\n    <a href=\"#\">Home<\/a>\n    <a href=\"#\">About<\/a>\n    <a href=\"#\" class=\"active\">Work<\/a>\n    <a href=\"#\">Contact<\/a>\n  <\/nav>\n  <main>\n    <h1>CSS Selectors<\/h1>\n    <p class=\"intro\">This is the intro paragraph.<\/p>\n    <p>This is a normal paragraph.<\/p>\n    <ul class=\"skills\">\n      <li>HTML<\/li>\n      <li>CSS<\/li>\n      <li>JavaScript<\/li>\n      <li>More coming...<\/li>\n    <\/ul>\n  <\/main>\n<\/body>\n<\/html>", "css": "* { box-sizing: border-box; margin: 0; }\nbody { font-family: sans-serif; background: #c8d0d3; }\n#main-nav { background: #f64e4e; padding: 15px 30px; display: flex; gap: 20px; }\n#main-nav a { color: white; text-decoration: none; }\n#main-nav a.active { font-weight: bold; text-decoration: underline; }\n#main-nav a:hover { opacity: 0.8; }\nmain { padding: 30px; }\n.intro { font-size: 18px; font-weight: bold; color: #f64e4e; }\n.skills li:first-child { font-weight: bold; }\n.skills li:nth-child(odd) { background: rgba(255,255,255,0.4); padding: 4px 8px; }", "js": ""}, "ch": {"title": "Selector Practice", "desc": "Add a hover background to nav links. Style the last li with :last-child. Target the 2nd paragraph with :nth-child. Style visited links with a:visited.", "hint": "#main-nav a:hover { background: rgba(255,255,255,0.2); border-radius: 4px; padding: 4px 8px; }\n.skills li:last-child { color: #888; font-style: italic; }\na:visited { color: #ccc; }"}, "quiz": [{"q": "Which type of CSS selector has the highest specificity?", "opts": ["Tag selector (p)", "Class selector (.card)", "ID selector (#hero)", "Universal selector (*)"], "a": 2}, {"q": "What does the selector \"nav a\" target?", "opts": ["nav and a elements", "a elements that are ancestors of nav", "a elements directly inside nav", "nav elements inside a"], "a": 2}, {"q": "Which pseudo-class applies when the user hovers over an element?", "opts": [":active", ":focus", ":hover", ":mouse"], "a": 2}, {"q": "How many specificity points is a class selector worth?", "opts": ["1", "10", "100", "1000"], "a": 1}]}, {"id": "c2", "title": "Colors, Typography & Backgrounds", "content": [{"t": "p", "v": "CSS supports several color formats. Understanding all of them gives you more control and flexibility:"}, {"t": "c", "v": "color: red;                    /* named */\ncolor: #f64e4e;                /* hex #RRGGBB */\ncolor: #f64;                   /* shorthand #RGB */\ncolor: rgb(246, 78, 78);       /* rgb() */\ncolor: rgba(246, 78, 78, 0.5); /* rgba — 0 transparent, 1 solid */\ncolor: hsl(0, 90%, 64%);       /* hue (0-360), saturation, lightness */"}, {"t": "p", "v": "Typography properties control fonts, sizes, and readability:"}, {"t": "c", "v": "/* Import a Google Font in your <head> first:\n<link href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap\" rel=\"stylesheet\"> */\n\nbody {\n  font-family: 'Inter', sans-serif;\n  font-size: 16px;\n  line-height: 1.6;     /* 1.5-1.8 for readable body text */\n  color: #333;\n}\nh1 {\n  font-size: 2.5rem;    /* rem = relative to root (16px = 1rem) */\n  font-weight: 700;\n  letter-spacing: -1px;\n}\np {\n  max-width: 65ch;      /* ch = character width — great for line length */\n  text-align: left;     /* left | center | right | justify */\n}"}, {"t": "p", "v": "Backgrounds can be colours, images, or gradients:"}, {"t": "c", "v": "background-color: #c8d0d3;\nbackground-image: url('photo.jpg');\nbackground-size: cover;        /* or contain */\nbackground-position: center;\nbackground-repeat: no-repeat;\n\n/* CSS Gradients */\nbackground: linear-gradient(135deg, #f64e4e, #f78af2);\nbackground: linear-gradient(to right, #c8d0d3, #e3edf0);"}, {"t": "t", "v": "💡 Use rem instead of px for font sizes. If a user increases their browser text size for accessibility, rem scales with it. px overrides the user's preference."}], "code": {"html": "<!DOCTYPE html>\n<html>\n<head>\n  <title>Typography Demo<\/title>\n  <link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Sour+Gummy:wght@400;700&family=Inter:wght@400;600&display=swap\">\n<\/head>\n<body>\n  <header class=\"hero\">\n    <h1>Hello, World!<\/h1>\n    <p class=\"tagline\">Beautiful typography makes websites feel professional.<\/p>\n    <a href=\"#\" class=\"cta\">Get Started<\/a>\n  <\/header>\n  <main>\n    <section class=\"content\">\n      <h2>About Typography<\/h2>\n      <p class=\"lead\">Good typography is invisible — readers enjoy it without noticing it.<\/p>\n      <p>The right font, size, and line-height can make or break a design. Pair a bold display font with a clean readable one.<\/p>\n    <\/section>\n  <\/main>\n<\/body>\n<\/html>", "css": "* { box-sizing: border-box; margin: 0; }\nbody { font-family: 'Inter', sans-serif; font-size: 16px; line-height: 1.6; color: #333; }\n.hero { background: linear-gradient(135deg, #f64e4e, #c8d0d3); padding: 80px 40px; text-align: center; color: white; }\n.hero h1 { font-family: 'Sour Gummy', sans-serif; font-size: 3rem; margin-bottom: 16px; }\n.tagline { font-size: 1.2rem; opacity: 0.9; margin-bottom: 30px; }\n.cta { display: inline-block; background: white; color: #f64e4e; padding: 12px 28px; border-radius: 8px; font-weight: 600; text-decoration: none; }\n.content { padding: 60px 40px; max-width: 700px; margin: 0 auto; }\n.lead { font-size: 1.2rem; color: #f64e4e; margin-bottom: 16px; }", "js": ""}, "ch": {"title": "Brand Your Header", "desc": "Change the gradient colours. Import a Google Font and use it on the h1. Change the CTA button colour. Add text-shadow to the h1.", "hint": "h1 { text-shadow: 2px 4px 8px rgba(0,0,0,0.2); }\nbackground: linear-gradient(135deg, #f64e4e, #f78af2);\n/* Get fonts at fonts.google.com */"}, "quiz": [{"q": "What does the A stand for in rgba()?", "opts": ["Advance", "Array", "Alpha (opacity)", "Addition"], "a": 2}, {"q": "Which CSS unit is relative to the ROOT font size of the page?", "opts": ["em", "px", "%", "rem"], "a": 3}, {"q": "Which property controls the vertical space between lines of text?", "opts": ["letter-spacing", "word-spacing", "text-height", "line-height"], "a": 3}, {"q": "CSS gradients are set using which property?", "opts": ["color", "gradient", "fill", "background"], "a": 3}]}, {"id": "c3", "title": "The Box Model — Deep Dive", "content": [{"t": "p", "v": "Every HTML element is a rectangular box. The Box Model describes 4 layers around the content, from inside out: content → padding → border → margin. Understanding this deeply is the most critical CSS skill."}, {"t": "c", "v": ".box {\n  /* 1. CONTENT — the actual text/image */\n  width: 300px;\n  height: 150px;\n\n  /* 2. PADDING — space between content and border (inside) */\n  padding: 20px;               /* all 4 sides equal */\n  padding: 10px 20px;          /* top+bottom | left+right */\n  padding: 10px 20px 15px 5px; /* top | right | bottom | left */\n\n  /* 3. BORDER — the visible edge */\n  border: 3px solid #f64e4e;\n  border-radius: 12px;          /* rounded corners */\n  border-top: 5px dashed blue;  /* individual sides */\n  outline: 2px dotted red;      /* outline (outside border, no layout impact) */\n\n  /* 4. MARGIN — space outside the border (pushes other elements away) */\n  margin: 20px;\n  margin: 0 auto;    /* centres block elements horizontally! */\n  margin-top: 40px;  /* individual sides */\n}"}, {"t": "p", "v": "The most important CSS trick — box-sizing. By default, padding and border ADD to the width, which is confusing. Fix it with border-box:"}, {"t": "c", "v": "/* DEFAULT (content-box) — padding ADDS to width: */\n.box {\n  width: 300px;\n  padding: 20px;\n  border: 5px solid black;\n  /* Actual rendered width = 300 + 40 + 10 = 350px! */\n}\n\n/* FIXED (border-box) — padding goes INWARD, width stays predictable: */\n* { box-sizing: border-box; }  /* Put this at the top of EVERY CSS file */\n.box {\n  width: 300px;\n  padding: 20px;\n  border: 5px solid black;\n  /* Actual rendered width = exactly 300px. Always. */\n}"}, {"t": "p", "v": "Margin collapsing — a common gotcha. Vertical margins between elements merge into the larger of the two:"}, {"t": "c", "v": ".box1 { margin-bottom: 30px; }\n.box2 { margin-top: 20px; }\n/* Gap between them = 30px (NOT 50px — they collapse!) */\n\n/* Prevent collapsing by using: */\n.parent { overflow: hidden; }  /* classic fix */\n.parent { display: flex; }     /* flex/grid children never collapse */\n.parent { padding: 1px; }      /* adding any padding prevents it */"}, {"t": "t", "v": "💡 ALWAYS start every CSS file with: * { box-sizing: border-box; margin: 0; padding: 0; } — every professional developer does this. It eliminates countless layout bugs and makes widths predictable."}], "code": {"html": "<!DOCTYPE html>\n<html>\n<head><title>Box Model<\/title><\/head>\n<body>\n  <h2>Same width (200px), different box-sizing:<\/h2>\n  <div class=\"demo\">\n    <div class=\"box default\">Default<br><small>300px + 40px padding + 10px border = 350px actual<\/small><\/div>\n    <div class=\"box fixed\">border-box<br><small>300px total — padding goes inward<\/small><\/div>\n  <\/div>\n\n  <h2>Box Model Playground:<\/h2>\n  <div class=\"playground\">\n    <div class=\"card\">I am a card! Try editing my padding, border, and margin in the CSS panel.<\/div>\n    <div class=\"card\">Margin between us collapses to the larger value.<\/div>\n  <\/div>\n<\/body>\n<\/html>", "css": "body { font-family: sans-serif; padding: 20px; background: #c8d0d3; }\n\n/* Always do this first! */\n* { box-sizing: border-box; }\n\n.demo { display: flex; gap: 30px; margin-bottom: 40px; flex-wrap: wrap; }\n\n.default {\n  background: #ffcccc;\n  border: 5px solid #e53935;\n  padding: 20px;\n  width: 300px;\n  font-size: 13px;\n  box-sizing: content-box; /* override to show difference */\n}\n\n.fixed {\n  background: #ccffcc;\n  border: 5px solid #2e7d32;\n  padding: 20px;\n  width: 300px;\n  font-size: 13px;\n  /* box-sizing: border-box is inherited from * above */\n}\n\n.playground { display: flex; flex-direction: column; }\n.card {\n  background: white;\n  padding: 20px;\n  border: 3px solid #aac6d3;\n  margin: 10px 0;\n  border-radius: 8px;\n  max-width: 400px;\n}", "js": ""}, "ch": {"title": "Box Model Experiments", "desc": "Give one card a 5px dashed border in a different color. Give the other 40px padding. Create a circle: make a div with equal width/height and border-radius: 50%. Center both cards with margin: 0 auto.", "hint": "/* Perfect circle */\n.circle {\n  width: 120px;\n  height: 120px; /* must equal width */\n  border-radius: 50%;\n  background: #f64e4e;\n  margin: 0 auto;\n}\n/* Centre a box */\n.card { margin: 10px auto; }"}, "quiz": [{"q": "What does box-sizing: border-box change?", "opts": ["Adds a border automatically", "Makes padding and border go INWARD so width stays predictable", "Removes all margins", "Fixes the border to the screen"], "a": 1}, {"q": "Which margin shorthand centres a block element horizontally?", "opts": ["margin: center", "margin: 50%", "margin: 0 auto", "margin: auto 0"], "a": 2}, {"q": "What is margin collapsing?", "opts": ["Margins that shrink on mobile", "Adjacent vertical margins merging into the larger of the two", "Margins set to zero", "Negative margins"], "a": 1}, {"q": "The Box Model layers from inside out are:", "opts": ["content → margin → padding → border", "margin → border → padding → content", "padding → content → border → margin", "content → padding → border → margin"], "a": 3}]}, {"id": "c4", "title": "Display & Positioning", "content": [{"t": "p", "v": "The display property controls how an element participates in layout. It's the most fundamental layout property in CSS:"}, {"t": "c", "v": "div { display: block; }       /* full width, new line (default for div, p, h1) */\nspan { display: inline; }     /* content width only, no new line (default for a, strong) */\n.tag { display: inline-block; } /* inline BUT can have width/height/padding */\n.gone { display: none; }      /* completely hidden, removed from layout */\n.row { display: flex; }       /* flexbox children */\n.grid { display: grid; }      /* grid children */"}, {"t": "p", "v": "The position property lets you break elements out of normal document flow:"}, {"t": "c", "v": "/* STATIC — default, normal flow */\n\n/* RELATIVE — offset from its normal position */\n.nudged { position: relative; top: 10px; left: 20px; }\n\n/* ABSOLUTE — positioned relative to nearest non-static ancestor */\n.parent { position: relative; } /* establishes the context */\n.badge {\n  position: absolute;\n  top: -10px;\n  right: -10px;  /* sticks to top-right of .parent */\n}\n\n/* FIXED — stays on screen even when scrolling */\n.sticky-nav { position: fixed; top: 0; left: 0; width: 100%; z-index: 100; }\n\n/* STICKY — scrolls until it hits the threshold, then sticks */\nth { position: sticky; top: 0; background: white; }"}, {"t": "p", "v": "Z-index controls stacking order. Higher number = in front. Only works on positioned elements (not static):"}, {"t": "c", "v": ".backdrop { position: fixed; z-index: 100; }\n.modal    { position: fixed; z-index: 101; } /* above backdrop */\nnav       { position: sticky; z-index: 50; }"}, {"t": "t", "v": "💡 Absolute positioning is always relative to the nearest ancestor with position: relative (or absolute/fixed). If none exists, it's relative to the whole page. Always add position: relative to the parent container!"}], "code": {"html": "<!DOCTYPE html>\n<html>\n<head><title>Positioning<\/title><\/head>\n<body style=\"height:2000px\">\n  <nav class=\"sticky-nav\">📌 Sticky Nav — scroll to see it work<\/nav>\n  <div class=\"container\">\n    <div class=\"card\">\n      Card with a badge\n      <span class=\"badge\">NEW<\/span>\n    <\/div>\n    <div class=\"card tooltip-card\">\n      Hover me\n      <div class=\"tooltip\">I am a tooltip!<\/div>\n    <\/div>\n  <\/div>\n  <p style=\"padding:30px;font-family:sans-serif\">Scroll down to test the sticky nav...<\/p>\n<\/body>\n<\/html>", "css": "* { box-sizing: border-box; margin: 0; }\nbody { font-family: sans-serif; background: #c8d0d3; }\n\n.sticky-nav {\n  position: sticky;\n  top: 0;\n  background: #f64e4e;\n  color: white;\n  padding: 15px 30px;\n  font-size: 18px;\n  z-index: 10;\n}\n\n.container { display: flex; gap: 30px; padding: 40px; flex-wrap: wrap; }\n\n.card {\n  position: relative;\n  background: white;\n  padding: 30px;\n  border-radius: 12px;\n  font-size: 18px;\n}\n\n.badge {\n  position: absolute;\n  top: -12px; right: -12px;\n  background: #f64e4e;\n  color: white;\n  padding: 4px 10px;\n  border-radius: 20px;\n  font-size: 12px;\n  font-weight: bold;\n}\n\n.tooltip {\n  display: none;\n  position: absolute;\n  bottom: 110%;\n  left: 50%;\n  transform: translateX(-50%);\n  background: #333;\n  color: white;\n  padding: 6px 12px;\n  border-radius: 6px;\n  font-size: 13px;\n  white-space: nowrap;\n}\n.tooltip-card:hover .tooltip { display: block; }", "js": ""}, "ch": {"title": "Notification Bell", "desc": "Add a fixed button at bottom-right (position: fixed, bottom: 20px, right: 20px) styled as a circle. Give it a small red badge with the number 3. Make sure it has a high z-index so it sits above everything.", "hint": ".bell {\n  position: fixed;\n  bottom: 20px; right: 20px;\n  width: 60px; height: 60px;\n  background: #f64e4e;\n  border-radius: 50%;\n  display: flex; align-items: center; justify-content: center;\n  font-size: 24px; color: white;\n  z-index: 99;\n}"}, "quiz": [{"q": "What is the default value of the CSS position property?", "opts": ["relative", "absolute", "fixed", "static"], "a": 3}, {"q": "position: absolute is positioned relative to what?", "opts": ["The viewport", "The <body>", "The nearest non-static ancestor", "The previous sibling"], "a": 2}, {"q": "Which display value lets an element stay inline BUT also accept width and height?", "opts": ["block", "flex", "inline-block", "grid"], "a": 2}, {"q": "Which CSS property controls the stacking order of positioned elements?", "opts": ["layer", "order", "depth", "z-index"], "a": 3}]}, {"id": "c5", "title": "Flexbox — The Complete Guide", "content": [{"t": "p", "v": "Flexbox is a one-dimensional layout system. Add display: flex to a container and its direct children become flex items you can arrange, align, and distribute with precision."}, {"t": "c", "v": ".container {\n  display: flex;\n  flex-direction: row;          /* row (default) | column | row-reverse */\n\n  /* Main axis alignment */\n  justify-content: flex-start;  /* default */\n  justify-content: center;\n  justify-content: space-between; /* space between items */\n  justify-content: space-around;\n  justify-content: space-evenly;\n\n  /* Cross axis alignment */\n  align-items: stretch;    /* default — items fill height */\n  align-items: center;     /* vertically centred */\n  align-items: flex-start;\n  align-items: flex-end;\n\n  flex-wrap: wrap;    /* items wrap to new row when no space */\n  gap: 20px;          /* space between items */\n}"}, {"t": "p", "v": "Flex item properties control individual items:"}, {"t": "c", "v": ".item {\n  flex: 1;          /* grow to fill space equally */\n  flex: 2;          /* grow twice as much as flex:1 items */\n  flex: 0 0 200px;  /* fixed 200px, never grow or shrink */\n  align-self: center;  /* override container's align-items */\n  order: 2;            /* visual order (default 0) */\n  min-width: 150px;\n  max-width: 300px;\n}"}, {"t": "t", "v": "💡 Perfect centring with flexbox: .container { display: flex; justify-content: center; align-items: center; height: 100vh; } — centres a child both horizontally and vertically on the screen."}], "code": {"html": "<!DOCTYPE html>\n<html>\n<head><title>Flexbox<\/title><\/head>\n<body>\n  <nav class=\"navbar\">\n    <div class=\"logo\">⚡ Brand<\/div>\n    <div class=\"nav-links\">\n      <a href=\"#\">Home<\/a>\n      <a href=\"#\">About<\/a>\n      <a href=\"#\" class=\"cta-link\">Get Started<\/a>\n    <\/div>\n  <\/nav>\n  <div class=\"hero\">\n    <h1>Perfectly Centred<\/h1>\n    <p>Using flexbox to centre content<\/p>\n  <\/div>\n  <div class=\"card-grid\">\n    <div class=\"card\">🏗️<h3>HTML<\/h3><p>Structure<\/p><\/div>\n    <div class=\"card featured\">🎨<h3>CSS<\/h3><p>Styling (flex: 2)<\/p><\/div>\n    <div class=\"card\">⚡<h3>JS<\/h3><p>Interactivity<\/p><\/div>\n    <div class=\"card\">🚀<h3>Deploy<\/h3><p>Go live<\/p><\/div>\n  <\/div>\n<\/body>\n<\/html>", "css": "* { box-sizing: border-box; margin: 0; }\nbody { font-family: sans-serif; background: #c8d0d3; }\n.navbar { display: flex; justify-content: space-between; align-items: center; background: #f64e4e; padding: 15px 30px; }\n.logo { color: white; font-size: 22px; font-weight: 700; }\n.nav-links { display: flex; gap: 20px; align-items: center; }\n.nav-links a { color: white; text-decoration: none; }\n.cta-link { background: white; color: #f64e4e !important; padding: 8px 16px; border-radius: 8px; font-weight: bold; }\n.hero { height: 200px; display: flex; flex-direction: column; justify-content: center; align-items: center; background: white; gap: 12px; }\n.hero h1 { color: #f64e4e; font-size: 2rem; }\n.card-grid { display: flex; gap: 20px; padding: 30px; flex-wrap: wrap; }\n.card { flex: 1; min-width: 150px; background: white; padding: 24px; border-radius: 12px; text-align: center; font-size: 2rem; }\n.card.featured { background: #f64e4e; color: white; flex: 2; }\n.card h3 { font-size: 1.1rem; margin: 8px 0 4px; }\n.card p { font-size: 0.9rem; opacity: 0.7; }", "js": ""}, "ch": {"title": "Three-Column Layout", "desc": "Below the card grid, add a section with 3 columns: narrow left sidebar (flex:1), wide main content (flex:3), narrow right aside (flex:1). Give each a different background.", "hint": ".layout { display: flex; gap: 20px; padding: 30px; }\n.sidebar { flex: 1; background: #e3edf0; padding: 20px; }\n.content { flex: 3; background: white; padding: 20px; }\n.aside { flex: 1; background: #e3edf0; padding: 20px; }"}, "quiz": [{"q": "Which flexbox property aligns items along the MAIN axis?", "opts": ["align-items", "align-content", "flex-direction", "justify-content"], "a": 3}, {"q": "Which justify-content value puts equal space BETWEEN items only?", "opts": ["space-around", "space-evenly", "space-between", "center"], "a": 2}, {"q": "An item with flex: 2 compared to flex: 1 items will:", "opts": ["Be 2px wide", "Take up 2 columns", "Grow twice as much", "Have 2 children"], "a": 2}, {"q": "Which property allows flex items to wrap onto new rows?", "opts": ["overflow: wrap", "flex-overflow: wrap", "wrap: true", "flex-wrap: wrap"], "a": 3}]}, {"id": "c6", "title": "CSS Grid — Two-Dimensional Layouts", "content": [{"t": "p", "v": "CSS Grid handles two-dimensional layouts — rows AND columns simultaneously. Use Flexbox for one direction; Grid for both (dashboards, galleries, magazine layouts)."}, {"t": "c", "v": ".container {\n  display: grid;\n\n  /* Define columns */\n  grid-template-columns: 200px 1fr 200px;  /* fixed | flexible | fixed */\n  grid-template-columns: repeat(3, 1fr);    /* 3 equal columns */\n  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); /* responsive! */\n\n  gap: 20px;         /* space between all cells */\n  row-gap: 15px;     /* rows only */\n  column-gap: 30px;  /* columns only */\n}"}, {"t": "p", "v": "Items can span multiple columns or rows:"}, {"t": "c", "v": ".header  { grid-column: 1 / -1; }    /* span ALL columns */\n.sidebar { grid-column: 1 / 2; grid-row: 2 / 4; }\n.main    { grid-column: 2 / -1; }\n.feature { grid-column: span 2; } /* spans 2 columns */\n.tall    { grid-row: span 3; }    /* spans 3 rows */\n\n/* Named areas — most readable approach */\n.layout {\n  grid-template-areas:\n    \"header  header\"\n    \"sidebar main  \"\n    \"footer  footer\";\n}\nheader  { grid-area: header; }\n.sidebar { grid-area: sidebar; }"}, {"t": "t", "v": "💡 Use fr (fractional unit) for flexible columns. repeat(auto-fill, minmax(200px, 1fr)) creates as many columns as fit at 200px minimum — no media queries needed. The most useful responsive trick in CSS."}], "code": {"html": "<!DOCTYPE html>\n<html>\n<head><title>CSS Grid<\/title><\/head>\n<body>\n  <div class=\"page\">\n    <header>🎨 Header<\/header>\n    <nav>Nav<\/nav>\n    <main>Main Content<\/main>\n    <aside>Sidebar<\/aside>\n    <footer>Footer<\/footer>\n  <\/div>\n  <h2 style=\"padding:20px\">Auto-Responsive Gallery:<\/h2>\n  <div class=\"gallery\">\n    <div class=\"photo big\">📸 Featured<\/div>\n    <div class=\"photo\">📸<\/div>\n    <div class=\"photo\">📸<\/div>\n    <div class=\"photo\">📸<\/div>\n    <div class=\"photo\">📸<\/div>\n    <div class=\"photo\">📸<\/div>\n  <\/div>\n<\/body>\n<\/html>", "css": "* { box-sizing: border-box; margin: 0; }\nbody { font-family: sans-serif; background: #c8d0d3; }\n.page {\n  display: grid;\n  grid-template-columns: 200px 1fr;\n  grid-template-rows: 60px 300px 50px;\n  grid-template-areas:\n    \"header header\"\n    \"nav    main  \"\n    \"footer footer\";\n  gap: 10px; padding: 20px;\n}\nheader { grid-area: header; background: #f64e4e; color: white; display: flex; align-items: center; padding: 0 20px; border-radius: 8px; }\nnav { grid-area: nav; background: #aac6d3; border-radius: 8px; padding: 15px; }\nmain { grid-area: main; background: white; border-radius: 8px; padding: 20px; }\naside { display: none; }\nfooter { grid-area: footer; background: #333; color: white; display: flex; align-items: center; justify-content: center; border-radius: 8px; }\n.gallery {\n  display: grid;\n  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));\n  gap: 15px; padding: 20px;\n}\n.photo { background: #aac6d3; aspect-ratio: 1; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 2rem; }\n.photo.big { grid-column: span 2; grid-row: span 2; background: #f64e4e; color: white; }", "js": ""}, "ch": {"title": "Dashboard Grid", "desc": "Build a dashboard using grid-template-areas: 4 stat cards in 2x2, a wide chart below spanning 2 columns, a tall activity feed on the right spanning all rows. Use grid-area names.", "hint": ".dashboard {\n  display: grid;\n  grid-template-columns: 1fr 1fr 250px;\n  grid-template-areas:\n    \"s1 s2 feed\"\n    \"s3 s4 feed\"\n    \"chart chart feed\";\n  gap: 15px;\n}"}, "quiz": [{"q": "Which unit represents a fraction of remaining grid space?", "opts": ["%", "gr", "vw", "fr"], "a": 3}, {"q": "grid-column: 1 / -1 makes an item:", "opts": ["Span only the first column", "Span only the last column", "Span all columns", "Span no columns"], "a": 2}, {"q": "Which property lets you name and place grid areas with text?", "opts": ["grid-areas", "grid-zones", "grid-template-areas", "area-template"], "a": 2}, {"q": "repeat(3, 1fr) creates:", "opts": ["3 equal rows", "A 3px gap", "3 equal columns", "3 fractional units"], "a": 2}]}, {"id": "c7", "title": "Responsive Design & Media Queries", "content": [{"t": "p", "v": "Responsive design means your site looks great on all screen sizes. Over 60% of web traffic is mobile — this is not optional. Two key ingredients: the viewport meta tag, and media queries."}, {"t": "c", "v": "<!-- Required in every HTML <head> -->\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<!-- Without this, mobile browsers pretend they're 980px wide -->"}, {"t": "p", "v": "Use relative units instead of fixed pixels:"}, {"t": "c", "v": "%     /* relative to parent */\nvw    /* viewport width  — 100vw = full screen width */\nvh    /* viewport height — 100vh = full screen height */\nrem   /* relative to root font-size (16px = 1rem) */\n\n/* Practical examples */\n.container { max-width: 1200px; width: 90%; margin: 0 auto; }\n.hero      { min-height: 80vh; }\nbody       { font-size: 1rem; }\n\n/* clamp(min, preferred, max) — fluid typography! */\nh1 { font-size: clamp(1.5rem, 5vw, 3rem); }"}, {"t": "p", "v": "Media queries apply styles at specific screen sizes. Use mobile-first: write styles for small screens, then add breakpoints for larger ones:"}, {"t": "c", "v": "/* MOBILE FIRST — start with mobile styles */\n.grid {\n  display: grid;\n  grid-template-columns: 1fr; /* 1 column on mobile */\n  gap: 16px;\n}\n\n/* Tablet — 600px and wider */\n@media (min-width: 600px) {\n  .grid { grid-template-columns: repeat(2, 1fr); }\n  .nav  { display: flex; }\n}\n\n/* Desktop — 900px and wider */\n@media (min-width: 900px) {\n  .grid { grid-template-columns: repeat(3, 1fr); }\n}\n\n/* Other useful queries */\n@media (prefers-color-scheme: dark) { /* dark mode */ }\n@media (orientation: landscape) { /* landscape */ }"}, {"t": "t", "v": "💡 Mobile-first is the modern standard. Use browser DevTools (F12) → device toolbar icon to simulate any phone. Try 375px (iPhone SE) and 390px (iPhone 14) as your mobile test sizes."}], "code": {"html": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <title>Responsive Layout<\/title>\n<\/head>\n<body>\n  <header class=\"header\">\n    <div class=\"logo\">⚡ Code<\/div>\n    <nav class=\"nav\">\n      <a href=\"#\">Home<\/a>\n      <a href=\"#\">About<\/a>\n      <a href=\"#\">Work<\/a>\n      <a href=\"#\">Contact<\/a>\n    <\/nav>\n    <button class=\"menu-btn\">☰<\/button>\n  <\/header>\n  <div class=\"container\">\n    <div class=\"hero\">\n      <h1>Resize This Window!<\/h1>\n      <p>Watch the layout change as you drag the window narrower.<\/p>\n    <\/div>\n    <div class=\"grid\">\n      <div class=\"card\">📱<h3>Mobile<\/h3><p>1 column<\/p><\/div>\n      <div class=\"card\">💻<h3>Tablet<\/h3><p>2 columns<\/p><\/div>\n      <div class=\"card\">🖥️<h3>Desktop<\/h3><p>3 columns<\/p><\/div>\n      <div class=\"card\">🎯<h3>Any Size<\/h3><p>It adapts!<\/p><\/div>\n      <div class=\"card\">📐<h3>Flexible<\/h3><p>Uses %, fr, rem<\/p><\/div>\n      <div class=\"card\">✅<h3>Accessible<\/h3><p>Works for all<\/p><\/div>\n    <\/div>\n  <\/div>\n<\/body>\n<\/html>", "css": "* { box-sizing: border-box; margin: 0; }\nbody { font-family: sans-serif; background: #c8d0d3; }\n\n.header {\n  background: #f64e4e;\n  padding: 15px 20px;\n  display: flex;\n  justify-content: space-between;\n  align-items: center;\n}\n.logo { color: white; font-size: 20px; font-weight: 700; }\n.nav { display: none; gap: 20px; }\n.nav a { color: white; text-decoration: none; }\n.menu-btn { background: transparent; border: 2px solid white; color: white; padding: 6px 10px; border-radius: 6px; cursor: pointer; }\n\n.container { max-width: 1100px; margin: 0 auto; padding: 20px; }\n\n.hero {\n  background: white;\n  padding: 40px 20px;\n  text-align: center;\n  border-radius: 12px;\n  margin-bottom: 20px;\n}\n.hero h1 {\n  color: #f64e4e;\n  font-size: clamp(1.5rem, 5vw, 2.5rem);\n}\n\n/* Mobile: 1 column */\n.grid { display: grid; grid-template-columns: 1fr; gap: 16px; }\n.card { background: white; padding: 24px; border-radius: 12px; text-align: center; font-size: 2rem; }\n.card h3 { font-size: 1rem; margin: 8px 0 4px; }\n.card p { font-size: 0.85rem; opacity: 0.6; }\n\n/* Tablet */\n@media (min-width: 600px) {\n  .nav { display: flex; }\n  .menu-btn { display: none; }\n  .grid { grid-template-columns: repeat(2, 1fr); }\n}\n\n/* Desktop */\n@media (min-width: 900px) {\n  .grid { grid-template-columns: repeat(3, 1fr); }\n  .hero { padding: 80px 40px; }\n}", "js": ""}, "ch": {"title": "Responsive Portfolio", "desc": "Take your Phase 1 portfolio and make it fully responsive. Stack on mobile, 2-3 columns on desktop. Use clamp() for heading sizes. Hide the nav links on mobile and show a ☰ icon instead. Test at 375px width.", "hint": "h1 { font-size: clamp(1.8rem, 5vw, 3.5rem); }\n.projects-grid { grid-template-columns: 1fr; }\n@media (min-width: 768px) {\n  .projects-grid { grid-template-columns: repeat(3, 1fr); }\n}"}, "quiz": [{"q": "What does the viewport meta tag prevent on mobile?", "opts": ["Slow images", "Mobile browsers zooming out to desktop width", "Dark mode switching", "CSS from loading"], "a": 1}, {"q": "Mobile-first CSS means:", "opts": ["Only designing for mobile", "Writing mobile styles first, then adding overrides for larger screens", "Using a mobile framework", "Disabling desktop layouts"], "a": 1}, {"q": "clamp(1rem, 5vw, 3rem) produces a font size that:", "opts": ["Is always 5vw", "Is random", "Has a min of 1rem and a max of 3rem and scales between", "Adds all three values"], "a": 2}, {"q": "Which unit equals 100% of the viewport WIDTH?", "opts": ["100%", "100em", "100vh", "100vw"], "a": 3}]}, {"id": "c8", "title": "Transitions, Transforms & Animations", "content": [{"t": "p", "v": "CSS transitions make property changes smooth instead of instant. The transition property says \"when this value changes, animate it over X seconds\":"}, {"t": "c", "v": ".button {\n  background: #f64e4e;\n  transition: background 0.3s ease;  /* property | duration | timing */\n}\n.button:hover { background: #b71c1c; }\n\n/* Multiple transitions */\n.card {\n  transform: translateY(0);\n  box-shadow: 0 2px 8px rgba(0,0,0,0.1);\n  transition: transform 0.2s ease, box-shadow 0.2s ease;\n}\n.card:hover {\n  transform: translateY(-8px);  /* lifts up */\n  box-shadow: 0 16px 40px rgba(0,0,0,0.15);\n}"}, {"t": "p", "v": "Transforms move, scale, or rotate elements without affecting layout:"}, {"t": "c", "v": "transform: translateX(20px);\ntransform: translateY(-10px);\ntransform: scale(1.1);      /* 10% bigger */\ntransform: rotate(45deg);\ntransform: translateY(-4px) scale(1.02); /* chain them */"}, {"t": "p", "v": "@keyframes creates multi-step animations that run automatically:"}, {"t": "c", "v": "@keyframes slideIn {\n  from { transform: translateY(-100%); opacity: 0; }\n  to   { transform: translateY(0);     opacity: 1; }\n}\n@keyframes pulse {\n  0%, 100% { transform: scale(1); }\n  50%       { transform: scale(1.05); }\n}\n.animated {\n  animation: slideIn 0.5s ease forwards;\n  /* name | duration | easing | fill-mode */\n}\n.pulsing { animation: pulse 2s ease infinite; }"}, {"t": "t", "v": "💡 Only animate transform and opacity for smooth 60fps animations. Animating width, height, or top/left forces the browser to recalculate the entire layout every frame — this causes jank."}], "code": {"html": "<!DOCTYPE html>\n<html>\n<head><title>Transitions<\/title><\/head>\n<body>\n  <div class=\"demo\">\n    <button class=\"btn-demo\">Hover me<\/button>\n    <div class=\"card-hover\">Lift card ↑<\/div>\n    <div class=\"spinner\"><\/div>\n    <div class=\"fade-in\">I faded in!<\/div>\n  <\/div>\n<\/body>\n<\/html>", "css": "* { box-sizing: border-box; margin: 0; }\nbody { font-family: sans-serif; background: #c8d0d3; }\n.demo { display: flex; gap: 30px; padding: 60px 40px; flex-wrap: wrap; align-items: center; }\n\n.btn-demo {\n  background: #f64e4e; color: white;\n  border: none; padding: 14px 28px;\n  border-radius: 8px; font-size: 18px; cursor: pointer;\n  transition: all 0.2s ease;\n}\n.btn-demo:hover { background: #b71c1c; transform: scale(1.05); box-shadow: 0 6px 20px rgba(0,0,0,0.2); }\n.btn-demo:active { transform: scale(0.96); }\n\n.card-hover {\n  background: white; padding: 30px;\n  border-radius: 12px; font-size: 18px; cursor: pointer;\n  transition: transform 0.2s ease, box-shadow 0.2s ease;\n  box-shadow: 0 2px 8px rgba(0,0,0,0.1);\n}\n.card-hover:hover { transform: translateY(-8px); box-shadow: 0 16px 40px rgba(0,0,0,0.15); }\n\n@keyframes spin { to { transform: rotate(360deg); } }\n.spinner {\n  width: 50px; height: 50px;\n  border: 5px solid #aac6d3;\n  border-top-color: #f64e4e;\n  border-radius: 50%;\n  animation: spin 1s linear infinite;\n}\n\n@keyframes fadeInUp {\n  from { opacity: 0; transform: translateY(20px); }\n  to   { opacity: 1; transform: translateY(0); }\n}\n.fade-in { background: white; padding: 20px 30px; border-radius: 8px; animation: fadeInUp 0.6s ease forwards; }", "js": ""}, "ch": {"title": "Animated Feature Cards", "desc": "Create 3 feature cards that lift on hover with a color border change, each fading in with a different animation-delay (0s, 0.15s, 0.3s). Add a loading spinner to the page.", "hint": ".card { animation: fadeInUp 0.5s ease forwards; opacity: 0; }\n.card:nth-child(1) { animation-delay: 0s; }\n.card:nth-child(2) { animation-delay: 0.15s; }\n.card:nth-child(3) { animation-delay: 0.3s; }\n.card:hover { transform: translateY(-6px); border-color: #f64e4e; }"}, "quiz": [{"q": "Which CSS property animates a value change smoothly when a state changes?", "opts": ["animation", "transform", "effect", "transition"], "a": 3}, {"q": "transform: scale(1.1) makes an element:", "opts": ["1.1px larger", "Move 1.1px right", "11% smaller", "110% of its original size"], "a": 3}, {"q": "In @keyframes, which keyword represents the starti
