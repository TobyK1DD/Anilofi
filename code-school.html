ng state?", "opts": ["start", "begin", "initial", "from (or 0%)"], "a": 3}, {"q": "Which two properties should you animate for smooth 60fps performance?", "opts": ["width and height", "top and left", "background and color", "transform and opacity"], "a": 3}]}, {"id": "cm2", "title": "10 Common CSS Mistakes", "content": [{"t": "p", "v": "These CSS mistakes cause hours of frustration for beginners. Know them and you'll debug twice as fast."}, {"t": "c", "v": "/* ❌ MISTAKE 1: Forgetting box-sizing */\n.box {\n  width: 50%;\n  padding: 20px;\n  border: 3px solid black;\n  /* Actual width: 50% + 40px + 6px = wider than 50%! */\n}\n\n/* ✅ FIX: Always add this at the top */\n* { box-sizing: border-box; }"}, {"t": "c", "v": "/* ❌ MISTAKE 2: Using px for font sizes */\nbody { font-size: 16px; }  /* ignores user preferences */\nh1   { font-size: 32px; }\n\n/* ✅ FIX: Use rem — respects user settings */\nbody { font-size: 1rem; }  /* = 16px by default */\nh1   { font-size: 2rem; }  /* = 32px but scales */"}, {"t": "c", "v": "/* ❌ MISTAKE 3: Overusing !important */\n.button { background: red !important; }\n.nav .button { background: blue !important; }\n/* Now nothing overrides anything — debugging nightmare */\n\n/* ✅ FIX: Increase specificity instead */\n.nav .button { background: blue; }  /* wins naturally */"}, {"t": "c", "v": "/* ❌ MISTAKE 4: position: absolute without a parent */\n.badge {\n  position: absolute;\n  top: 0; right: 0;  /* positions relative to the PAGE! */\n}\n\n/* ✅ FIX: Parent must have position: relative */\n.card   { position: relative; }  /* establishes context */\n.badge  { position: absolute; top: 0; right: 0; }  /* now correct */"}, {"t": "c", "v": "/* ❌ MISTAKE 5: Animating layout-triggering properties */\n.box:hover {\n  width: 200px;   /* forces browser to recalculate layout */\n  left: 20px;     /* forces layout recalculation */\n}\n\n/* ✅ FIX: Only animate transform and opacity */\n.box:hover {\n  transform: translateX(20px) scaleX(1.2); /* GPU-accelerated */\n}"}, {"t": "c", "v": "/* ❌ MISTAKE 6: Hardcoded heights that break */\n.card { height: 200px; }  /* breaks when text is long */\n\n/* ✅ FIX: Use min-height or let content set the height */\n.card { min-height: 200px; padding: 20px; }"}, {"t": "c", "v": "/* ❌ MISTAKE 7: Using IDs in CSS */\n#hero-button { background: red; }  /* can't reuse! */\n\n/* ✅ FIX: Classes are reusable */\n.hero-button { background: red; }  /* reusable anywhere */"}, {"t": "t", "v": "💡 The three rules that prevent 80% of CSS bugs: (1) always use * { box-sizing: border-box } — (2) always set position: relative on parents of absolute children — (3) never use !important"}], "code": {"html": "<!DOCTYPE html>\n<html>\n<head><title>CSS Mistakes<\/title><\/head>\n<body>\n  <div class=\"container\">\n    <div class=\"card\">\n      Card 1\n      <span class=\"badge\">NEW<\/span>\n    <\/div>\n    <div class=\"card\">Card 2<\/div>\n  <\/div>\n<\/body>\n<\/html>", "css": "/* Try fixing the bugs in this CSS */\n\n/* BUG 1: Missing box-sizing fix */\n\n.container { display: flex; gap: 20px; padding: 30px; background: #c8d0d3; }\n\n.card {\n  width: 50%;\n  padding: 20px;\n  border: 5px solid #f64e4e;\n  background: white;\n  border-radius: 12px;\n  /* BUG: no position set, badge will escape */\n}\n\n.badge {\n  /* BUG: positions to page, not card */\n  position: absolute;\n  top: 10px;\n  right: 10px;\n  background: #f64e4e;\n  color: white;\n  padding: 4px 10px;\n  border-radius: 20px;\n  font-size: 12px;\n}", "js": ""}, "ch": {"title": "Fix the CSS Bugs", "desc": "Add box-sizing: border-box so cards fit correctly. Add position: relative to .card so the badge positions inside the card, not the page.", "hint": "/* Fix 1: add at top */\n* { box-sizing: border-box; margin: 0; }\n\n/* Fix 2: add to .card */\n.card { position: relative; }"}}], "project": {"title": "🏆 Project 2: Responsive Portfolio", "desc": "Build a fully responsive portfolio with: semantic HTML, sticky navbar (collapses on mobile), animated hero section, projects grid (1 col → 3 col), skills section using CSS Grid, hover effects on all interactive elements, a contact form, and a footer. Must work at 375px and 1440px.", "code": {"html": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  <title>My Portfolio<\/title>\n<\/head>\n<body>\n  <header class=\"header\">\n    <nav class=\"navbar\">\n      <!-- Logo + nav links -->\n    <\/nav>\n  <\/header>\n  <main>\n    <section class=\"hero\">\n      <!-- Name + tagline + CTA -->\n    <\/section>\n    <section class=\"projects\">\n      <h2>Projects<\/h2>\n      <div class=\"projects-grid\">\n        <!-- 3+ project cards -->\n      <\/div>\n    <\/section>\n    <section class=\"skills\">\n      <h2>Skills<\/h2>\n      <!-- Grid of skill badges -->\n    <\/section>\n    <section class=\"contact\">\n      <h2>Contact<\/h2>\n      <!-- Form -->\n    <\/section>\n  <\/main>\n  <footer><\/footer>\n<\/body>\n<\/html>", "css": "* { box-sizing: border-box; margin: 0; padding: 0; }\nbody { font-family: sans-serif; background: #c8d0d3; }", "js": ""}}}, {"id": "js", "label": "Phase 3", "title": "JavaScript", "icon": "⚡", "desc": "Add logic, interactivity, and real power", "lessons": [{"id": "j1", "title": "Variables & All Data Types", "content": [{"t": "p", "v": "JavaScript is the programming language of the web. It runs in the browser and can change your HTML, respond to clicks, do calculations, fetch data — it's the brain behind every interactive website."}, {"t": "p", "v": "Variables store data. There are 5 primitive (simple) types plus arrays and objects:"}, {"t": "c", "v": "// STRING — text in quotes\nconst name    = \"Toby\";\nconst city    = 'Nuneaton';      // single quotes fine too\nconst msg     = `Hello ${name}!`; // template literal (backtick)\n\n// NUMBER — integers and decimals (one type in JS)\nconst age     = 22;\nconst price   = 9.99;\nconst million = 1_000_000;         // underscores for readability\n\n// BOOLEAN — only true or false\nconst isLearning = true;\nconst isExpert   = false;\n\n// NULL — intentionally empty / \"no value\"\nconst selected = null;\n\n// UNDEFINED — declared but not yet assigned\nlet result; // undefined until you set it\n\n// Check types with typeof:\nconsole.log(typeof name);        // \"string\"\nconsole.log(typeof age);         // \"number\"\nconsole.log(typeof isLearning);  // \"boolean\"\nconsole.log(typeof null);        // \"object\" (historic JS bug!)"}, {"t": "p", "v": "const vs let — use const by default. Only use let when you know the value will change later:"}, {"t": "c", "v": "const PI = 3.14159;    // never changes — const\nconst name = \"Toby\";  // never reassigned — const\n\nlet score = 0;         // will change — let\nlet tries = 3;\n\nscore += 10;   // OK — updating a let variable\nname = \"Sam\";  // ERROR! Cannot reassign a const"}, {"t": "t", "v": "💡 Open DevTools (F12 in Chrome) → Console tab. Type any JS and press Enter. It's your personal JavaScript playground — you can test any code instantly without writing HTML."}], "code": {"html": "<!DOCTYPE html>\n<html>\n<head><title>Variables<\/title><\/head>\n<body>\n  <div class=\"card\" id=\"profile\">\n    <h1 id=\"greeting\">Loading...<\/h1>\n    <p id=\"details\">Loading...<\/p>\n    <p id=\"status\">Loading...<\/p>\n  <\/div>\n<\/body>\n<\/html>", "css": "body { font-family: sans-serif; padding: 40px; background: #c8d0d3; }\n.card { background: white; padding: 30px; border-radius: 12px; max-width: 400px; }\nh1 { color: #f64e4e; margin-bottom: 10px; }\np { margin: 6px 0; color: #555; }", "js": "// Change these to your own values!\nconst firstName = \"Toby\";\nconst age = 22;\nconst city = \"Nuneaton\";\nconst isLearning = true;\n\n// Build messages with template literals\nconst greeting = `Hello, I'm ${firstName}!`;\nconst details  = `${age} years old, from ${city}.`;\nconst status   = `Currently learning: ${isLearning}`;\n\n// Check types in the console (press F12!)\nconsole.log(typeof firstName);\nconsole.log(typeof age);\nconsole.log(typeof isLearning);\n\n// Update the page\ndocument.getElementById(\"greeting\").textContent = greeting;\ndocument.getElementById(\"details\").textContent  = details;\ndocument.getElementById(\"status\").textContent   = status;"}, "ch": {"title": "Personal Data Card", "desc": "Add 3 more variables: hobby, favouriteNumber, and a boolean for isWeekend. Display all of them on the page using template literals. Log the typeof each to the console.", "hint": "const hobby = \"gaming\";\nconst favouriteNumber = 7;\nconst isWeekend = true;\n\n// Template literal:\nconst hobbies = `My hobby is ${hobby}. Lucky number: ${favouriteNumber}.`;\n\nconsole.log(typeof hobby);  // \"string\"\nconsole.log(typeof favouriteNumber); // \"number\""}, "quiz": [{"q": "Which keyword should you use by default for variables that will not be reassigned?", "opts": ["let", "var", "const", "fixed"], "a": 2}, {"q": "What does typeof null return in JavaScript?", "opts": ["\"null\"", "\"undefined\"", "\"object\"", "\"boolean\""], "a": 2}, {"q": "What is the result of \"5\" + 3 in JavaScript?", "opts": ["8", "\"8\"", "\"53\"", "Error"], "a": 2}, {"q": "Which of these values is falsy?", "opts": ["\"false\"", "[]", "-1", "0"], "a": 3}]}, {"id": "j2", "title": "Strings — Working with Text", "content": [{"t": "p", "v": "Strings are text values. They have built-in methods — functions that belong to the string — that let you inspect and transform text. Methods always return a NEW string, never changing the original:"}, {"t": "c", "v": "const name = \"  Toby King  \";\n\nname.length              // 12 — number of characters\nname.toUpperCase()       // \"  TOBY KING  \"\nname.toLowerCase()       // \"  toby king  \"\nname.trim()              // \"Toby King\" — removes whitespace\nname.includes(\"Toby\")    // true\nname.startsWith(\"  T\")   // true\nname.endsWith(\"  \")      // true\nname.indexOf(\"King\")     // 7 — position (-1 if not found)\n\n// Extract a portion: slice(start, end)\nname.trim().slice(0, 4)  // \"Toby\"\nname.trim().slice(5)     // \"King\" (to end)\nname.trim().slice(-4)    // \"King\" (last 4 chars)\n\n// Replace\nname.replace(\"Toby\", \"Sarah\")  // \"  Sarah King  \"\n\n// Split into array\n\"one,two,three\".split(\",\")  // [\"one\", \"two\", \"three\"]\n\"hello\".split(\"\")           // [\"h\",\"e\",\"l\",\"l\",\"o\"]\n\n// Join array back to string\n[\"h\",\"e\",\"l\",\"l\",\"o\"].join(\"\") // \"hello\"\n\n// Template literals (backticks)\nconst greeting = `Hello, ${name.trim()}! You have ${3 + 2} messages.`;"}, {"t": "t", "v": "💡 Strings are immutable — methods never change the original string, they return a new one. Always store the result: const trimmed = name.trim(); — calling name.trim() without storing it does nothing."}], "code": {"html": "<!DOCTYPE html>\n<html>\n<head><title>String Explorer<\/title><\/head>\n<body>\n  <h1>String Explorer<\/h1>\n  <input type=\"text\" id=\"input\" placeholder=\"Type anything...\" oninput=\"analyse()\">\n  <div id=\"results\"><\/div>\n<\/body>\n<\/html>", "css": "body { font-family: sans-serif; padding: 30px; background: #c8d0d3; max-width: 500px; }\nh1 { color: #f64e4e; margin-bottom: 20px; }\ninput { width: 100%; padding: 12px; border: 3px solid #aac6d3; border-radius: 8px; font-size: 16px; outline: none; margin-bottom: 16px; }\ninput:focus { border-color: #f64e4e; }\n.row { background: white; padding: 10px 14px; border-radius: 8px; margin: 6px 0; display: flex; justify-content: space-between; }\n.label { font-weight: bold; color: #555; font-size: 14px; }\n.val { color: #f64e4e; font-family: monospace; font-size: 14px; max-width: 200px; overflow: hidden; text-overflow: ellipsis; }", "js": "function analyse() {\n  const raw = document.getElementById(\"input\").value;\n  const t = raw.trim();\n  const rows = [\n    [\"Original\",           raw],\n    [\"Trimmed\",            t],\n    [\"Length (trimmed)\",   t.length],\n    [\"UPPERCASE\",          t.toUpperCase()],\n    [\"lowercase\",          t.toLowerCase()],\n    [\"Reversed\",           t.split(\"\").reverse().join(\"\")],\n    [\"Word count\",         t ? t.split(/\\s+/).filter(Boolean).length : 0],\n    [\"Has numbers?\",       /\\d/.test(t)],\n    [\"First 5 chars\",      t.slice(0, 5) || \"-\"],\n    [\"Starts with capital?\", t.length > 0 && t[0] === t[0].toUpperCase() && isNaN(t[0])],\n  ];\n  document.getElementById(\"results\").innerHTML = rows\n    .map(([l, v]) => `<div class=\"row\"><span class=\"label\">${l}<\/span><span class=\"val\">${v}<\/span><\/div>`)\n    .join(\"\");\n}"}, "ch": {"title": "Username Validator", "desc": "Build a username validator. As the user types, check: at least 3 characters, no spaces, all lowercase, no special characters. Show ✅ or ❌ for each rule. Show \"Valid username!\" when all rules pass.", "hint": "const hasNoSpaces = !username.includes(\" \");\nconst isLongEnough = username.length >= 3;\nconst isLowercase  = username === username.toLowerCase();\nconst noSpecials   = /^[a-z0-9_]+$/.test(username);\nconst isValid = hasNoSpaces && isLongEnough && isLowercase && noSpecials;"}, "quiz": [{"q": "Strings are immutable. What does that mean?", "opts": ["They cannot be compared", "String methods always return a NEW string, never changing the original", "They cannot contain spaces", "They cannot be empty"], "a": 1}, {"q": "Which string method removes whitespace from both ends?", "opts": ["strip()", "clean()", "remove()", "trim()"], "a": 3}, {"q": "The backtick syntax `Hello ${name}!` is called a:", "opts": ["Variable injection", "String formatter", "Template literal", "Interpolated string"], "a": 2}, {"q": "\"hello\".slice(1, 3) returns:", "opts": ["\"he\"", "\"ell\"", "\"el\"", "\"llo\""], "a": 2}]}, {"id": "j3", "title": "Numbers & Maths", "content": [{"t": "p", "v": "JavaScript has one number type for both integers and decimals. The Math object has useful mathematical functions built in:"}, {"t": "c", "v": "// Arithmetic\n10 + 3   // 13    addition\n10 - 3   // 7     subtraction\n10 * 3   // 30    multiplication\n10 / 3   // 3.333 division\n10 % 3   // 1     remainder (modulo)\n10 ** 2  // 100   exponent (power)\n\nlet x = 5;\nx++       // x is now 6  (increment)\nx--       // x is now 5  (decrement)\nx += 10;  // x is now 15\nx *= 2;   // x is now 30\n\n// Math object\nMath.round(4.6)     // 5  — nearest integer\nMath.floor(4.9)     // 4  — always rounds DOWN\nMath.ceil(4.1)      // 5  — always rounds UP\nMath.abs(-7)        // 7  — absolute (remove minus sign)\nMath.max(3, 7, 1)   // 7  — largest\nMath.min(3, 7, 1)   // 1  — smallest\nMath.sqrt(16)       // 4  — square root\nMath.PI             // 3.14159...\n\n// Random number (0 to less-than-1)\nMath.random()                              // e.g. 0.724\nMath.floor(Math.random() * 6) + 1         // dice roll: 1-6\nMath.floor(Math.random() * (max-min+1)) + min // between min and max"}, {"t": "p", "v": "Type conversion — switching between strings and numbers:"}, {"t": "c", "v": "Number(\"42\")         // 42\nparseInt(\"42px\")     // 42 — ignores non-numeric end\nparseFloat(\"3.14\")   // 3.14\nString(42)           // \"42\"\n(3.14159).toFixed(2) // \"3.14\" — round to 2 decimal places\n\n// GOTCHA: + with a string does concatenation!\n\"5\" + 3    // \"53\"  NOT 8!\nNumber(\"5\") + 3  // 8  correct\n\n// NaN = Not a Number\nNumber(\"hello\")  // NaN\nisNaN(\"hello\")   // true\nisNaN(42)        // false"}, {"t": "t", "v": "💡 NaN means \"Not a Number\" — the result of impossible maths like 0/0 or Number(\"abc\"). Weirdly, typeof NaN === \"number\". Use isNaN() to check. Always validate user input before using it in calculations."}], "code": {"html": "<!DOCTYPE html>\n<html>\n<head><title>Calculator<\/title><\/head>\n<body>\n  <div class=\"calc\">\n    <h1>Calculator<\/h1>\n    <input type=\"number\" id=\"num1\" placeholder=\"First number\">\n    <select id=\"op\">\n      <option value=\"+\">+<\/option>\n      <option value=\"-\">−<\/option>\n      <option value=\"*\">×<\/option>\n      <option value=\"/\">÷<\/option>\n      <option value=\"%\">%<\/option>\n      <option value=\"**\">^<\/option>\n    <\/select>\n    <input type=\"number\" id=\"num2\" placeholder=\"Second number\">\n    <button onclick=\"calc()\">=<\/button>\n    <div id=\"result\" class=\"result\">?<\/div>\n  <\/div>\n<\/body>\n<\/html>", "css": "body { font-family: sans-serif; background: #c8d0d3; display: flex; justify-content: center; padding: 60px 20px; }\n.calc { background: white; padding: 40px; border-radius: 16px; text-align: center; width: 340px; }\nh1 { color: #f64e4e; margin-bottom: 24px; }\ninput { width: 100px; padding: 10px; border: 3px solid #aac6d3; border-radius: 8px; font-size: 18px; text-align: center; }\nselect { padding: 10px; border: 3px solid #aac6d3; border-radius: 8px; font-size: 18px; margin: 0 8px; }\nbutton { display: block; margin: 20px auto 0; background: #f64e4e; color: white; border: none; width: 50px; height: 50px; border-radius: 50%; font-size: 22px; cursor: pointer; }\n.result { font-size: 2.5rem; font-weight: bold; color: #f64e4e; margin-top: 16px; }", "js": "function calc() {\n  const a = parseFloat(document.getElementById(\"num1\").value);\n  const b = parseFloat(document.getElementById(\"num2\").value);\n  const op = document.getElementById(\"op\").value;\n  const el = document.getElementById(\"result\");\n  \n  if (isNaN(a) || isNaN(b)) {\n    el.textContent = \"Enter numbers!\";\n    return;\n  }\n  \n  let r;\n  if (op === \"+\") r = a + b;\n  else if (op === \"-\") r = a - b;\n  else if (op === \"*\") r = a * b;\n  else if (op === \"/\") r = b === 0 ? \"Can't divide by 0!\" : a / b;\n  else if (op === \"%\") r = a % b;\n  else if (op === \"**\") r = a ** b;\n  \n  el.textContent = typeof r === \"number\" ? r.toFixed(4).replace(/\\.?0+$/, \"\") : r;\n}"}, "ch": {"title": "Dice Roller", "desc": "Build a dice roller. Add a dropdown for dice type (d4, d6, d8, d10, d12, d20). Show a big random roll result on click. Add a \"Roll History\" list showing the last 5 results.", "hint": "function roll() {\n  const sides = parseInt(document.getElementById(\"dice\").value);\n  const result = Math.floor(Math.random() * sides) + 1;\n  document.getElementById(\"result\").textContent = result;\n  addToHistory(`d${sides}: ${result}`);\n}"}, "quiz": [{"q": "Which Math method ALWAYS rounds a number DOWN?", "opts": ["Math.round()", "Math.ceil()", "Math.truncate()", "Math.floor()"], "a": 3}, {"q": "What does 10 % 3 return?", "opts": ["3", "0.33", "3.33", "1"], "a": 3}, {"q": "What does isNaN(\"hello\") return?", "opts": ["false", "\"NaN\"", "undefined", "true"], "a": 3}, {"q": "Which function converts \"42px\" to the number 42, ignoring the text?", "opts": ["Number()", "toNumber()", "parseFloat()", "parseInt()"], "a": 3}]}, {"id": "j4", "title": "Conditionals — Making Decisions", "content": [{"t": "p", "v": "\"If this is true, do that. Otherwise, do something else.\" Conditionals are the core of programming logic — they let your code make decisions based on data."}, {"t": "c", "v": "const age = 17;\n\n// Basic if\nif (age >= 18) {\n  console.log(\"You can vote!\");\n}\n\n// if...else\nif (age >= 18) {\n  console.log(\"Adult\");\n} else {\n  console.log(\"Minor\");\n}\n\n// if...else if...else (chain of conditions)\nif (age >= 65) {\n  console.log(\"Senior\");\n} else if (age >= 18) {\n  console.log(\"Adult\");\n} else if (age >= 13) {\n  console.log(\"Teen\");\n} else {\n  console.log(\"Child\");\n}"}, {"t": "p", "v": "Comparison and logical operators are the tools you build conditions with:"}, {"t": "c", "v": "// Comparison (always use === and !==, not == and !=)\n5 === 5    // true  (strict equal)\n5 !== 3    // true  (strict not equal)\n5 > 3      // true\n5 < 3      // false\n5 >= 5     // true\n\n// Why === matters:\n0 == \"\"    // true  (double equals has quirks!)\n0 === \"\"   // false (strict equals is correct)\n\n// Logical operators\n(age >= 18) && (hasID === true)  // AND — both must be true\n(isWeekend) || (isHoliday)      // OR  — at least one must be true\n!isRaining                       // NOT — flips true to false\n\n// Ternary — one-liner if/else\nconst label = age >= 18 ? \"Adult\" : \"Minor\";\n// Reads: \"if age >= 18 then 'Adult' else 'Minor'\"\n\n// Switch — cleaner than many else ifs\nswitch (day) {\n  case \"Monday\":  console.log(\"Start of week!\"); break;\n  case \"Friday\":  console.log(\"Nearly there!\"); break;\n  case \"Saturday\":\n  case \"Sunday\":  console.log(\"Weekend!\"); break;\n  default:        console.log(\"Midweek\");\n}"}, {"t": "p", "v": "Truthy and falsy — JavaScript values that behave like true or false in conditions:"}, {"t": "c", "v": "// FALSY (treated as false in if statements):\nfalse, 0, \"\", null, undefined, NaN\n\n// TRUTHY (everything else):\ntrue, 1, \"hello\", [], {}, -1\n\n// Useful shorthand:\nconst name = \"Toby\";\nif (name) { console.log(\"Has a name!\"); }  // same as name !== \"\"\n\nconst items = [];\nif (items.length) { console.log(\"Has items!\"); }  // same as items.length > 0"}, {"t": "t", "v": "💡 Common mistake: using = (assignment) instead of === (comparison) inside an if. if (x = 5) always runs! if (x === 5) is what you meant. Your code editor should warn you about this."}], "code": {"html": "<!DOCTYPE html>\n<html>\n<head><title>Grade Calculator<\/title><\/head>\n<body>\n  <div class=\"app\">\n    <h1>Grade Calculator<\/h1>\n    <label>Your score (0–100):<\/label>\n    <input type=\"number\" id=\"score\" min=\"0\" max=\"100\" placeholder=\"e.g. 75\" oninput=\"check()\">\n    <div class=\"result\" id=\"result\">\n      <span id=\"grade\" class=\"grade\">?<\/span>\n      <span id=\"msg\"><\/span>\n    <\/div>\n    <div class=\"bar-wrap\"><div class=\"bar\" id=\"bar\"><\/div><\/div>\n  <\/div>\n<\/body>\n<\/html>", "css": "body { font-family: sans-serif; background: #c8d0d3; display: flex; justify-content: center; padding: 60px 20px; }\n.app { background: white; padding: 40px; border-radius: 16px; width: 380px; }\nh1 { color: #f64e4e; margin-bottom: 20px; }\nlabel { display: block; margin-bottom: 8px; font-weight: bold; }\ninput { width: 100%; padding: 12px; border: 3px solid #aac6d3; border-radius: 8px; font-size: 20px; text-align: center; outline: none; margin-bottom: 20px; }\ninput:focus { border-color: #f64e4e; }\n.result { display: flex; align-items: center; gap: 16px; margin-bottom: 16px; }\n.grade { font-size: 3rem; font-weight: bold; color: #f64e4e; min-width: 60px; }\n#msg { font-size: 16px; color: #555; }\n.bar-wrap { height: 16px; background: #e0e0e0; border-radius: 8px; overflow: hidden; }\n.bar { height: 100%; width: 0; background: #f64e4e; border-radius: 8px; transition: width 0.4s ease, background 0.3s; }", "js": "function check() {\n  const score = parseInt(document.getElementById(\"score\").value);\n  const grade = document.getElementById(\"grade\");\n  const msg   = document.getElementById(\"msg\");\n  const bar   = document.getElementById(\"bar\");\n  \n  if (isNaN(score) || score < 0 || score > 100) {\n    grade.textContent = \"?\";\n    msg.textContent = \"\";\n    bar.style.width = \"0%\";\n    return;\n  }\n  \n  let g, m, color;\n  if (score >= 90)      { g=\"A\"; m=\"Excellent! Outstanding!\"; color=\"#2e7d32\"; }\n  else if (score >= 80) { g=\"B\"; m=\"Great job! Above average.\"; color=\"#1565c0\"; }\n  else if (score >= 70) { g=\"C\"; m=\"Good. Room to improve.\"; color=\"#e65100\"; }\n  else if (score >= 60) { g=\"D\"; m=\"Below average. Keep trying!\"; color=\"#b71c1c\"; }\n  else                  { g=\"F\"; m=\"Failed. Review the material.\"; color=\"#b71c1c\"; }\n  \n  grade.textContent = g;\n  grade.style.color = color;\n  msg.textContent   = m;\n  bar.style.width   = score + \"%\";\n  bar.style.background = color;\n}"}, "ch": {"title": "Password Strength Checker", "desc": "Build a password strength checker. As the user types, show ✅ or ❌ for: at least 8 chars, has uppercase, has lowercase, has a number, has a special character. Show a \"Weak / Fair / Strong / Very Strong\" label based on how many rules pass.", "hint": "const hasUpper   = /[A-Z]/.test(pwd);\nconst hasLower   = /[a-z]/.test(pwd);\nconst hasNumber  = /[0-9]/.test(pwd);\nconst hasSpecial = /[!@#$%^&*]/.test(pwd);\nconst longEnough = pwd.length >= 8;\n\nconst strength = [hasUpper,hasLower,hasNumber,hasSpecial,longEnough].filter(Boolean).length;\nconst labels = [\"\",\"Weak\",\"Fair\",\"Good\",\"Strong\",\"Very Strong\"];"}, "quiz": [{"q": "Why should you use === instead of == in JavaScript?", "opts": ["=== is faster", "== is deprecated", "=== checks both VALUE and TYPE", "They are identical"], "a": 2}, {"q": "The ternary operator syntax is:", "opts": ["if(x) ? y : z", "x then y else z", "(x, y, z)", "x ? y : z"], "a": 3}, {"q": "Which of these is NOT falsy in JavaScript?", "opts": ["0", "\"\"", "null", "\"false\""], "a": 3}, {"q": "In a switch statement, what does \"break\" prevent?", "opts": ["Ending the switch", "The program crashing", "Falling through to the next case", "Declaring variables"], "a": 2}]}, {"id": "j5", "title": "Loops — Repeating Actions", "content": [{"t": "p", "v": "Loops run code multiple times without copy-pasting. They're essential for working with lists, processing data, and building repetitive UI elements."}, {"t": "c", "v": "// FOR loop — when you know how many times\nfor (let i = 0; i < 5; i++) {\n  console.log(`Step ${i}`);\n}\n// Logs: 0 1 2 3 4\n\n// Count DOWN\nfor (let i = 10; i >= 1; i--) {\n  console.log(i);\n}\n\n// Loop over array by index\nconst names = [\"Alice\", \"Bob\", \"Charlie\"];\nfor (let i = 0; i < names.length; i++) {\n  console.log(`${i}: ${names[i]}`);\n}"}, {"t": "p", "v": "Cleaner ways to loop over arrays:"}, {"t": "c", "v": "// FOR...OF — clean and readable\nconst fruits = [\"apple\", \"banana\", \"cherry\"];\nfor (const fruit of fruits) {\n  console.log(fruit);\n}\n\n// FOREACH — array method with a callback\nfruits.forEach((fruit, index) => {\n  console.log(`${index}: ${fruit}`);\n});\n\n// WHILE — when you don't know how many times\nlet attempts = 0;\nwhile (attempts < 3) {\n  console.log(`Attempt ${attempts + 1}`);\n  attempts++;\n}\n\n// BREAK — exit loop early\nfor (let i = 0; i < 100; i++) {\n  if (i === 5) break;  // stop here\n}\n\n// CONTINUE — skip current iteration\nfor (let i = 0; i < 10; i++) {\n  if (i % 2 === 0) continue; // skip even numbers\n  console.log(i); // logs: 1 3 5 7 9\n}"}, {"t": "t", "v": "💡 The most common loop mistake: infinite loops. If your loop condition never becomes false, the browser tab freezes. Always make sure your loop variable changes each iteration (i++, attempts++, etc.)."}], "code": {"html": "<!DOCTYPE html>\n<html>\n<head><title>Loop Visualiser<\/title><\/head>\n<body>\n  <h1>Loop Visualiser<\/h1>\n  <div class=\"controls\">\n    <input type=\"number\" id=\"count\" value=\"5\" min=\"1\" max=\"20\">\n    <button onclick=\"buildGrid()\">Build Grid<\/button>\n    <button onclick=\"countDown()\">Count Down<\/button>\n    <button onclick=\"fizzBuzz()\">FizzBuzz<\/button>\n  <\/div>\n  <div id=\"output\"><\/div>\n<\/body>\n<\/html>", "css": "body { font-family: sans-serif; padding: 20px; background: #c8d0d3; }\nh1 { color: #f64e4e; margin-bottom: 16px; }\n.controls { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; align-items: center; }\ninput { width: 60px; padding: 8px; border: 3px solid #aac6d3; border-radius: 8px; font-size: 16px; text-align: center; }\nbutton { background: #f64e4e; color: white; border: 3px solid white; padding: 10px 18px; border-radius: 8px; cursor: pointer; font-family: sans-serif; }\n.grid { display: flex; flex-wrap: wrap; gap: 8px; }\n.box { min-width: 50px; height: 50px; background: white; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #f64e4e; font-size: 13px; padding: 4px; }\n.box.fizz { background: #aac6d3; color: #333; }\n.box.buzz { background: #f64e4e; color: white; }\n.box.fb   { background: #333; color: white; }", "js": "function buildGrid() {\n  const n = parseInt(document.getElementById(\"count\").value);\n  let html = '<div class=\"grid\">';\n  for (let i = 1; i <= n * n; i++) {\n    html += `<div class=\"box\">${i}<\/div>`;\n  }\n  html += '<\/div>';\n  document.getElementById(\"output\").innerHTML = html;\n}\n\nfunction countDown() {\n  const n = parseInt(document.getElementById(\"count\").value);\n  const nums = [];\n  for (let i = n; i >= 1; i--) nums.push(i);\n  document.getElementById(\"output\").innerHTML =\n    `<p style=\"font-size:1.5rem\">🚀 ${nums.join(\" → \")} → Launch!<\/p>`;\n}\n\nfunction fizzBuzz() {\n  const n = parseInt(document.getElementById(\"count\").value);\n  let html = '<div class=\"grid\">';\n  for (let i = 1; i <= n; i++) {\n    const fb = i % 15 === 0, f = i % 3 === 0, b = i % 5 === 0;\n    const cls = fb ? \"fb\" : f ? \"fizz\" : b ? \"buzz\" : \"\";\n    const txt = fb ? \"FizzBuzz\" : f ? \"Fizz\" : b ? \"Buzz\" : i;\n    html += `<div class=\"box ${cls}\">${txt}<\/div>`;\n  }\n  html += '<\/div>';\n  document.getElementById(\"output\").innerHTML = html;\n}\n\nbuildGrid();"}, "ch": {"title": "Times Table Generator", "desc": "Build a times table. Take a number from an input (1-12). Use nested loops (a loop inside a loop) to build an HTML table where each cell shows row × column. Highlight the diagonal (where row === col) in a different color.", "hint": "for (let row = 1; row <= n; row++) {\n  html += \"<tr>\";\n  for (let col = 1; col <= n; col++) {\n    const isDiag = row === col;\n    html += `<td style=\"${isDiag ? \"background:#f64e4e;color:white\" : \"\"}\">${row * col}<\/td>`;\n  }\n  html += \"<\/tr>\";\n}"}, "quiz": [{"q": "An infinite loop is a loop where:", "opts": ["It runs 1000 times exactly", "Its condition never becomes false", "It contains a break statement", "It is recursive"], "a": 1}, {"q": "for (const item of items) iterates over:", "opts": ["Object keys", "Array indices", "Object values", "Array values"], "a": 3}, {"q": "Which keyword skips the current loop iteration and moves to the next?", "opts": ["break", "return", "skip", "continue"], "a": 3}, {"q": "forEach() is a method available on which data type?", "opts": ["Objects", "Strings", "Numbers", "Arrays"], "a": 3}]}, {"id": "j6", "title": "Arrays — Lists of Data", "content": [{"t": "p", "v": "Arrays store ordered lists of values. They're the most common data structure in JavaScript. Almost every real app uses arrays — lists of users, posts, products, scores, etc."}, {"t": "c", "v": "// Creating arrays\nconst empty   = [];\nconst fruits  = [\"apple\", \"banana\", \"cherry\"];\nconst numbers = [1, 2, 3, 4, 5];\nconst mixed   = [\"Toby\", 22, true, null]; // any types\n\n// Accessing items — INDEX STARTS AT 0!\nfruits[0]   // \"apple\"   (first)\nfruits[1]   // \"banana\"  (second)\nfruits[2]   // \"cherry\"  (third)\nfruits[3]   // undefined (doesn't exist)\nfruits[fruits.length - 1]  // \"cherry\" (last item always)\n\n// Modifying\nfruits[1] = \"mango\";  // replace \"banana\"\n\n// Length\nfruits.length  // 3"}, {"t": "p", "v": "Adding, removing, and searching arrays:"}, {"t": "c", "v": "const items = [\"a\", \"b\", \"c\"];\n\nitems.push(\"d\");        // ADD to end    → [\"a\",\"b\",\"c\",\"d\"]\nconst last = items.pop(); // REMOVE from end → last = \"d\"\n\nitems.unshift(\"z\");     // ADD to start  → [\"z\",\"a\",\"b\",\"c\"]\nconst first = items.shift(); // REMOVE from start → first = \"z\"\n\nitems.includes(\"b\")     // true  — does it exist?\nitems.indexOf(\"b\")      // 1     — what position? (-1 if not found)\n\nitems.join(\", \")        // \"a, b, c\" — join to string\nitems.slice(1, 3)       // [\"b\",\"c\"] — copy a portion\n\n// Combine arrays with spread\nconst all = [...items, \"x\", \"y\", \"z\"]; // spread\n\n// Sort\n[3,1,2].sort((a,b) => a - b);  // [1,2,3] ascending\n[3,1,2].sort((a,b) => b - a);  // [3,2,1] descending"}, {"t": "t", "v": "💡 Arrays in JavaScript are zero-indexed — the first item is always at index [0]. This trips up almost every beginner. Think of it as \"0 steps from the start of the list\"."}], "code": {"html": "<!DOCTYPE html>\n<html>\n<head><title>Shopping List<\/title><\/head>\n<body>\n  <div class=\"app\">\n    <h1>🛒 Shopping List<\/h1>\n    <div class=\"input-row\">\n      <input type=\"text\" id=\"inp\" placeholder=\"Add item...\" onkeydown=\"if(event.key==='Enter')add()\">\n      <button onclick=\"add()\">Add<\/button>\n    <\/div>\n    <p id=\"stats\" class=\"stats\"><\/p>\n    <ul id=\"list\"><\/ul>\n    <button onclick=\"clearAll()\" class=\"clear\">Clear All<\/button>\n  <\/div>\n<\/body>\n<\/html>", "css": "body { font-family: sans-serif; background: #c8d0d3; display: flex; justify-content: center; padding: 40px 20px; }\n.app { background: white; padding: 30px; border-radius: 16px; width: 100%; max-width: 400px; }\nh1 { color: #f64e4e; margin-bottom: 20px; }\n.input-row { display: flex; gap: 10px; margin-bottom: 14px; }\ninput { flex: 1; padding: 10px; border: 3px solid #aac6d3; border-radius: 8px; font-size: 16px; outline: none; }\ninput:focus { border-color: #f64e4e; }\nbutton { background: #f64e4e; color: white; border: none; padding: 10px 18px; border-radius: 8px; cursor: pointer; font-family: sans-serif; }\n.stats { font-size: 14px; color: #888; margin-bottom: 12px; }\nul { list-style: none; padding: 0; }\nli { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; background: #f9f9f9; border-radius: 8px; margin: 6px 0; }\nli.done { text-decoration: line-through; opacity: 0.5; }\n.del { background: #e53935; color: white; border: none; width: 28px; height: 28px; border-radius: 50%; cursor: pointer; font-size: 16px; }\n.clear { width: 100%; margin-top: 12px; background: #555; }", "js": "// The shopping list is stored as a JavaScript array\nlet items = [\"Milk\", \"Bread\", \"Eggs\"];\n\nfunction render() {\n  // Build the UI from the array using map()\n  document.getElementById(\"list\").innerHTML = items\n    .map((item, i) => `\n      <li id=\"li-${i}\">\n        <span onclick=\"toggle(${i})\" style=\"cursor:pointer\">${item}<\/span>\n        <button class=\"del\" onclick=\"remove(${i})\">×<\/button>\n      <\/li>\n    `).join(\"\");\n  \n  document.getElementById(\"stats\").textContent =\n    `${items.length} item${items.length !== 1 ? \"s\" : \"\"} in list`;\n}\n\nfunction add() {\n  const inp = document.getElementById(\"inp\");\n  const text = inp.value.trim();\n  if (!text) return;\n  items.push(text);   // ADD to array\n  inp.value = \"\";\n  render();\n}\n\nfunction remove(i) {\n  items.splice(i, 1); // REMOVE from array\n  render();\n}\n\nfunction toggle(i) {\n  document.getElementById(`li-${i}`).classList.toggle(\"done\");\n}\n\nfunction clearAll() {\n  items = [];         // EMPTY the array\n  render();\n}\n\nrender();"}, "ch": {"title": "Search & Sort", "desc": "Add a search input that filters items as you type using .filter() and .includes(). Add a \"Sort A–Z\" button that sorts the items. Show the count of filtered vs total items in the stats bar.", "hint": "// Filter\nconst filtered = items.filter(item =>\n  item.toLowerCase().includes(query.toLowerCase())\n);\n\n// Sort (copy with spread first to avoid mutation)\nconst sorted = [...items].sort();"}, "quiz": [{"q": "What index does the FIRST item in a JavaScript array have?", "opts": ["1", "-1", "first", "0"], "a": 3}, {"q": "Which method adds an item to the END of an array?", "opts": ["unshift()", "add()", "append()", "push()"], "a": 3}, {"q": "How do you make a safe shallow copy of an array?", "opts": ["arr.copy()", "Array(arr)", "arr.clone()", "[...arr]"], "a": 3}, {"q": "fruits[fruits.length - 1] gives you:", "opts": ["undefined", "The second item", "An error", "The last item"], "a": 3}]}, {"id": "j7", "title": "Array Methods — filter, map, find & more", "content": [{"t": "p", "v": "Modern JavaScript has powerful array methods that transform data elegantly. These replace manual loops in almost all real codebases — learn these and you'll write much cleaner code."}, {"t": "c", "v": "const products = [\n  { name: \"Laptop\",   price: 999,  inStock: true  },\n  { name: \"Mouse\",    price: 25,   inStock: true  },\n  { name: \"Monitor\",  price: 350,  inStock: false },\n  { name: \"Keyboard\", price: 75,   inStock: true  },\n];\n\n// FILTER — keep items that pass a test, returns new array\nconst available  = products.filter(p => p.inStock);\nconst affordable = products.filter(p => p.price < 100);\n\n// MAP — transform every item, returns new array (same length)\nconst names       = products.map(p => p.name);\nconst withSale    = products.map(p => ({ ...p, price: p.price * 0.9 }));\n\n// FIND — first item that matches (NOT an array)\nconst laptop = products.find(p => p.name === \"Laptop\");\n\n// FINDINDEX — index of first match (-1 if not found)\nconst idx = products.findIndex(p => p.name === \"Mouse\"); // 1\n\n// SOME — true if ANY item passes the test\nconst hasExpensive = products.some(p => p.price > 500); // true\n\n// EVERY — true if ALL items pass the test\nconst allInStock  = products.every(p => p.inStock);     // false\n\n// REDUCE — accumulate a single value from the array\nconst total = products.reduce((sum, p) => sum + p.price, 0);\n// 1449\n\n// CHAINING — methods return arrays so you can chain them!\nconst affordableNames = products\n  .filter(p => p.inStock)\n  .filter(p => p.price < 200)\n  .map(p => p.name);\n// [\"Mouse\", \"Keyboard\"]"}, {"t": "t", "v": "💡 These methods never modify the original array — they always return a new one. This is \"immutability\" and is best practice. You can chain them because each returns a new array to work with."}], "code": {"html": "<!DOCTYPE html>\n<html>\n<head><title>Product Filter<\/title><\/head>\n<body>\n  <div class=\"app\">\n    <h1>🛍️ Product Filter<\/h1>\n    <div class=\"filters\">\n      <input type=\"text\" id=\"search\" placeholder=\"Search...\" oninput=\"render()\">\n      <select id=\"sort\" onchange=\"render()\">\n        <option value=\"\">Sort: Default<\/option>\n        <option value=\"asc\">Price: Low → High<\/option>\n        <option value=\"desc\">Price: High → Low<\/option>\n        <option value=\"name\">Name A–Z<\/option>\n      <\/select>\n      <label><input type=\"checkbox\" id=\"instock\" onchange=\"render()\"> In Stock Only<\/label>\n    <\/div>\n    <p id=\"stats\" class=\"stats\"><\/p>\n    <div class=\"grid\" id=\"products\"><\/div>\n  <\/div>\n<\/body>\n<\/html>", "css": "* { box-sizing: border-box; }\nbody { font-family: sans-serif; background: #c8d0d3; padding: 20px; }\n.app { max-width: 800px; margin: 0 auto; }\nh1 { color: #f64e4e; margin-bottom: 16px; }\n.filters { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; align-items: center; }\ninput[type=text] { flex: 1; min-width: 150px; padding: 10px; border: 3px solid #aac6d3; border-radius: 8px; font-size: 15px; outline: none; }\nselect { padding: 10px; border: 3px solid #aac6d3; border-radius: 8px; font-size: 15px; }\n.stats { font-size: 14px; color: #555; margin-bottom: 14px; background: white; padding: 8px 14px; border-radius: 8px; }\n.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(175px, 1fr)); gap: 14px; }\n.product { background: white; padding: 20px; border-radius: 12px; }\n.product.out { opacity: 0.5; }\n.product h3 { font-size: 15px; margin-bottom: 6px; }\n.price { color: #f64e4e; font-size: 1.4rem; font-weight: bold; }\n.badge { display: inline-block; font-size: 12px; padding: 3px 10px; border-radius: 20px; margin-top: 8px; }\n.in { background: #e8f5e9; color: #2e7d32; }\n.out { background: #ffebee; color: #c62828; }", "js": "const DATA = [\n  {name:\"Laptop\",    price:999,  inStock:true,  icon:\"💻\"},\n  {name:\"Mouse\",     price:25,   inStock:true,  icon:\"🖱️\"},\n  {name:\"Monitor\",   price:350,  inStock:false, icon:\"🖥️\"},\n  {name:\"Keyboard\",  price:75,   inStock:true,  icon:\"⌨️\"},\n  {name:\"Webcam\",    price:120,  inStock:false, icon:\"📷\"},\n  {name:\"Headphones\",price:199,  inStock:true,  icon:\"🎧\"},\n  {name:\"USB Hub\",   price:40,   inStock:true,  icon:\"🔌\"},\n  {name:\"SSD\",       price:89,   inStock:false, icon:\"💾\"},\n];\n\nfunction render() {\n  const q   = document.getElementById(\"search\").value.toLowerCase();\n  const srt = document.getElementById(\"sort\").value;\n  const stk = document.getElementById(\"instock\").checked;\n  \n  let r = DATA.filter(p => p.name.toLowerCase().includes(q));\n  if (stk) r = r.filter(p => p.inStock);\n  if (srt === \"asc\")  r = [...r].sort((a,b) => a.price - b.price);\n  if (srt === \"desc\") r = [...r].sort((a,b) => b.price - a.price);\n  if (srt === \"name\") r = [...r].sort((a,b) => a.name.localeCompare(b.name));\n  \n  const total = r.reduce((s,p) => s + p.price, 0);\n  document.getElementById(\"stats\").textContent =\n    `Showing ${r.length} of ${DATA.length} products — Total: £${total.toLocaleString()}`;\n  \n  document.getElementById(\"products\").innerHTML = r.map(p => `\n    <div class=\"product ${p.inStock ? \"\" : \"out\"}\">\n      <div style=\"font-size:2rem\">${p.icon}<\/div>\n      <h3>${p.name}<\/h3>\n      <div class=\"price\">£${p.price}<\/div>\n      <span class=\"badge ${p.inStock ? \"in\" : \"out\"}\">\n        ${p.inStock ? \"✓ In Stock\" : \"✗ Out of Stock\"}\n      <\/span>\n    <\/div>\n  `).join(\"\");\n}\nrender();"}, "ch": {"title": "Stats Dashboard", "desc": "Add a stats bar showing: total products, in-stock count, average price (rounded), most expensive item name, cheapest in-stock item name. All calculated using array methods — no manual loops.", "hint": "const inStockCount  = DATA.filter(p => p.inStock).length;\nconst avgPrice      = Math.round(DATA.reduce((s,p) => s+p.price,0) / DATA.length);\nconst mostExpensive = DATA.reduce((max,p) => p.price > max.price ? p : max).name;"}, "quiz": [{"q": "Which array method returns only items that pass a test function?", "opts": ["find()", "select()", "keep()", "filter()"], "a": 3}, {"q": "What does map() always return?", "opts": ["The first matching item", "A boolean", "undefined", "A new array of the same length"], "a": 3}, {"q": "What is reduce() used for?", "opts": ["Removing duplicates", "Making the array smaller", "Sorting", "Accumulating a single value from all array items"], "a": 3}, {"q": "Which method returns true if ANY item passes the test?", "opts": ["every()", "find()", "includes()", "some()"], "a": 3}]}, {"id": "j8", "title": "Objects — Representing Real Things", "content": [{"t": "p", "v": "Objects store collections of related data as key-value pairs. While arrays are ordered lists (index 0, 1, 2...), objects use named keys. An object describes a thing: a user, a product, a game character."}, {"t": "c", "v": "// Creating an object\nconst user = {\n  name: \"Toby\",\n  age: 22,\n  city: \"Nuneaton\",\n  isLearning: true,\n  hobbies: [\"gaming\", \"coding\"],  // array inside object\n};\n\n// Accessing properties\nuser.name         // \"Toby\"  (dot notation — preferred)\nuser[\"name\"]      // \"Toby\"  (bracket notation — for dynamic keys)\nuser.hobbies[0]   // \"gaming\"\n\n// Adding new properties\nuser.email = \"toby@example.com\";\n\n// Updating properties\nuser.age = 23;\n\n// Deleting properties\ndelete user.isLearning;\n\n// Check if property exists\n\"name\" in user    // true\n\"phone\" in user   // false\n\n// Loop over all properties\nfor (const key in user) {\n  console.log(`${key}: ${user[key]}`);\n}\nObject.keys(user)    // [\"name\",\"age\",\"city\",...]\nObject.values(user)  // [\"Toby\",22,\"Nuneaton\",...]"}, {"t": "p", "v": "Objects can have methods (functions as properties) and can be nested. Arrays of objects are the most common data pattern in JavaScript:"}, {"t": "c", "v": "const person = {\n  firstName: \"Toby\",\n  lastName: \"King\",\n\n  // Method — a function inside an object\n  fullName() {\n    return `${this.firstName} ${this.lastName}`;\n  },\n\n  // Nested object\n  address: {\n    city: \"Nuneaton\",\n    country: \"England\",\n  },\n};\nperson.fullName();      // \"Toby King\"\nperson.address.city;    // \"Nuneaton\"\n\n// ARRAY OF OBJECTS — the most common JS pattern\nconst team = [\n  { name: \"Toby\",  role: \"Frontend\" },\n  { name: \"Sarah\", role: \"Backend\"  },\n  { name: \"James\", role: \"Design\"   },\n];\nteam[0].name      // \"Toby\"\nteam.map(m => m.name) // [\"Toby\",\"Sarah\",\"James\"]"}, {"t": "t", "v": "💡 The most common JavaScript data pattern: an array of objects. Almost every API response you'll ever fetch is in this format. Master arrays + objects together and you can build anything."}], "code": {"html": "<!DOCTYPE html>\n<html>\n<head><title>User Profile<\/title><\/head>\n<body>\n  <div id=\"app\">\n    <div id=\"card\"><\/div>\n    <div class=\"controls\">\n      <h3>Update Profile<\/h3>\n      <input id=\"newCity\" placeholder=\"New city...\">\n      <button onclick=\"updateCity()\">Update City<\/button>\n      <button onclick=\"addSkill()\">Add Random Skill<\/button>\n      <button onclick=\"showRaw()\">Show Raw Object<\/button>\n    <\/div>\n    <pre id=\"raw\" class=\"raw hidden\"><\/pre>\n  <\/div>\n<\/body>\n<\/html>", "css": "* { box-sizing: border-box; }\nbody { font-family: sans-serif; background: #c8d0d3; padding: 20px; }\n#app { max-width: 500px; margin: 0 auto; }\n#card { background: white; padding: 24px; border-radius: 16px; margin-bottom: 16px; }\n.avatar { font-size: 3rem; margin-bottom: 12px; }\nh2 { color: #f64e4e; margin: 0 0 4px; }\n.sub { color: #888; font-size: 14px; margin: 0 0 12px; }\n.skills { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }\n.skill { background: #e3edf0; padding: 4px 12px; border-radius: 20px; font-size: 13px; }\n.controls { background: white; padding: 20px; border-radius: 12px; margin-bottom: 12px; }\n.controls h3 { color: #f64e4e; margin: 0 0 12px; }\nbutton { background: #f64e4e; color: white; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; margin: 4px; }\ninput { padding: 8px; border: 2px solid #aac6d3; border-radius: 8px; margin-right: 8px; font-size: 15px; }\n.raw { background: #1e1e1e; color: #e5c07b; padding: 16px; border-radius: 8px; font-size: 12px; line-height: 1.6; }\n.hidden { display: none; }", "js": "const user = {\n  name: \"Toby King\",\n  age: 22,\n  city: \"Nuneaton\",\n  job: \"Junior Developer\",\n  avatar: \"👨‍💻\",\n  skills: [\"HTML\", \"CSS\", \"JavaScript\"],\n  greet() {\n    return `Hi! I'm ${this.name} from ${this.city}.`;\n  }\n};\n\nconst moreSkills = [\"React\",\"Node.js\",\"SQL\",\"Git\",\"Python\",\"TypeScript\"];\n\nfunction renderCard() {\n  document.getElementById(\"card\").innerHTML = `\n    <div class=\"avatar\">${user.avatar}<\/div>\n    <h2>${user.name}<\/h2>\n    <p class=\"sub\">${user.job} &middot; ${user.city} &middot; Age ${user.age}<\/p>\n    <p>${user.greet()}<\/p>\n    <div class=\"skills\">\n      ${user.skills.map(s => `<span class=\"skill\">${s}<\/span>`).join(\"\")}\n    <\/div>\n  `;\n}\n\nfunction updateCity() {\n  const c = document.getElementById(\"newCity\").value.trim();\n  if (c) { user.city = c; renderCard(); }\n}\n\nfunction addSkill() {\n  const s = moreSkills[Math.floor(Math.random() * moreSkills.length)];\n  if (!user.skills.includes(s)) { user.skills.push(s); renderCard(); }\n}\n\nfunction showRaw() {\n  const el = document.getElementById(\"raw\");\n  el.classList.toggle(\"hidden\");\n  el.textContent = JSON.stringify(user, null, 2);\n}\n\nrenderCard();"}, "ch": {"title": "Team Directory", "desc": "Create an array of 4 team member objects, each with name, role, city, and skills (array). Loop over the array with .map() to render 4 profile cards. Add a filter input that shows only members who have a matching skill.", "hint": "const team = [\n  { name:\"Toby\", role:\"Frontend\", skills:[\"HTML\",\"CSS\",\"JS\"] },\n  ...\n];\n\nconst filtered = team.filter(m =>\n  m.skills.some(s => s.toLowerCase().includes(query))\n);"}, "quiz": [{"q": "Which of these correctly uses dot notation to access an object property?", "opts": ["user[name]", "user->name", "user::name", "user.name"], "a": 3}, {"q": "How do you check if a property exists on an object?", "opts": ["obj.hasKey(\"prop\")", "obj.contains(\"prop\")", "obj.prop !== undefined", "\"prop\" in obj"], "a": 3}, {"q": "Why are arrays of objects so common in JavaScript?", "opts": ["Arrays can only hold objects", "Objects cannot be nested", "They represent lists of structured, real-world data", "Arrays are faster with objects"], "a": 2}, {"q": "Object.keys(obj) returns:", "opts": ["The object values", "A count of properties", "The object itself", "An array of property names"], "a": 3}]}, {"id": "j9", "title": "Functions — The Complete Guide", "content": [{"t": "p", "v": "Functions are reusable blocks of code. You've been using them — now let's understand all the ways to write them and the important concepts behind them."}, {"t": "c", "v": "// FUNCTION DECLARATION — hoisted (can call it before defining)\nfunction greet(name) {\n  return `Hello, ${name}!`;\n}\ngreet(\"Toby\"); // \"Hello, Toby!\"\n\n// FUNCTION EXPRESSION — stored in a variable\nconst double = function(n) { return n * 2; };\n\n// ARROW FUNCTION — clean modern syntax\nconst triple = n => n * 3;              // implicit return\nconst square = n => { return n * n; };  // block body needs return\nconst noArgs = () => \"Hello!\";          // no params: () required\n\n// DEFAULT PARAMETERS\nfunction greet2(name = \"stranger\", greeting = \"Hello\") {\n  return `${greeting}, ${name}!`;\n}\ngreet2();                // \"Hello, stranger!\"\ngreet2(\"Toby\");          // \"Hello, Toby!\"\ngreet2(\"Toby\", \"Hey!\");  // \"Hey!, Toby!\""}, {"t": "p", "v": "Functions as values — passing and returning functions:"}, {"t": "c", "v": "// Passing functions as arguments (callbacks)\nconst nums = [3, 1, 4, 1, 5, 9];\nnums.sort((a, b) => a - b);  // sort uses a callback!\n\n// setTimeout / setInterval\nsetTimeout(() => console.log(\"1 second later!\"), 1000);\n\nlet count = 0;\nconst id = setInterval(() => {\n  count++;\n  if (count >= 5) clearInterval(id);\n}, 1000);\n\n// Function that RETURNS a function (factory)\nfunction multiplier(factor) {\n  return (n) => n * factor;\n}\nconst double2 = multiplier(2);\nconst triple2 = multiplier(3);\ndouble2(5);  // 10\ntriple2(5);  // 15\n\n// Scope — variables inside a function are private\nfunction myFunc() {\n  const secret = \"only inside here\";\n}\nconsole.log(secret); // ERROR: secret is not defined"}, {"t": "t", "v": "💡 Arrow functions handle \"this\" differently from regular functions. For event listeners and object methods, regular functions are sometimes needed. For most callbacks and utility functions, arrow functions are preferred."}], "code": {"html": "<!DOCTYPE html>\n<html>\n<head><title>Timer<\/title><\/head>\n<body>\n  <div class=\"app\">\n    <h1>⏱️ Countdown Timer<\/h1>\n    <div class=\"display\" id=\"display\">00:30<\/div>\n    <div class=\"controls\">\n      <input type=\"number\" id=\"secs\" value=\"30\" min=\"1\" max=\"3600\">\n      <button onclick=\"toggle()\" id=\"startBtn\">▶ Start<\/button>\n      <button onclick=\"reset()\">↺ Reset<\/button>\n    <\/div>\n    <p id=\"msg\"><\/p>\n  <\/div>\n<\/body>\n<\/html>", "css": "body { font-family: sans-serif; background: #c8d0d3; display: flex; justify-content: center; padding: 60px 20px; }\n.app { background: white; padding: 40px; border-radius: 16px; text-align: center; width: 340px; }\nh1 { color: #f64e4e; margin-bottom: 24px; }\n.display { font-size: 5rem; font-weight: bold; color: #333; font-family: monospace; margin-bottom: 24px; transition: color 0.3s; }\n.display.urgent { color: #f64e4e; }\n.controls { display: flex; gap: 10px; justify-content: center; }\ninput { width: 70px; padding: 8px; border: 3px solid #aac6d3; border-radius: 8px; font-size: 16px; text-align: center; }\nbutton { background: #f64e4e; color: white; border: none; padding: 10px 16px; border-radius: 8px; cursor: pointer; font-family: sans-serif; }\n#msg { margin-top: 20px; font-size: 18px; min-height: 28px; }", "js": "let timer = null;\nlet remaining = 30;\n\n// Pure function — always returns same output for same input\nfunction format(s) {\n  const m = Math.floor(s / 60);\n  const secs = s % 60;\n  return `${String(m).padStart(2,\"0\")}:${String(secs).padStart(2,\"0\")}`;\n}\n\nfunction draw() {\n  const el = document.getElementById(\"display\");\n  el.textContent = format(remaining);\n  el.classList.toggle(\"urgent\", remaining <= 10 && remaining > 0);\n}\n\n// tick is a callback — passed to setInterval\nfunction tick() {\n  remaining--;\n  draw();\n  if (remaining <= 0) {\n    clearInterval(timer); timer = null;\n    document.getElementById(\"msg\").textContent = \"⏰ Time's up!\";\n    document.getElementById(\"startBtn\").textContent = \"▶ Start\";\n  }\n}\n\nfunction toggle() {\n  if (timer) {\n    clearInterval(timer); timer = null;\n    document.getElementById(\"startBtn\").textContent = \"▶ Resume\";\n  } else {\n    if (remaining <= 0) remaining = parseInt(document.getElementById(\"secs\").value) || 30;\n    timer = setInterval(tick, 1000);\n    document.getElementById(\"startBtn\").textContent = \"⏸ Pause\";\n    document.getElementById(\"msg\").textContent = \"\";\n  }\n}\n\nfunction reset() {\n  clearInterval(timer); timer = null;\n  remaining = parseInt(document.getElementById(\"secs\").value) || 30;\n  draw();\n  document.getElementById(\"startBtn\").textContent = \"▶ Start\";\n  document.getElementById(\"msg\").textContent = \"\";\n}\n\ndraw();"}, "ch": {"title": "Utility Library", "desc": "Create a utils object with 5 methods: capitalise(str), truncate(str, max) adds \"...\", clamp(n, min, max), randomColor() returns a hex color, debounce(fn, delay). Test each one live on the page.", "hint": "const utils = {\n  capitalise: s => s.charAt(0).toUpperCase() + s.slice(1),\n  truncate: (s, max) => s.length > max ? s.slice(0,max)+\"...\" : s,\n  clamp: (n,min,max) => Math.min(Math.max(n,min),max),\n  randomColor: () => \"#\"+Math.floor(Math.random()*16777215).toString(16).padStart(6,\"0\"),\n};"}, "quiz": [{"q": "Which type of function is hoisted and can be called before it is defined?", "opts": ["Arrow function", "Function expression", "Anonymous function", "Function declaration"], "a": 3}, {"q": "A callback function is:", "opts": ["A function that calls itself", "A function with a return value", "An async function", "A function passed as an argument to another function"], "a": 3}, {"q": "Default parameters are used when:", "opts": ["The parameter is the wrong type", "The function returns undefined", "The argument is not provided by the caller", "The function fails"], "a": 2}, {"q": "A variable declared inside a function with const or let is:", "opts": ["Global", "Shared with child functions only", "Undefined everywhere", "Only accessible inside that function"], "a": 3}]}, {"id": "j10", "title": "DOM Manipulation — Changing the Page", "content": [{"t": "p", "v": "The DOM (Document Object Model) is JavaScript's representation of your HTML — a tree of objects you can select, create, update, and delete. This is how all dynamic websites work."}, {"t": "c", "v": "// SELECTING ELEMENTS\ndocument.getElementById(\"myId\")         // one element by ID\ndocument.querySelector(\".card\")          // first match by CSS selector\ndocument.querySelector(\"nav a.active\")  // any CSS selector works!\ndocument.querySelectorAll(\".card\")       // ALL matches (NodeList)\n\n// Convert NodeList to array to use map/filter:\nconst cards = [...document.querySelectorAll(\".card\")];\n\n// Navigate relative to an element\nelem.parentElement          // parent\nelem.children               // direct children\nelem.nextElementSibling     // next sibling\nelem.firstElementChild      // first child"}, {"t": "p", "v": "Changing content, styles, classes, and attributes:"}, {"t": "c", "v": "// CONTENT\nel.textContent = \"New text\";       // plain text (safe for user input)\nel.innerHTML   = \"<b>Bold!<\/b>\";   // parses HTML — careful!\ninput.value    = \"prefilled\";      // input field value\n\n// STYLES\nel.style.color           = \"red\";\nel.style.backgroundColor = \"#f64e4e\"; // camelCase!\nel.style.display         = \"none\";    // hide\nel.style.display         = \"\";        // restore\n\n// CSS CLASSES\nel.classList.add(\"active\");\nel.classList.remove(\"active\");\nel.classList.toggle(\"active\");       // on → off → on\nel.classList.contains(\"active\");     // true/false\n\n// ATTRIBUTES\nel.setAttribute(\"href\", \"https://...\");\nel.getAttribute(\"href\");\nel.removeAttribute(\"disabled\");"}, {"t": "p", "v": "Creating new elements and inserting them:"}, {"t": "c", "v": "const div = document.createElement(\"div\");\ndiv.className   = \"card\";\ndiv.textContent = \"New card!\";\n\nparent.appendChild(div);     // add to end\nparent.prepend(div);          // add to start\nparent.insertBefore(div, ref);// before an element\n\nel.remove();                  // remove an element\nparent.innerHTML = \"\";        // remove ALL children"}, {"t": "t", "v": "💡 Use textContent (not innerHTML) when inserting user-typed text. innerHTML parses HTML — an attacker can inject a script tag. textContent treats everything as plain text and is always safe."}], "code": {"html": "<!DOCTYPE html>\n<html>\n<head><title>Note Builder<\/title><\/head>\n<body>\n  <div class=\"app\">\n    <h1>✏️ Note Builder<\/h1>\n    <div class=\"toolbar\">\n      <input id=\"text\" type=\"text\" placeholder=\"Note content...\">\n      <select id=\"color\">\n        <option value=\"#fff3cd\">Yellow<\/option>\n        <option value=\"#d1ecf1\">Blue<\/option>\n        <option value=\"#d4edda\">Green<\/option>\n        <option value=\"#f8d7da\">Pink<\/option>\n      <\/select>\n      <button onclick=\"addNote()\">+ Add<\/button>\n      <button onclick=\"clearAll()\" class=\"danger\">Clear All<\/button>\n    <\/div>\n    <div id=\"board\" class=\"board\"><\/div>\n    <p id=\"count\" class=\"count\"><\/p>\n  <\/div>\n<\/body>\n<\/html>", "css": "* { box-sizing: border-box; margin: 0; }\nbody { font-family: sans-serif; background: #c8d0d3; padding: 20px; }\n.app { max-width: 800px; margin: 0 auto; }\nh1 { color: #f64e4e; margin-bottom: 16px; }\n.toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }\ninput { flex: 1; padding: 10px; border: 3px solid #aac6d3; border-radius: 8px; font-size: 15px; outline: none; min-width: 150px; }\nselect { padding: 10px; border: 3px solid #aac6d3; border-radius: 8px; }\nbutton { background: #f64e4e; color: white; border: none; padding: 10px 18px; border-radius: 8px; cursor: pointer; font-family: sans-serif; }\n.danger { background: #555; }\n.board { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px,1fr)); gap: 14px; min-height: 200px; }\n.note { padding: 16px; border-radius: 10px; position: relative; box-shadow: 0 2px 8px rgba(0,0,0,0.1); animation: pop 0.2s ease; }\n.note p { font-size: 15px; line-height: 1.5; word-break: break-word; }\n.ndel { position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.15); border: none; border-radius: 50%; width: 24px; height: 24px; cursor: pointer; font-size: 14px; }\n@keyframes pop { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }\n.count { color: #555; font-size: 14px; margin-top: 12px; }", "js": "function addNote() {\n  const text  = document.getElementById(\"text\").value.trim();\n  const color = document.getElementById(\"color\").value;\n  if (!text) return;\n\n  // CREATE elements\n  const note = document.createElement(\"div\");\n  note.className = \"note\";\n  note.style.background = color;\n\n  const p = document.createElement(\"p\");\n  p.textContent = text;  // safe — no HTML injection risk\n\n  const del = document.createElement(\"button\");\n  del.className = \"ndel\";\n  del.textContent = \"×\";\n  del.addEventListener(\"click\", () => { note.remove(); updateCount(); });\n\n  // Double-click to edit\n  p.addEventListener(\"dblclick\", () => {\n    const edited = prompt(\"Edit note:\", p.textContent);\n    if (edited !== null) p.textContent = edited;\n  });\n\n  note.appendChild(del);\n  note.appendChild(p);\n  document.getElementById(\"board\").appendChild(note);\n  document.getElementById(\"text\").value = \"\";\n  updateCount();\n}\n\nfunction clearAll() {\n  document.getElementById(\"board\").innerHTML = \"\";\n  updateCount();\n}\n\nfunction updateCount() {\n  const n = document.querySelectorAll(\".note\").length;\n  document.getElementById(\"count\").textContent = n > 0 ? `${n} note${n!==1?\"s\":\"\"}` : \"\";\n}"}, "ch": {"title": "Pin & Sort Notes", "desc": "Add a \"Pin\" button to each note. Pinned notes should always appear first. Add a \"Sort by color\" button. Track a createdAt timestamp (Date.now()) on each note as a data attribute. Sort by newest/oldest.", "hint": "note.dataset.time = Date.now();\n\n// Sort notes by time\nconst sorted = [...board.children].sort((a,b) =>\n  parseInt(a.dataset.time) - parseInt(b.dataset.time)\n);\nsorted.forEach(n => board.appendChild(n));"}, "quiz": [{"q": "document.querySelector(\".card\") selects:", "opts": ["All elements with class card", "Elements with id card", "All <card> tags", "The first element with class card"], "a": 3}, {"q": "Which property is safest for inserting user-typed text into the DOM?", "opts": ["innerHTML", "innerText", "outerHTML", "textContent"], "a": 3}, {"q": "classList.toggle(\"active\") does what?", "opts": ["Always adds \"active\"", "Always removes \"active\"", "Checks if \"active\" exists and returns boolean", "Adds if absent, removes if present"], "a": 3}, {"q": "To add a newly created element to the END of a parent:", "opts": ["parent.prepend(el)", "parent.insertBefore(el)", "parent.addChild(el)", "parent.appendChild(el)"], "a": 3}]}, {"id": "j11", "title": "Events — Responding to the User", "content": [{"t": "p", "v": "Events are things that happen in the browser — a click, keypress, form submission, mouse movement. addEventListener lets you run code when they occur."}, {"t": "c", "v": "const btn = document.getElementById(\"btn\");\n\n// Click\nbtn.addEventListener(\"click\", () => console.log(\"Clicked!\"));\n\n// Mouse events\nbtn.addEventListener(\"mouseover\", () => btn.style.background = \"darkred\");\nbtn.addEventListener(\"mouseout\",  () => btn.style.background = \"\");\n\n// Keyboard events (on document to catch all keypresses)\ndocument.addEventListener(\"keydown\", (e) => {\n  console.log(e.key);   // \"a\", \"Enter\", \"Escape\", \"ArrowUp\"\n  console.log(e.code);  // \"KeyA\", \"Enter\"\n  if (e.key === \"Escape\") closeModal();\n  if (e.ctrlKey && e.key === \"s\") { e.preventDefault(); save(); }\n});\n\n// Input events\nconst inp = document.querySelector(\"input\");\ninp.addEventListener(\"input\",  () => console.log(inp.value));  // every keystroke\ninp.addEventListener(\"change\", () => console.log(\"Done!\"));     // on blur\ninp.addEventListener(\"focus\",  () => inp.style.borderColor = \"blue\");\ninp.addEventListener(\"blur\",   () => inp.style.borderColor = \"\");\n\n// Form submit\ndocument.querySelector(\"form\").addEventListener(\"submit\", (e) => {\n  e.preventDefault();  // CRITICAL — stops page reload!\n  console.log(\"Submitted!\");\n});"}, {"t": "p", "v": "The event object (e) contains information about the event. Event delegation handles many children with one listener:"}, {"t": "c", "v": "btn.addEventListener(\"click\", (e) => {\n  e.target           // element that was actually clicked\n  e.currentTarget    // element the listener is on\n  e.preventDefault() // stop default behavior\n  e.stopPropagation()// stop event bubbling up the DOM\n});\n\n// EVENT DELEGATION — one listener handles all children\n// (works even for elements added dynamically!)\ndocument.getElementById(\"list\").addEventListener(\"click\", (e) => {\n  if (e.target.tagName === \"LI\") {\n    e.target.classList.toggle(\"done\");\n  }\n  if (e.target.classList.contains(\"del-btn\")) {\n    e.target.closest(\"li\").remove();\n  }\n});"}, {"t": "t", "v": "💡 Event delegation is a key performance pattern. Instead of 1000 listeners on 1000 list items, use 1 listener on the parent and check e.target. It also works for elements added dynamically after the page loads."}], "code": {"html": "<!DOCTYPE html>\n<html>\n<head><title>Keyboard Trainer<\/title><\/head>\n<body>\n  <div class=\"app\">\n    <h1>⌨️ Keyboard Trainer<\/h1>\n    <div id=\"display\" class=\"display\">Press any key!<\/div>\n    <div id=\"info\" class=\"info\"><\/div>\n    <div id=\"history\" class=\"history\"><\/div>\n    <div class=\"zone\" id=\"zone\">\n      Move your mouse here!\n      <div id=\"dot\" class=\"dot\"><\/div>\n    <\/div>\n  <\/div>\n<\/body>\n<\/html>", "css": "* { box-sizing: border-box; margin: 0; }\nbody { font-family: sans-serif; background: #c8d0d3; padding: 20px; }\n.app { max-width: 600px; margin: 0 auto; }\nh1 { color: #f64e4e; margin-bottom: 20px; }\n.display { background: white; text-align: center; font-size: 3rem; padding: 40px; border-radius: 12px; margin-bottom: 14px; transition: all 0.1s; }\n.display.pressed { background: #f64e4e; color: white; transform: scale(0.98); }\n.info { background: white; padding: 12px 16px; border-radius: 8px; margin-bottom: 14px; font-size: 14px; color: #555; min-height: 48px; }\n.history { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; min-height: 40px; }\n.badge { background: white; padding: 4px 12px; border-radius: 6px; font-family: monospace; font-size: 15px; animation: pop 0.15s ease; }\n@keyframes pop { from { transform: scale(0.7); } to { transform: scale(1); } }\n.zone { background: white; height: 180px; border-radius: 12px; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; color: #aaa; font-size: 16px; cursor: none; }\n.dot { position: absolute; width: 20px; height: 20px; background: #f64e4e; border-radius: 50%; pointer-events: none; transform: translate(-50%,-50%); }", "js": "// Keyboard events\ndocument.addEventListener(\"keydown\", e => {\n  const disp = document.getElementById(\"display\");\n  disp.textContent = e.key === \" \" ? \"Space\" : e.key;\n  disp.classList.add(\"pressed\");\n  \n  const mods = [e.ctrlKey&&\"Ctrl\",e.shiftKey&&\"Shift\",e.altKey&&\"Alt\"].filter(Boolean).join(\"+\");\n  document.getElementById(\"info\").textContent =\n    `Key: \"${e.key}\"  Code: ${e.code}${mods ? \"  Modifiers: \" + mods : \"\"}`;\n  \n  const badge = document.createElement(\"span\");\n  badge.className = \"badge\";\n  badge.textContent = e.key === \" \" ? \"⎵\" : e.key;\n  const hist = document.getElementById(\"history\");\n  hist.appendChild(badge);\n  while (hist.children.length > 20) hist.firstChild.remove();\n});\n\ndocument.addEventListener(\"keyup\", () =>\n  document.getElementById(\"display\").classList.remove(\"pressed\"));\n\n// Mouse tracking\nconst zone = document.getElementById(\"zone\");\nconst dot  = document.getElementById(\"dot\");\n\nzone.addEventListener(\"mousemove\", e => {\n  const r = zone.getBoundingClientRect();\n  dot.style.left = (e.clientX - r.left) + \"px\";\n  dot.style.top  = (e.clientY - r.top) + \"px\";\n  const hue = ((e.clientX - r.left) / r.width) * 360;\n  dot.style.background = `hsl(${hue}, 80%, 60%)`;\n});"}, "ch": {"title": "Drawing Canvas", "desc": "Build a simple drawing app. When mouse is held down over a zone (mousedown), draw colored circles as the mouse moves. On mouseup, stop drawing. Add a color picker and a Clear button. Use getBoundingClientRect() to get correct position.", "hint": "let drawing = false;\nzone.addEventListener(\"mousedown\", () => drawing = true);\nzone.addEventListener(\"mouseup\",   () => drawing = false);\nzone.addEventListener(\"mousemove\", e => {\n  if (!drawing) return;\n  const r = zone.getBoundingClientRect();\n  const d = document.createElement(\"div\");\n  d.style.cssText = `position:absolute;width:12px;height:12px;border-radius:50%;background:${color};left:${e.clientX-r.left}px;top:${e.clientY-r.top}px;transform:translate(-50%,-50%)`;\n  zone.appendChild(d);\n});"}, "quiz": [{"q": "Which method stops a form from reloading the page on submit?", "opts": ["e.stop()", "e.prevent()", "e.cancelDefault()", "e.preventDefault()"], "a": 3}, {"q": "In an event listener, e.target refers to:", "opts": ["The event type string", "The timestamp", "The element the listener is attached to", "The element that actually triggered the event"], "a": 3}, {"q": "Event delegation means:", "opts": ["Sending events to a server", "Using addEventListener twice", "Removing all listeners", "One listener on a parent handles events from all its children"], "a": 3}, {"q": "Which event fires on EVERY keystroke inside an input field?", "opts": ["change", "keypress", "type", "input"], "a": 3}]}, {"id": "j12", "title": "Modern JavaScript — ES6+ Features", "content": [{"t": "p", "v": "ES6+ (from 2015 onwards) brought powerful new syntax. These features are in every modern codebase — you'll see them constantly in tutorials, documentation, and job interviews."}, {"t": "c", "v": "// DESTRUCTURING — extract values cleanly\nconst user = { name: \"Toby\", age: 22, city: \"Nuneaton\" };\nconst { name, age } = user;          // same as: const name = user.name;\nconst { name: userName } = user;     // rename to userName\nconst { name: n, country = \"England\" } = user; // with default value\n\n// Array destructuring\nconst [first, second, third] = [1, 2, 3];\nconst [a, , c] = [1, 2, 3];  // skip index 1\n\n// In function parameters\nfunction greet({ name, age = 0 }) {\n  return `${name} is ${age}`;\n}\ngreet(user); // \"Toby is 22\""}, {"t": "p", "v": "Spread and rest operators:"}, {"t": "c", "v": "// SPREAD (...) — expand into individual items\nconst arr1 = [1,2,3], arr2 = [4,5,6];\nconst all  = [...arr1, ...arr2]; // [1,2,3,4,5,6]\nconst copy = [...arr1];          // shallow copy\n\n// Spread objects\nconst defaults  = { theme: \"light\", lang: \"en\" };\nconst overrides = { lang: \"fr\", fontSize: 16 };\nconst merged    = { ...defaults, ...overrides };\n// { theme: \"light\", lang: \"fr\", fontSize: 16 }\n\n// REST — collect remaining into array\nfunction sum(...nums) {  // rest parameter\n  return nums.reduce((a,b) => a+b, 0);\n}\nsum(1, 2, 3, 4, 5); // 15\n\nconst [head, ...tail] = [1,2,3,4]; // head=1, tail=[2,3,4]"}, {"t": "p", "v": "Safe access and smart defaults:"}, {"t": "c", "v": "// OPTIONAL CHAINING (?.) — safe property access\nconst user = { address: { city: \"Nuneaton\" } };\nuser.address.city      // \"Nuneaton\"\nuser.phone.number      // ERROR! phone is undefined\nuser.phone?.number     // undefined (safe!)\nuser.address?.city     // \"Nuneaton\"\nuser.settings?.theme   // undefined (safe)\n\n// NULLISH COALESCING (??) — default when null/undefined\nconst score = null;\nscore ?? 0     // 0 (null → use default)\n\nconst count = 0;\ncount ?? 10    // 0 (0 is NOT null/undefined — keep it!)\ncount || 10    // 10 (0 is falsy — || gives wrong answer here!)"}, {"t": "t", "v": "💡 Optional chaining (?.) prevents the most common JS runtime error: \"Cannot read properties of undefined\". Use it whenever you access nested object properties from API data that might not always exist."}], "code": {"html": "<!DOCTYPE html>\n<html>\n<head><title>Modern JS<\/title><\/head>\n<body>\n  <div id=\"app\"><\/div>\n<\/body>\n<\/html>", "css": "body { font-family: sans-serif; background: #c8d0d3; padding: 20px; }\n#app { max-width: 600px; margin: 0 auto; }\n.card { background: white; padding: 20px; border-radius: 12px; margin-bottom: 12px; }\n.card h3 { color: #f64e4e; margin-bottom: 8px; }\n.tag { display: inline-block; background: #e3edf0; padding: 3px 10px; border-radius: 20px; font-size: 13px; margin: 3px; }\n.pre { background: #f0f4f6; padding: 10px; border-radius: 6px; font-family: monospace; font-size: 13px; margin-top: 8px; white-space: pre-wrap; }", "js": "// DESTRUCTURING\nconst user = { name:\"Toby\", age:22, city:\"Nuneaton\" };\nconst { name, age, city } = user;\n\n// SPREAD — merge objects\nconst defaults    = { theme:\"light\", lang:\"en\", size:16 };\nconst prefs       = { theme:\"dark\", size:18 };\nconst settings    = { ...defaults, ...prefs };\n\n// REST — collect args\nfunction tags(type, ...classes) {\n  return classes.map(c => `<span class=\"tag\">${type}.${c}<\/span>`).join(\"\");\n}\n\n// OPTIONAL CHAINING — safe API access\nconst apiData = [\n  { id:1, user:{ name:\"Alice\", address:{ city:\"London\" } } },\n  { id:2, user:{ name:\"Bob\" } },  // no address\n  { id:3 },                       // no user\n];\n\ndocument.getElementById(\"app\").innerHTML = `\n  <div class=\"card\">\n    <h3>Destructuring<\/h3>\n    <p>${name}, ${age}, from ${city}<\/p>\n  <\/div>\n  <div class=\"card\">\n    <h3>Spread — merged settings<\/h3>\n    <div class=\"pre\">${JSON.stringify(settings, null, 2)}<\/div>\n  <\/div>\n  <div class=\"card\">\n    <h3>Rest — flexible function<\/h3>\n    ${tags(\"btn\", \"primary\", \"large\", \"active\")}\n  <\/div>\n  <div class=\"card\">\n    <h3>Optional Chaining<\/h3>\n    ${apiData.map(item => `\n      <p>User ${item.id}: ${item.user?.name ?? \"Unknown\"} — ${item.user?.address?.city ?? \"no city\"}<\/p>\n    `).join(\"\")}\n  <\/div>\n`;"}, "ch": {"title": "Refactor with Modern JS", "desc": "Rewrite these in modern style:\n1. const getName = function(obj) { return obj && obj.user && obj.user.name || \"Unknown\"; }\n2. function merge(a, b) { return Object.assign({}, a, b); }\n3. var head = arr[0]; var tail = arr.slice(1);\nUse optional chaining, nullish coalescing, spread, and destructuring.", "hint": "// 1. Optional chaining + nullish coalescing\nconst getName = obj => obj?.user?.name ?? \"Unknown\";\n\n// 2. Spread\nconst merge = (a, b) => ({ ...a, ...b });\n\n// 3. Array destructuring with rest\nconst [head, ...tail] = arr;"}, "quiz": [{"q": "const { name, age } = user is an example of:", "opts": ["Spreading", "Cloning", "Picking", "Destructuring"], "a": 3}, {"q": "The ?? (nullish coalescing) operator returns the right side only when the left is:", "opts": ["Falsy (0, false, \"\")", "null or undefined only", "Not a number", "Empty"], "a": 1}, {"q": "user?.address?.city is safe because:", "opts": ["It creates missing properties", "It checks the type first", "It returns undefined instead of throwing an error", "It uses a cache"], "a": 2}, {"q": "[...arr1, ...arr2] produces:", "opts": ["A nested array", "An error", "Two separate copies", "A new combined array"], "a": 3}]}, {"id": "cm3", "title": "10 Common JavaScript Mistakes", "content": [{"t": "p", "v": "These are the JavaScript gotchas that trip up beginners and even experienced developers. Memorise them."}, {"t": "c", "v": "// ❌ MISTAKE 1: Using == instead of ===\nconsole.log(0 == \"\")    // true  (wrong!)\nconsole.log(0 == false) // true  (wrong!)\n\n// ✅ FIX: Always use ===\nconsole.log(0 === \"\")    // false (correct)\nconsole.log(0 === false) // false (correct)"}, {"t": "c", "v": "// ❌ MISTAKE 2: String + Number concatenation\nconst input = \"5\";  // user input is always a string\nconst total = input + 3;  // \"53\" — not 8!\n\n// ✅ FIX: Convert first\nconst total = Number(input) + 3;  // 8\nconst total = parseInt(input) + 3; // 8"}, {"t": "c", "v": "// ❌ MISTAKE 3: Reassigning const\nconst arr = [];\narr = [1, 2, 3];  // TypeError: Assignment to constant variable\n\n// ✅ FIX: Use push() to add to an existing const array\nconst arr = [];\narr.push(1, 2, 3);  // ✓ modifying is fine, reassigning is not"}, {"t": "c", "v": "// ❌ MISTAKE 4: Forgetting e.preventDefault() on forms\nform.addEventListener(\"submit\", function() {\n  // Page reloads before this runs!\n  processForm();\n});\n\n// ✅ FIX:\nform.addEventListener(\"submit\", function(e) {\n  e.preventDefault();  // stop the reload\n  processForm();\n});"}, {"t": "c", "v": "// ❌ MISTAKE 5: Mutating arrays when you should copy\nconst nums = [3,1,4,1,5];\nconst sorted = nums.sort();  // MUTATES nums!\nconsole.log(nums);  // [1,1,3,4,5] — original gone!\n\n// ✅ FIX: Spread to copy first\nconst sorted = [...nums].sort((a,b) => a - b);\nconsole.log(nums);  // [3,1,4,1,5] — original preserved"}, {"t": "c", "v": "// ❌ MISTAKE 6: Forgetting that array methods return new arrays\nconst nums = [1,2,3,4,5];\nnums.filter(n => n > 2);  // result is thrown away!\nconsole.log(nums);  // still [1,2,3,4,5]\n\n// ✅ FIX: Always store the result\nconst big = nums.filter(n => n > 2);  // [3,4,5]"}, {"t": "c", "v": "// ❌ MISTAKE 7: Missing return in arrow functions\nconst doubled = [1,2,3].map(n => {\n  n * 2;  // calculated but not returned!\n});\n// doubled = [undefined, undefined, undefined]\n\n// ✅ FIX: Add return, or use implicit return\nconst doubled = [1,2,3].map(n => n * 2);      // implicit\nconst doubled = [1,2,3].map(n => { return n * 2; }); // explicit"}, {"t": "c", "v": "// ❌ MISTAKE 8: Comparing objects and arrays with ===\nconst a = [1,2,3];\nconst b = [1,2,3];\nconsole.log(a === b);  // false! Different references\n\n// ✅ FIX: Compare contents\nconsole.log(JSON.stringify(a) === JSON.stringify(b));  // true\n// Or compare length and each item manually"}, {"t": "c", "v": "// ❌ MISTAKE 9: Using let for everything\nlet PI = 3.14159;   // PI never changes — use const!\nlet name = \"Toby\";  // never reassigned — use const!\n\n// ✅ FIX: const by default, let only when value changes\nconst PI = 3.14159;\nconst name = \"Toby\";\nlet score = 0;  // ← this WILL change"}, {"t": "c", "v": "// ❌ MISTAKE 10: Accessing array index out of bounds\nconst fruits = [\"apple\", \"banana\", \"cherry\"];\nconsole.log(fruits[3]);  // undefined (index 3 doesn't exist)\nconsole.log(fruits[fruits.length]);  // undefined!\n\n// ✅ FIX: Last item is always at length - 1\nconsole.log(fruits[fruits.length - 1]);  // \"cherry\""}, {"t": "t", "v": "💡 Quick checks before shipping any JS: always use === — always store array method results — always e.preventDefault() on forms — spread before mutating — const by default."}], "code": {"html": "<!DOCTYPE html>\n<html>\n<head><title>JS Mistakes<\/title><\/head>\n<body>\n  <div id=\"output\"><\/div>\n<\/body>\n<\/html>", "css": "body { font-family: sans-serif; padding: 20px; }\n.result { background: #e3edf0; padding: 12px; border-radius: 8px; margin: 8px 0; }\n.bug { color: #e53935; }\n.fix { color: #2e7d32; }", "js": "const out = document.getElementById(\"output\");\nfunction show(label, val, cls) {\n  out.innerHTML += `<div class=\"result ${cls}\"><strong>${label}:<\/strong> ${val}<\/div>`;\n}\n\n// Try fixing each bug below:\n\n// BUG 1: Wrong comparison\nshow(\"0 == \\\"\\\"\", 0 == \"\", \"bug\");\n// FIX: show(\"0 === \\\"\\\"\", 0 === \"\", \"fix\");\n\n// BUG 2: String + number\nconst input = \"5\";\nshow(\"\\\"5\\\" + 3\", input + 3, \"bug\");\n// FIX: show(\"Number(\\\"5\\\") + 3\", Number(input) + 3, \"fix\");\n\n// BUG 3: Mutating sort\nconst nums = [3,1,4,1,5];\nconst sorted = nums.sort((a,b) => a-b);\nshow(\"Original after sort()\", nums.join(\",\"), \"bug\");\n// FIX: const sorted = [...nums].sort((a,b)=>a-b);"}, "ch": {"title": "Uncomment the Fixes", "desc": "For each of the 3 bugs shown in the editor, uncomment the FIX line and delete (or comment out) the BUG line. Then verify the output shows green \"fix\" results instead of red \"bug\" results.", "hint": "// Uncomment each FIX line and comment the BUG:\n\n// show(\"0 === \\\"\\\"\", 0 === \"\", \"fix\");  ← uncomment\n\n// show(\"Number(\\\"5\\\") + 3\", Number(input) + 3, \"fix\");  ← uncomment\n\n// const sorted = [...nums].sort((a,b) => a-b);  ← uncomment"}}], "project": {"title": "🏆 Project 3: Interactive Dashboard", "desc": "Build a data d
