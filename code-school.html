<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Code School · TobyK1DD</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sour+Gummy:wght@400;600;700&display=swap">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#c8d0d3;--soft:#e3edf0;--text:#000;--pri:#f64e4e;--brd:#fff;--acc:#aac6d3;--btxt:#000;--cbg:#c2cfd4;--muted:#555;--green:#2e7d32}
body.dark{--bg:#121212;--soft:#1e1e1e;--text:#fff;--pri:#f78af2;--brd:#333;--acc:#2a2a2a;--btxt:#000;--cbg:#0a0a0a;--muted:#888}
html,body{height:100%;font-family:'Sour Gummy',sans-serif;background:var(--bg);color:var(--text)}
/* HEADER */
header{background:var(--bg);border-bottom:3px solid var(--brd);padding:9px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100;height:54px}
#logo{cursor:pointer;color:var(--pri);font-weight:700;font-size:19px;flex:1}
#hdr-lesson{font-size:12px;opacity:.6;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:200px}
/* BUTTONS */
.btn{font-family:'Sour Gummy',sans-serif;background:var(--pri);color:var(--btxt);border:3px solid var(--brd);padding:8px 16px;border-radius:8px;cursor:pointer;font-size:14px;white-space:nowrap}
.btn:hover{opacity:.85}
.btn.sec{background:var(--soft);color:var(--text)}
.btn.icon{border-radius:50%;width:38px;height:38px;padding:0;font-size:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ham{background:transparent;border:none;font-size:22px;cursor:pointer;color:var(--text);flex-shrink:0}
/* LAYOUT */
#layout{display:flex;height:calc(100vh - 54px)}
/* SIDEBAR */
#sb{width:235px;flex-shrink:0;background:var(--soft);border-right:1px solid var(--acc);overflow-y:auto;transition:width .2s}
#sb.closed{width:0;overflow:hidden}
.ph-btn{width:100%;background:transparent;border:none;border-bottom:1px solid var(--acc);padding:11px 14px;text-align:left;cursor:pointer;display:flex;align-items:center;gap:8px;font-family:'Sour Gummy',sans-serif;color:var(--text)}
.ph-btn:disabled{cursor:default;opacity:.5}
.ph-meta{flex:1;min-width:0}
.ph-tag{font-size:11px;color:var(--pri);font-weight:700}
.ph-name{font-size:13px;font-weight:600}
.pb{height:3px;background:var(--acc);border-radius:2px;margin-top:4px}
.pf{height:100%;background:var(--pri);border-radius:2px;transition:width .3s}
.ls-btn{width:100%;background:transparent;border:none;border-bottom:1px solid var(--acc);padding:8px 10px 8px 28px;text-align:left;cursor:pointer;display:flex;align-items:center;gap:8px;font-family:'Sour Gummy',sans-serif;color:var(--text);font-size:13px}
.ls-btn:hover,.ls-btn.on{background:var(--acc)}
.ck{font-size:14px;color:var(--muted);flex-shrink:0}
.ck.done{color:var(--green)}
.proj-btn{width:100%;background:transparent;border:none;border-bottom:1px solid var(--acc);padding:8px 10px 8px 28px;text-align:left;cursor:pointer;display:flex;align-items:center;gap:8px;font-family:'Sour Gummy',sans-serif;color:var(--pri);font-size:13px;font-weight:700}
.proj-btn:hover,.proj-btn.on{background:var(--acc)}
/* MAIN */
#main{flex:1;min-width:0;overflow-y:auto;display:flex;flex-direction:column}
/* HOME */
#home{padding:24px 20px}
#home h1{color:var(--pri);font-size:28px;margin-bottom:8px}
.hint{font-size:15px;line-height:1.7;margin-bottom:22px;opacity:.85;max-width:520px}
.pc{background:var(--soft);border:2px solid var(--acc);border-radius:14px;padding:15px 18px;margin-bottom:12px;display:flex;align-items:center;gap:14px}
.pc:hover{border-color:var(--pri)}
.pc.soon{opacity:.55}
.pc-ic{font-size:26px;flex-shrink:0}
.pc-inf{flex:1;min-width:0}
.pc-tg{font-size:11px;color:var(--pri);font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.pc-nm{font-weight:700;font-size:15px}
.pc-ds{font-size:13px;opacity:.65}
.pc-pg{display:flex;align-items:center;gap:8px;margin-top:5px}
.pc-pg .bar{height:4px;background:var(--acc);border-radius:4px;width:120px;overflow:hidden}
.pc-pg .fill{height:100%;background:var(--pri);border-radius:4px;transition:width .3s}
.pc-pg .ct{font-size:12px;color:var(--pri)}
.sb-badge{font-size:12px;background:var(--acc);padding:5px 12px;border-radius:20px;flex-shrink:0}
/* LESSON */
#lv{display:flex;flex-direction:column;flex:1}
.lscroll{padding:16px 20px;border-bottom:2px solid var(--acc);overflow-y:auto;max-height:400px;flex-shrink:0}
.crumb{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.ctag{font-size:11px;background:var(--pri);color:var(--btxt);padding:3px 10px;border-radius:20px;font-weight:700}
.dtag{font-size:11px;background:var(--green);color:#fff;padding:3px 10px;border-radius:20px}
.lh{color:var(--pri);font-size:22px;margin:4px 0 14px}
.lt{line-height:1.7;margin:6px 0;font-size:14px}
pre.cb{background:var(--cbg);border:1px solid var(--acc);border-radius:8px;padding:14px;margin:8px 0;font-family:'Courier New',Courier,monospace;font-size:12.5px;overflow-x:auto;color:var(--text);line-height:1.65;white-space:pre}
.tb{background:var(--soft);border-left:4px solid var(--pri);border-radius:0 8px 8px 0;padding:10px 14px;margin:8px 0;font-size:14px;line-height:1.5}
.chal{background:var(--soft);border:2px solid var(--pri);border-radius:10px;padding:14px;margin-top:14px}
.chal h3{color:var(--pri);margin:0 0 6px;font-size:16px}
.chal p{margin:0 0 8px;line-height:1.6;font-size:14px}
.chal details summary{cursor:pointer;color:var(--pri);font-size:13px}
.lact{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
/* PROJECT */
#pv{display:flex;flex-direction:column;flex:1}
.pscroll{padding:16px 20px;border-bottom:2px solid var(--acc);overflow-y:auto;max-height:220px;flex-shrink:0}
.pscroll .ptag{font-size:11px;color:var(--pri);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.pscroll h2{color:var(--pri);font-size:22px;margin:0 0 10px}
.pscroll p{line-height:1.7;font-size:14px}
/* EDITOR */
.ep{display:flex;flex:1;border-top:2px solid var(--acc);min-height:330px}
.cs{width:50%;display:flex;flex-direction:column;border-right:2px solid var(--acc)}
.tbar{display:flex;background:var(--soft);border-bottom:1px solid var(--acc);flex-shrink:0}
.tb-btn{font-family:'Sour Gummy',sans-serif;background:transparent;color:var(--text);border:none;border-right:1px solid var(--acc);padding:7px 14px;cursor:pointer;font-size:13px}
.tb-btn.on{background:var(--pri);color:var(--btxt);font-weight:700}
textarea.ed{flex:1;background:var(--cbg);font-family:'Courier New',Courier,monospace;font-size:12px;padding:12px;border:none;outline:none;resize:none;line-height:1.7;color:#e06c75}
textarea.ed.css{color:#61afef}
textarea.ed.js{color:#e5c07b}
.ps{width:50%;display:flex;flex-direction:column}
.phdr{padding:5px 12px;background:var(--soft);border-bottom:1px solid var(--acc);font-size:12px;color:var(--muted);flex-shrink:0}
iframe{flex:1;border:none;background:#fff}
.hidden{display:none!important}
</style>
</head>
<body>
<header>
  <button class="ham" onclick="toggleSB()">☰</button>
  <div id="logo" onclick="goHome()">⚡ Code School · TobyK1DD</div>
  <span id="hdr-lesson"></span>
  <button class="btn icon sec" id="dark-btn" onclick="toggleDark()">🌙</button>
</header>
<div id="layout">
  <aside id="sb"></aside>
  <main id="main">
    <div id="home"></div>
    <div id="lv" class="hidden">
      <div class="lscroll" id="lcontent"></div>
      <div class="ep">
        <div class="cs">
          <div class="tbar">
            <button class="tb-btn on" onclick="setTab('html','lv')">HTML</button>
            <button class="tb-btn" onclick="setTab('css','lv')">CSS</button>
            <button class="tb-btn" onclick="setTab('js','lv')">JS</button>
          </div>
          <textarea class="ed" id="led" spellcheck="false" oninput="onInput('lv')"></textarea>
        </div>
        <div class="ps">
          <div class="phdr">👁 Live Preview</div>
          <iframe id="lif" sandbox="allow-scripts" title="Preview"></iframe>
        </div>
      </div>
    </div>
    <div id="pv" class="hidden">
      <div class="pscroll" id="pcontent"></div>
      <div class="ep">
        <div class="cs">
          <div class="tbar">
            <button class="tb-btn on" onclick="setTab('html','pv')">HTML</button>
            <button class="tb-btn" onclick="setTab('css','pv')">CSS</button>
            <button class="tb-btn" onclick="setTab('js','pv')">JS</button>
          </div>
          <textarea class="ed" id="ped" spellcheck="false" oninput="onInput('pv')"></textarea>
        </div>
        <div class="ps">
          <div class="phdr">👁 Live Preview</div>
          <iframe id="pif" sandbox="allow-scripts" title="Preview"></iframe>
        </div>
      </div>
    </div>
  </main>
</div>
<script>
// ===== STATE =====
const S = {
  view:'home', lessonId:null, phaseId:null, expandedPhase:'html',
  done:new Set(), dark:false, sbOpen:true, tab:{lv:'html',pv:'html'},
  code:{html:'',css:'',js:''}
};

// ===== DATA =====
const PHASES = [
  {id:'html',label:'Phase 1',title:'HTML',icon:'🏗️',desc:'Build the structure of every webpage',
   lessons:[
    {id:'h1',title:'What is HTML?',
     content:[
      {t:'p',v:'HTML stands for HyperText Markup Language. Think of it as the skeleton of a building — it gives every webpage its structure. Every piece of text, image, and link you see is defined by HTML.'},
      {t:'p',v:'HTML works through <strong>tags</strong> — keywords wrapped in angle brackets. Most tags come in pairs: an opening tag and a closing tag:'},
      {t:'c',v:'<h1>This is a heading</h1>\n<p>This is a paragraph.</p>\n<a href="#">This is a link</a>'},
      {t:'p',v:'Every HTML page follows this basic structure:'},
      {t:'c',v:'<!DOCTYPE html>\n<html>\n  <head>\n    <title>My Page</title>\n  </head>\n  <body>\n    <!-- Visible content goes here -->\n    <h1>Hello World!</h1>\n  </body>\n</html>'},
      {t:'t',v:'💡 The &lt;head&gt; holds invisible info (title, linked files). The &lt;body&gt; holds everything the user actually sees.'},
     ],
     code:{html:'<!DOCTYPE html>\n<html>\n<head>\n  <title>My First Page</title>\n</head>\n<body>\n  <h1>Hello World!</h1>\n  <p>I am learning HTML. This is exciting!</p>\n</body>\n</html>',css:'body {\n  font-family: sans-serif;\n  padding: 20px;\n  background: #f0f4f6;\n}',js:''},
     ch:{title:'Introduce Yourself',desc:'Change the heading to your name. Add a paragraph about where you\'re from. Add another paragraph about your hobbies.',hint:'Change content inside the &lt;body&gt; tags:\n\n&lt;h1&gt;Your Name&lt;/h1&gt;\n&lt;p&gt;I\'m from Nuneaton, England.&lt;/p&gt;\n&lt;p&gt;I love gaming and coding.&lt;/p&gt;'}},
    {id:'h2',title:'Headings, Text & Links',
     content:[
      {t:'p',v:'HTML has 6 heading levels — h1 (biggest) through h6 (smallest). Use them like chapters in a book:'},
      {t:'c',v:'<h1>Page Title (only one per page!)</h1>\n<h2>Section Heading</h2>\n<h3>Subsection</h3>\n<p>Normal text. Make it <strong>bold</strong> or <em>italic</em>.</p>'},
      {t:'p',v:'Links use the &lt;a&gt; anchor tag with an href attribute pointing to a URL:'},
      {t:'c',v:'<a href="https://google.com">Visit Google</a>\n\n<!-- Open in a new tab -->\n<a href="https://google.com" target="_blank">Google (new tab)</a>'},
      {t:'t',v:'💡 Only use one &lt;h1&gt; per page. It\'s like the book title — there should only ever be one!'},
     ],
     code:{html:'<!DOCTYPE html>\n<html>\n<head><title>My Favourite Sites</title></head>\n<body>\n  <h1>My Favourite Websites</h1>\n  <h2>Social Media</h2>\n  <p>Sites I use every day:</p>\n  <!-- Add links below -->\n\n  <h2>Entertainment</h2>\n  <p>For fun:</p>\n  <!-- More links -->\n\n</body>\n</html>',css:'body { font-family: sans-serif; padding: 20px; }\na { color: #f64e4e; font-size: 18px; display: block; margin: 8px 0; }',js:''},
     ch:{title:'Favourite Sites Page',desc:'Add at least 3 links to websites you actually use. Give each a target="_blank" so they open in a new tab. Organise them under h2 categories.',hint:'&lt;a href="https://youtube.com" target="_blank"&gt;YouTube&lt;/a&gt;\n&lt;a href="https://twitch.tv" target="_blank"&gt;Twitch&lt;/a&gt;'}},
    {id:'h3',title:'Images & Lists',
     content:[
      {t:'p',v:'Images use the &lt;img&gt; tag. It\'s self-closing — no closing tag needed. src is the image URL, alt describes it for screen readers:'},
      {t:'c',v:'<img src="https://placecats.com/300/200" alt="A cute cat" width="300">'},
      {t:'p',v:'Lists come in two flavours — unordered (bullet points) and ordered (numbered):'},
      {t:'c',v:'<!-- Bullet list -->\n<ul>\n  <li>HTML</li>\n  <li>CSS</li>\n  <li>JavaScript</li>\n</ul>\n\n<!-- Numbered list -->\n<ol>\n  <li>Learn HTML</li>\n  <li>Learn CSS</li>\n  <li>Build something!</li>\n</ol>'},
      {t:'t',v:'💡 Always include an alt attribute on images. It helps screen readers, SEO, and shows text if the image fails to load.'},
     ],
     code:{html:'<!DOCTYPE html>\n<html>\n<head><title>My Bucket List</title></head>\n<body>\n  <h1>My Bucket List</h1>\n  <img src="https://placecats.com/400/200" alt="placeholder" width="400">\n  <h2>Things I want to do:</h2>\n  <!-- Ordered list with 5 items -->\n\n  <h2>Skills I want to learn:</h2>\n  <!-- Unordered list with 3 skills -->\n\n</body>\n</html>',css:'body { font-family: sans-serif; padding: 20px; }\nimg { border-radius: 12px; display: block; margin-bottom: 20px; max-width: 100%; }',js:''},
     ch:{title:'Build Your Bucket List',desc:'Replace the placeholder image with a real image URL. Create an ordered list of 5 bucket list items. Add an unordered list of 3 skills you want to learn.',hint:'Right-click any image online → "Copy image address"\nPaste it: &lt;img src="YOUR URL" alt="description" width="400"&gt;'}},
   ],
   project:{title:'🏆 Project 1: Personal Profile Page',desc:'Build a complete personal profile page using only HTML. Must include: your name as a heading, a profile picture (any image URL), a bio paragraph, a list of your hobbies, and links to at least 3 websites.',
    code:{html:'<!DOCTYPE html>\n<html>\n<head>\n  <title>My Profile — [Your Name]</title>\n</head>\n<body>\n\n  <!-- YOUR NAME as a heading -->\n\n\n  <!-- PROFILE PICTURE -->\n\n\n  <!-- ABOUT ME -->\n  <h2>About Me</h2>\n\n\n  <!-- HOBBIES — use a list -->\n  <h2>My Hobbies</h2>\n\n\n  <!-- LINKS -->\n  <h2>Find Me Online</h2>\n\n\n</body>\n</html>',css:'body {\n  font-family: sans-serif;\n  padding: 40px;\n  max-width: 650px;\n  margin: 0 auto;\n  background: #f0f4f6;\n}',js:''}}},

  {id:'css',label:'Phase 2',title:'CSS',icon:'🎨',desc:'Make your pages look amazing',
   lessons:[
    {id:'c1',title:'What is CSS?',
     content:[
      {t:'p',v:'CSS (Cascading Style Sheets) makes websites look good. If HTML is the skeleton, CSS is the skin and clothes — it controls colours, fonts, spacing, and layout.'},
      {t:'p',v:'A CSS rule has a <strong>selector</strong> (what to target) and <strong>declarations</strong> (how to style it):'},
      {t:'c',v:'h1 {\n  color: #f64e4e;\n  font-size: 48px;\n  text-align: center;\n}'},
      {t:'p',v:'Target elements three ways: by tag name, class (.), or ID (#):'},
      {t:'c',v:'/* Tag — targets ALL <p> elements */\np { color: #333; }\n\n/* Class — elements with class="card" */\n.card { background: white; }\n\n/* ID — ONE element with id="hero" */\n#hero { font-size: 32px; }'},
      {t:'t',v:'💡 Classes are reusable (many elements can share one). IDs are unique — only appear once per page.'},
     ],
     code:{html:'<!DOCTYPE html>\n<html>\n<head><title>CSS Basics</title></head>\n<body>\n  <h1>Hello, CSS!</h1>\n  <p class="intro">This has class="intro".</p>\n  <p>This is a normal paragraph.</p>\n  <div id="highlight">Highlighted with an ID.</div>\n</body>\n</html>',css:'h1 {\n  color: #f64e4e;\n  text-align: center;\n}\n\n.intro {\n  font-size: 20px;\n  font-weight: bold;\n}\n\n#highlight {\n  background: #aac6d3;\n  padding: 15px;\n  border-radius: 8px;\n  margin-top: 20px;\n}',js:''},
     ch:{title:'Style a Profile Card',desc:'Add a &lt;div class="card"&gt; around your name and a short bio. Style .card with: white background, padding (20px), border-radius (12px), max-width of 400px.',hint:'.card {\n  background: white;\n  padding: 20px;\n  border-radius: 12px;\n  max-width: 400px;\n  margin: 20px auto;\n}'}},
    {id:'c2',title:'Box Model & Spacing',
     content:[
      {t:'p',v:'Every HTML element is a rectangular box. The Box Model describes the layers from inside out: content → padding → border → margin.'},
      {t:'c',v:'.box {\n  /* Space INSIDE the border */\n  padding: 20px;\n\n  /* The visible border */\n  border: 3px solid black;\n\n  /* Space OUTSIDE the border */\n  margin: 10px;\n}'},
      {t:'p',v:'Shorthand lets you control all sides at once:'},
      {t:'c',v:'/* All sides equal */\npadding: 20px;\n\n/* Top/bottom | Left/right */\npadding: 10px 20px;\n\n/* Top | Right | Bottom | Left */\npadding: 10px 20px 15px 5px;'},
      {t:'t',v:'💡 margin: 0 auto; centres a block element horizontally. Combine with max-width for the classic page layout.'},
     ],
     code:{html:'<!DOCTYPE html>\n<html>\n<head><title>Card Component</title></head>\n<body>\n  <div class="card">\n    <h2>My Card</h2>\n    <p>Cards group related content. They are everywhere on the web.</p>\n    <a class="btn" href="#">Learn More</a>\n  </div>\n</body>\n</html>',css:'body {\n  background: #c8d0d3;\n  font-family: sans-serif;\n  padding: 40px;\n  display: flex;\n  justify-content: center;\n}\n\n.card {\n  background: white;\n  /* Add: padding, border-radius, max-width here */\n\n}\n\n.btn {\n  display: inline-block;\n  background: #f64e4e;\n  color: white;\n  padding: 10px 22px;\n  border-radius: 8px;\n  text-decoration: none;\n  margin-top: 15px;\n}',js:''},
     ch:{title:'Perfect the Card',desc:'Style .card with: padding (20px+), border-radius (12px), max-width of 400px, centred with margin: 0 auto, and a subtle box-shadow.',hint:'.card {\n  padding: 24px;\n  border-radius: 12px;\n  max-width: 400px;\n  margin: 0 auto;\n  box-shadow: 0 4px 20px rgba(0,0,0,0.1);\n}'}},
    {id:'c3',title:'Flexbox Layout',
     content:[
      {t:'p',v:'Flexbox is the most powerful CSS layout tool. Add display: flex to a container and its children become flex items you can arrange however you like.'},
      {t:'c',v:'.container {\n  display: flex;\n  flex-direction: row;      /* or column */\n  justify-content: center;  /* horizontal alignment */\n  align-items: center;      /* vertical alignment */\n  gap: 20px;\n  flex-wrap: wrap;\n}'},
      {t:'p',v:'justify-content values: flex-start | flex-end | center | space-between | space-around'},
      {t:'c',v:'/* Classic navigation bar */\nnav {\n  display: flex;\n  justify-content: space-between;\n  align-items: center;\n  padding: 15px 30px;\n  background: #f64e4e;\n}'},
      {t:'t',v:'💡 Flexbox literally changed web development. Master this one property and layouts become easy.'},
     ],
     code:{html:'<!DOCTYPE html>\n<html>\n<head><title>Flexbox</title></head>\n<body>\n  <nav class="navbar">\n    <div class="logo">MyBrand</div>\n    <div class="links">\n      <a href="#">Home</a>\n      <a href="#">About</a>\n      <a href="#">Work</a>\n      <a href="#">Contact</a>\n    </div>\n  </nav>\n  <div class="grid">\n    <div class="card">Card 1</div>\n    <div class="card">Card 2</div>\n    <div class="card">Card 3</div>\n  </div>\n</body>\n</html>',css:'*{box-sizing:border-box;margin:0}\nbody{font-family:sans-serif;background:#c8d0d3}\n.navbar{display:flex;justify-content:space-between;align-items:center;background:#f64e4e;padding:15px 30px;color:white}\n.logo{font-size:22px;font-weight:700}\n.links{display:flex;gap:20px}\n.links a{color:white;text-decoration:none;font-size:16px}\n.grid{display:flex;gap:20px;padding:30px;flex-wrap:wrap}\n.card{flex:1;min-width:180px;background:white;padding:30px;border-radius:12px;text-align:center;font-size:18px}',js:''},
     ch:{title:'Build a Feature Grid',desc:'Add 2 more cards. Give each an emoji, &lt;h3&gt; title, and &lt;p&gt; description. Add align-items: stretch to .grid so all cards are equal height.',hint:'Each card:\n&lt;div class="card"&gt;\n  &lt;div style="font-size:2rem"&gt;🚀&lt;/div&gt;\n  &lt;h3&gt;Feature&lt;/h3&gt;\n  &lt;p&gt;Short description.&lt;/p&gt;\n&lt;/div&gt;'}},

   project:{title:'🏆 Project 2: Styled Portfolio',desc:'Take your Phase 1 profile and make it beautiful with CSS. Requirements: a flexbox navbar with your name and links, a hero section with a tagline, a card grid for projects, hover effects on buttons and links, and a footer.',

// ===== HELPERS =====
function esc(s){return s?String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'):''}
function phOf(id){return PHASES.find(p=>p.lessons.some(l=>l.id===id))}
function lsOf(id){for(const p of PHASES){const l=p.lessons.find(x=>x.id===id);if(l)return l}return null}
function nextOf(id){
  const ph=phOf(id);if(!ph)return null;
  const i=ph.lessons.findIndex(l=>l.id===id);
  if(i<ph.lessons.length-1)return{type:'lesson',lesson:ph.lessons[i+1]};
  if(ph.project)return{type:'project',phase:ph};
  return null;
}
function buildDoc(h,c,j){
  let d=h;
  const s=`<style>${c}</style>`,jt=`<scr`+`ipt>${j}</scr`+`ipt>`;
  if(d.includes('</head>'))d=d.replace('</head>',s+'</head>');
  else d=`<!DOCTYPE html><html><head><meta charset="utf-8">${s}</head><body>${d}</body></html>`;
  if(d.includes('</body>'))d=d.replace('</body>',jt+'</body>');
  return d;
}

// ===== PREVIEW =====
let pvTimer;
function schedPv(){clearTimeout(pvTimer);pvTimer=setTimeout(runPv,500)}
function runPv(){
  const iid=S.view==='pv'?'pif':'lif';
  const f=document.getElementById(iid);
  if(f)f.srcdoc=buildDoc(S.code.html,S.code.css,S.code.js);
}

// ===== EDITOR =====
function saveTab(){
  const eid=S.view==='pv'?'ped':'led';
  const e=document.getElementById(eid);
  if(e)S.code[S.tab[S.view]]=e.value;
}
function setTab(tab,view){
  saveTab();
  S.tab[view]=tab;
  document.querySelectorAll(`#${view} .tb-btn`).forEach(b=>b.classList.toggle('on',b.textContent.toLowerCase()===tab));
  const e=document.getElementById(view==='pv'?'ped':'led');
  if(e){e.value=S.code[tab];e.className='ed'+(tab==='css'?' css':tab==='js'?' js':'');}
}
function onInput(view){
  const e=document.getElementById(view==='pv'?'ped':'led');
  if(e){S.code[S.tab[view]]=e.value;schedPv();}
}
function loadEditor(view){
  S.tab[view]='html';
  document.querySelectorAll(`#${view} .tb-btn`).forEach(b=>b.classList.toggle('on',b.textContent.toLowerCase()==='html'));
  const e=document.getElementById(view==='pv'?'ped':'led');
  if(e){e.value=S.code.html;e.className='ed';}
  runPv();
}

// ===== SIDEBAR =====
function renderSB(){
  let h='';
  for(const ph of PHASES){
    const done=ph.lessons.filter(l=>S.done.has(l.id)).length;
    const tot=ph.lessons.length;
    const open=S.expandedPhase===ph.id;
    const pct=tot>0?(done/tot)*100:0;
    h+=`<div>
      <button class="ph-btn" ${ph.comingSoon?'disabled':''} onclick="togglePh('${ph.id}')">
        <span style="font-size:18px">${ph.icon}</span>
        <div class="ph-meta">
          <div class="ph-tag">${esc(ph.label)}</div>
          <div class="ph-name">${esc(ph.title)}</div>
          ${!ph.comingSoon&&tot>0?`<div class="pb"><div class="pf" style="width:${pct}%"></div></div>`:''}
        </div>
        ${ph.comingSoon?'<span style="font-size:10px">Soon</span>':`<span style="font-size:11px">${open?'▲':'▼'}</span>`}
      </button>
      ${open?`<div>
        ${ph.lessons.map(l=>`
          <button class="ls-btn ${S.lessonId===l.id&&S.view==='lv'?'on':''}" onclick="goLesson('${l.id}')">
            <span class="ck ${S.done.has(l.id)?'done':''}">${S.done.has(l.id)?'✓':'○'}</span>${esc(l.title)}
          </button>`).join('')}
        ${ph.project?`<button class="proj-btn ${S.phaseId===ph.id&&S.view==='pv'?'on':''}" onclick="goProject('${ph.id}')">🏆 Project</button>`:''}
      </div>`:''}
    </div>`;
  }
  document.getElementById('sb').innerHTML=h;
}

// ===== HOME =====
function renderHome(){
  let h=`<h1>Welcome back! 👋</h1><p class="hint">Your personal roadmap from absolute beginner to shipping real web apps. Work through each phase, complete the challenges, and build real projects.</p>`;
  for(const ph of PHASES){
    const done=ph.lessons.filter(l=>S.done.has(l.id)).length;
    const tot=ph.lessons.length;
    const pct=tot>0?(done/tot)*100:0;
    h+=`<div class="pc ${ph.comingSoon?'soon':''}">
      <div class="pc-ic">${ph.icon}</div>
      <div class="pc-inf">
        <div class="pc-tg">${esc(ph.label)}</div>
        <div class="pc-nm">${esc(ph.title)}</div>
        <div class="pc-ds">${esc(ph.desc)}</div>
        ${!ph.comingSoon&&tot>0?`<div class="pc-pg"><div class="bar"><div class="fill" style="width:${pct}%"></div></div><span class="ct">${done}/${tot}</span></div>`:''}
      </div>
      ${ph.comingSoon?`<span class="sb-badge">Coming soon</span>`:`<button class="btn" onclick="goLesson('${ph.lessons[0]?.id}')">${done>0?'Continue →':'Start →'}</button>`}
    </div>`;
  }
  document.getElementById('home').innerHTML=h;
}

// ===== LESSON =====
function renderLesson(){
  const l=lsOf(S.lessonId);if(!l)return;
  const ph=phOf(l.id);
  const isDone=S.done.has(l.id);
  const next=nextOf(l.id);
  let h=`<div class="crumb"><span class="ctag">${esc(ph?.label)} · ${esc(ph?.title)}</span>${isDone?'<span class="dtag">✓ Complete</span>':''}</div>`;
  h+=`<h2 class="lh">${esc(l.title)}</h2>`;
  for(const b of l.content){
    if(b.t==='p')h+=`<p class="lt">${b.v}</p>`;
    else if(b.t==='c')h+=`<pre class="cb">${esc(b.v)}</pre>`;
    else if(b.t==='t')h+=`<div class="tb">${b.v}</div>`;
  }
  h+=`<div class="chal">
    <h3>🎯 ${esc(l.ch.title)}</h3>
    <p>${l.ch.desc}</p>
    <details><summary>💡 Show hint</summary><pre class="cb" style="margin-top:8px;font-size:12px">${l.ch.hint}</pre></details>
  </div>
  <div class="lact">
    ${!isDone?`<button class="btn" onclick="markDone()">✓ Mark Complete</button>`:''}
    ${next?.type==='lesson'?`<button class="btn sec" onclick="goLesson('${next.lesson.id}')">Next lesson →</button>`:''}
    ${next?.type==='project'?`<button class="btn sec" onclick="goProject('${next.phase.id}')">🏆 Go to Project →</button>`:''}
  </div>`;
  document.getElementById('lcontent').innerHTML=h;
}

// ===== PROJECT =====
function renderProject(){
  const ph=PHASES.find(p=>p.id===S.phaseId);if(!ph?.project)return;
  document.getElementById('pcontent').innerHTML=`
    <div class="ptag">${esc(ph.label)} · ${esc(ph.title)}</div>
    <h2>${esc(ph.project.title)}</h2>
    <p>${esc(ph.project.desc)}</p>`;
}

// ===== NAVIGATION =====
function showV(v){
  S.view=v;
  ['home','lv','pv'].forEach(id=>document.getElementById(id).classList.toggle('hidden',id!==v));
}
function goHome(){
  saveTab();S.view='home';S.lessonId=null;S.phaseId=null;
  showV('home');document.getElementById('hdr-lesson').textContent='';
  renderHome();renderSB();
}
function goLesson(id){
  if(!id)return;saveTab();
  const l=lsOf(id);if(!l)return;
  S.lessonId=id;S.phaseId=null;S.expandedPhase=phOf(id)?.id;
  S.code={html:l.code.html,css:l.code.css,js:l.code.js};
  showV('lv');document.getElementById('hdr-lesson').textContent=l.title;
  renderLesson();loadEditor('lv');renderSB();
}
function goProject(id){
  saveTab();const ph=PHASES.find(p=>p.id===id);if(!ph?.project)return;
  S.phaseId=id;S.lessonId=null;S.expandedPhase=id;
  S.code={html:ph.project.code.html,css:ph.project.code.css,js:ph.project.code.js};
  showV('pv');document.getElementById('hdr-lesson').textContent=ph.project.title;
  renderProject();loadEditor('pv');renderSB();
}
function togglePh(id){S.expandedPhase=S.expandedPhase===id?null:id;renderSB()}
function markDone(){if(S.lessonId){S.done.add(S.lessonId);renderLesson();renderSB();renderHome();}}
function toggleSB(){S.sbOpen=!S.sbOpen;document.getElementById('sb').classList.toggle('closed',!S.sbOpen)}
function toggleDark(){S.dark=!S.dark;document.body.classList.toggle('dark',S.dark);document.getElementById('dark-btn').textContent=S.dark?'☀️':'🌙'}

// ===== INIT =====
renderSB();renderHome();
</script>
