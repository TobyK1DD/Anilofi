ashboard using everything from Phase 3. Must have: 8+ objects in an array, rendered as cards using .map(), filterable by text search with .filter(), sortable by 2+ properties, a modal on card click showing full details, a stats bar using .reduce() (total, average, count), keyboard shortcut (Escape) to close the modal, and all data in a clean array-of-objects structure — no hardcoded HTML.", "code": {"html": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  <title>My Dashboard<\/title>\n<\/head>\n<body>\n  <header class=\"header\">\n    <h1>My Dashboard<\/h1>\n    <div class=\"controls\">\n      <input id=\"search\" type=\"text\" placeholder=\"Search...\">\n      <select id=\"sort\">\n        <option value=\"\">Sort by...<\/option>\n      <\/select>\n    <\/div>\n  <\/header>\n  <div id=\"stats\" class=\"stats\"><\/div>\n  <div id=\"grid\" class=\"grid\"><\/div>\n  <!-- Modal -->\n  <div id=\"modal\" class=\"modal hidden\">\n    <div class=\"modal-box\">\n      <button id=\"close\">×<\/button>\n      <div id=\"modal-body\"><\/div>\n    <\/div>\n  <\/div>\n<\/body>\n<\/html>", "css": "* { box-sizing: border-box; margin: 0; }\nbody { font-family: sans-serif; background: #c8d0d3; }\n.header { background: #f64e4e; padding: 20px 30px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }\n.header h1 { color: white; }\n.controls { display: flex; gap: 10px; }\ninput, select { padding: 10px; border: 3px solid white; border-radius: 8px; font-size: 15px; outline: none; }\n.stats { background: white; padding: 15px 30px; border-bottom: 1px solid #eee; display: flex; gap: 30px; font-size: 14px; flex-wrap: wrap; }\n.stats span { color: #555; }\n.stats strong { color: #f64e4e; }\n.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px,1fr)); gap: 16px; padding: 20px; }\n.modal { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 100; }\n.modal.hidden { display: none; }\n.modal-box { background: white; padding: 30px; border-radius: 16px; max-width: 400px; width: 90%; position: relative; }\n.modal-box button { position: absolute; top: 15px; right: 15px; background: #555; color: white; border: none; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; font-size: 18px; }", "js": "// ===== YOUR DATA =====\nconst DATA = [\n  // Add 8+ objects here!\n  // e.g. { id:1, name:\"Item\", category:\"A\", value:100, description:\"...\" }\n];\n\n// ===== RENDER =====\nfunction renderStats(items) {\n  // Use .reduce() for totals\n  // Use .filter() for counts\n}\n\nfunction renderGrid(items) {\n  document.getElementById(\"grid\").innerHTML = items.map(item => `\n    <div class=\"card\" onclick=\"openModal(${item.id})\">\n      <!-- Your card HTML here -->\n    <\/div>\n  `).join(\"\");\n}\n\nfunction openModal(id) {\n  const item = DATA.find(d => d.id === id);\n  document.getElementById(\"modal-body\").innerHTML = `<h2>${item.name}<\/h2>`;\n  document.getElementById(\"modal\").classList.remove(\"hidden\");\n}\n\n// ===== EVENTS =====\ndocument.getElementById(\"search\").addEventListener(\"input\", go);\ndocument.getElementById(\"sort\").addEventListener(\"change\", go);\ndocument.getElementById(\"close\").addEventListener(\"click\", () =>\n  document.getElementById(\"modal\").classList.add(\"hidden\"));\ndocument.addEventListener(\"keydown\", e => {\n  if (e.key === \"Escape\") document.getElementById(\"modal\").classList.add(\"hidden\");\n});\n\nfunction go() {\n  const q = document.getElementById(\"search\").value.toLowerCase();\n  let r = DATA.filter(d => d.name.toLowerCase().includes(q));\n  // Add sorting...\n  renderStats(r);\n  renderGrid(r);\n}\n\ngo();"}}}, {"id": "debug", "label": "Debug Lab", "title": "Debug Lab", "icon": "🐛", "desc": "Find and fix broken code — closest thing to real dev work", "lessons": [{"id": "dbg1", "title": "The Invisible Paragraph", "content": [{"t": "p", "v": "The page should show TWO paragraphs of text. Only one is appearing."}, {"t": "c", "v": "<!-- Expected output:\n   \"Hello World!\" on one line\n   \"This is the second paragraph.\" below it -->"}, {"t": "t", "v": "🐛 Bugs like this are very common. Read the HTML carefully — every opening tag needs a matching closing tag."}], "code": {"html": "<!DOCTYPE html>\n<html>\n<head><title>Debug 1<\/title><\/head>\n<body>\n  <p>Hello World!\n  <p>This is the second paragraph.<\/p>\n<\/body>\n<\/html>", "css": "body { font-family: sans-serif; padding: 20px; font-size: 18px; }", "js": ""}, "ch": {"title": "Find & Fix the Bug", "desc": "One paragraph is not closed correctly. The browser is merging both paragraphs together. Find the missing closing tag and fix it.", "hint": "The first <p> is never closed.\nAdd <\/p> after \"Hello World!\" to close it.\n\n<p>Hello World!<\/p>\n<p>This is the second paragraph.<\/p>"}}, {"id": "dbg2", "title": "The Button That Does Nothing", "content": [{"t": "p", "v": "Clicking the button should change the heading to \"Clicked!\" — but nothing happens."}, {"t": "c", "v": "<!-- Expected: clicking the button updates the h1 text -->"}, {"t": "t", "v": "🐛 querySelector is very picky about selectors. A missing symbol means it targets nothing — and JavaScript fails silently."}], "code": {"html": "<!DOCTYPE html>\n<html>\n<head><title>Debug 2<\/title><\/head>\n<body>\n  <h1 id=\"title\">Click the button!<\/h1>\n  <button onclick=\"changeTitle()\">Click me<\/button>\n<\/body>\n<\/html>", "css": "body { font-family: sans-serif; padding: 30px; text-align: center; }", "js": "function changeTitle() {\n  // BUG: selector is wrong\n  const el = document.querySelector(\"title\");\n  el.textContent = \"Clicked!\";\n}"}, "ch": {"title": "Find & Fix the Bug", "desc": "The querySelector is targeting the wrong element. It targets the <title> in the <head>, not the <h1> with id=\"title\". Fix the selector.", "hint": "// querySelector(\"title\") grabs the <title> tag in <head>\n// You need to target by ID — IDs use the # symbol\n\nconst el = document.querySelector(\"#title\");\n// OR:\nconst el = document.getElementById(\"title\");"}}, {"id": "dbg3", "title": "The Broken Layout", "content": [{"t": "p", "v": "There are two boxes that should sit side by side, each exactly 50% wide. But the second one is wrapping below instead."}, {"t": "c", "v": "<!-- Expected: two boxes sitting side by side, each 50% wide -->"}, {"t": "t", "v": "🐛 This is the most common CSS layout bug. Width + border + padding can exceed 100% unless you use box-sizing: border-box."}], "code": {"html": "<!DOCTYPE html>\n<html>\n<head><title>Debug 3<\/title><\/head>\n<body>\n  <div class=\"row\">\n    <div class=\"box\">Box One<\/div>\n    <div class=\"box\">Box Two<\/div>\n  <\/div>\n<\/body>\n<\/html>", "css": "body { margin: 0; font-family: sans-serif; }\n\n.row {\n  display: flex;\n}\n\n.box {\n  width: 50%;\n  padding: 20px;\n  border: 3px solid #f64e4e;\n  background: #e3edf0;\n  /* Missing something here! */\n}", "js": ""}, "ch": {"title": "Find & Fix the Bug", "desc": "The boxes are 50% wide but their borders and padding push them over 100% total. Fix the CSS so each box is exactly 50% of the container including its padding and border.", "hint": "/* Add this to .box: */\nbox-sizing: border-box;\n\n/* Or add this globally at the top: */\n* { box-sizing: border-box; }\n\n/* border-box means padding and border are\n   included in the width, not added on top */"}}, {"id": "dbg4", "title": "The Always-True If", "content": [{"t": "p", "v": "The score checker should only say \"Perfect!\" when the score is exactly 100. But it always says \"Perfect!\" no matter what number you enter."}, {"t": "c", "v": "<!-- Expected: only shows \"Perfect!\" when score === 100 -->"}, {"t": "t", "v": "🐛 This is one of the most dangerous bugs in JavaScript because the code runs without any error. Always use === for comparison."}], "code": {"html": "<!DOCTYPE html>\n<html>\n<head><title>Debug 4<\/title><\/head>\n<body>\n  <input type=\"number\" id=\"score\" placeholder=\"Enter score...\">\n  <button onclick=\"check()\">Check<\/button>\n  <p id=\"result\"><\/p>\n<\/body>\n<\/html>", "css": "body { font-family: sans-serif; padding: 30px; }\ninput { padding: 8px; font-size: 16px; margin-right: 8px; }\nbutton { padding: 8px 16px; background: #f64e4e; color: white; border: none; border-radius: 6px; cursor: pointer; }\n#result { font-size: 20px; margin-top: 16px; font-weight: bold; }", "js": "function check() {\n  const score = parseInt(document.getElementById(\"score\").value);\n  const result = document.getElementById(\"result\");\n  \n  // BUG is on the next line:\n  if (score = 100) {\n    result.textContent = \"Perfect! 🎉\";\n  } else {\n    result.textContent = `Score: ${score}`;\n  }\n}"}, "ch": {"title": "Find & Fix the Bug", "desc": "A single = is an ASSIGNMENT, not a comparison. It sets score to 100 and returns 100 (truthy), so the if block always runs. Fix it to use the correct comparison operator.", "hint": "// = is assignment (sets the value)\n// === is comparison (checks if equal)\n\n// Change:\nif (score = 100)\n\n// To:\nif (score === 100)"}}, {"id": "dbg5", "title": "The Off-By-One Array", "content": [{"t": "p", "v": "The function should log the LAST item in the fruits array. Instead it logs \"undefined\"."}, {"t": "c", "v": "// fruits = [\"apple\", \"banana\", \"cherry\"]\n// Expected: \"cherry\"\n// Actual: undefined"}, {"t": "t", "v": "🐛 Off-by-one errors are the most common array bug. Arrays start at index 0, so the last item is always at length MINUS 1."}], "code": {"html": "<!DOCTYPE html>\n<html>\n<head><title>Debug 5<\/title><\/head>\n<body>\n  <h2 id=\"result\">Loading...<\/h2>\n<\/body>\n<\/html>", "css": "body { font-family: sans-serif; padding: 30px; }\nh2 { color: #f64e4e; }", "js": "const fruits = [\"apple\", \"banana\", \"cherry\"];\n\n// BUG: this always returns undefined\nconst lastFruit = fruits[fruits.length];\n\ndocument.getElementById(\"result\").textContent =\n  \"Last fruit: \" + lastFruit;"}, "ch": {"title": "Find & Fix the Bug", "desc": "Arrays are zero-indexed. For an array of 3 items, the valid indices are 0, 1, 2. fruits.length is 3, but fruits[3] does not exist. Fix the index to get the last item.", "hint": "// fruits.length = 3\n// But valid indices are: 0, 1, 2\n// Index 3 does not exist → undefined\n\n// Fix:\nconst lastFruit = fruits[fruits.length - 1];\n// = fruits[2] = \"cherry\" ✓"}}, {"id": "dbg6", "title": "The Missing Return", "content": [{"t": "p", "v": "The add() function should return the sum of two numbers. The result always shows as \"undefined\" instead of the correct answer."}, {"t": "c", "v": "// add(3, 5) should return 8\n// But result shows: undefined"}, {"t": "t", "v": "🐛 A function without a return statement returns undefined automatically. You must explicitly return the value."}], "code": {"html": "<!DOCTYPE html>\n<html>\n<head><title>Debug 6<\/title><\/head>\n<body>\n  <h2 id=\"result\">Calculating...<\/h2>\n<\/body>\n<\/html>", "css": "body { font-family: sans-serif; padding: 30px; }\nh2 { font-size: 2rem; color: #f64e4e; }", "js": "function add(a, b) {\n  // BUG: calculates but never returns!\n  const sum = a + b;\n  // What is missing here?\n}\n\nconst result = add(3, 5);\ndocument.getElementById(\"result\").textContent =\n  \"3 + 5 = \" + result;"}, "ch": {"title": "Find & Fix the Bug", "desc": "The function calculates the sum but never sends it back to the caller. Any function that should produce a value needs an explicit return statement. Add it.", "hint": "function add(a, b) {\n  const sum = a + b;\n  return sum;  // ← add this!\n}\n\n// Or shorthand:\nfunction add(a, b) {\n  return a + b;\n}"}}, {"id": "dbg7", "title": "The Frozen Form", "content": [{"t": "p", "v": "Submitting the form should show an alert with the entered name. Instead, the page reloads and nothing happens."}, {"t": "c", "v": "<!-- Expected: alert(\"Hello, [name]!\") on submit\n     Actual: page reloads, form clears, no alert -->"}, {"t": "t", "v": "🐛 This is one of the most common beginner JS bugs. HTML forms reload the page by default. You must prevent that behaviour to handle submission with JavaScript."}], "code": {"html": "<!DOCTYPE html>\n<html>\n<head><title>Debug 7<\/title><\/head>\n<body>\n  <form id=\"myForm\">\n    <input type=\"text\" id=\"nameInput\" placeholder=\"Your name\">\n    <button type=\"submit\">Say Hello<\/button>\n  <\/form>\n<\/body>\n<\/html>", "css": "body { font-family: sans-serif; padding: 30px; }\ninput { padding: 10px; font-size: 16px; margin-right: 8px; border: 2px solid #aac6d3; border-radius: 8px; }\nbutton { padding: 10px 18px; background: #f64e4e; color: white; border: none; border-radius: 8px; cursor: pointer; }", "js": "document.getElementById(\"myForm\").addEventListener(\"submit\", function() {\n  // BUG: the page reloads before this runs\n  const name = document.getElementById(\"nameInput\").value;\n  alert(\"Hello, \" + name + \"!\");\n});"}, "ch": {"title": "Find & Fix the Bug", "desc": "The form's default submit behaviour is reloading the page. You need to stop that before running your JavaScript. The event object has a method for exactly this.", "hint": "// The event listener receives an event object (e)\n// Call e.preventDefault() to stop the page reloading\n\ndocument.getElementById(\"myForm\").addEventListener(\"submit\", function(e) {\n  e.preventDefault();  // ← stops the reload\n  const name = document.getElementById(\"nameInput\").value;\n  alert(\"Hello, \" + name + \"!\");\n});"}}, {"id": "dbg8", "title": "The Sort That Breaks Things", "content": [{"t": "p", "v": "The page shows the original list and a sorted copy side by side. But after sorting, BOTH lists are showing the sorted order."}, {"t": "c", "v": "// Original should be: [3, 1, 4, 1, 5]\n// Sorted should be:   [1, 1, 3, 4, 5]\n// But both show:      [1, 1, 3, 4, 5]"}, {"t": "t", "v": "🐛 Array methods like sort() and splice() MUTATE the original array. If you sort arr, you sort the original. Always copy first when you need to preserve the original."}], "code": {"html": "<!DOCTYPE html>\n<html>\n<head><title>Debug 8<\/title><\/head>\n<body>\n  <div id=\"original\"><\/div>\n  <div id=\"sorted\"><\/div>\n<\/body>\n<\/html>", "css": "body { font-family: sans-serif; padding: 30px; }\ndiv { margin: 10px 0; padding: 14px; background: #e3edf0; border-radius: 8px; }\ndiv::before { font-weight: bold; display: block; margin-bottom: 6px; color: #f64e4e; }", "js": "const numbers = [3, 1, 4, 1, 5];\n\n// BUG: sort() mutates the ORIGINAL array!\nconst sorted = numbers.sort((a, b) => a - b);\n\ndocument.getElementById(\"original\").textContent =\n  \"Original: \" + numbers.join(\", \");\ndocument.getElementById(\"sorted\").textContent =\n  \"Sorted: \" + sorted.join(\", \");"}, "ch": {"title": "Find & Fix the Bug", "desc": "Array.sort() modifies the original array in place. Both variables point to the same mutated array. Fix it so the original is preserved by creating a copy before sorting.", "hint": "// Spread [...arr] creates a shallow copy\nconst sorted = [...numbers].sort((a, b) => a - b);\n// Now \"numbers\" is untouched and \"sorted\" is the new sorted copy\n\n// Alternative:\nconst sorted = numbers.slice().sort((a, b) => a - b);"}}], "project": null, "isDebug": true}, {"id": "vercel", "label": "Phase 4", "title": "Vercel", "icon": "🚀", "desc": "Deploy your sites live to the world", "comingSoon": true, "lessons": [], "project": null}, {"id": "supabase", "label": "Phase 5", "title": "Supabase", "icon": "🗄️", "desc": "Add a real backend, database and auth", "comingSoon": true, "lessons": [], "project": null}, {"id": "lemon", "label": "Phase 6", "title": "Lemon Squeezy", "icon": "🍋", "desc": "Add payments and start making money", "comingSoon": true, "lessons": [], "project": null}];

// ── AUTH ────────────────────────────────────────────────────────────────────
const A_USERS='CS_USERS',A_SESS='CS_SESSION';
const aKey=u=>'CS_DATA_'+u;
function getUsers(){return JSON.parse(localStorage.getItem(A_USERS)||'{}')}
function setUsers(u){localStorage.setItem(A_USERS,JSON.stringify(u))}
function getSession(){return JSON.parse(localStorage.getItem(A_SESS)||'null')}
function setSession(s){localStorage.setItem(A_SESS,JSON.stringify(s))}
function getUserData(u){return JSON.parse(localStorage.getItem(aKey(u))||'{"done":[],"dark":false,"quizBest":{}}')}
function setUserData(u,d){localStorage.setItem(aKey(u),JSON.stringify(d))}

function authTab(t){
  document.querySelectorAll('.auth-tab').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));
  document.getElementById('auth-login').classList.toggle('hidden',t!=='login');
  document.getElementById('auth-signup').classList.toggle('hidden',t!=='signup');
  document.getElementById('liMsg').textContent='';
  document.getElementById('suMsg').textContent='';
}
function doLogin(){
  const u=document.getElementById('liUser').value.trim().toLowerCase();
  const p=document.getElementById('liPass').value;
  const msg=document.getElementById('liMsg');
  if(!u||!p){msg.textContent='Please fill in all fields.';return;}
  const users=getUsers();
  if(!users[u]){msg.textContent='Username not found.';return;}
  if(users[u].password!==btoa(p)){msg.textContent='Incorrect password.';return;}
  setSession({username:u});hideAuthScreen();loadUserSession(u);
  showToast('Welcome back, '+u+'! 👋');
}
function doSignup(){
  const u=document.getElementById('suUser').value.trim().toLowerCase();
  const e=document.getElementById('suEmail').value.trim();
  const p=document.getElementById('suPass').value;
  const msg=document.getElementById('suMsg');
  if(!u||!e||!p){msg.textContent='Please fill in all fields.';return;}
  if(u.length<3){msg.textContent='Username must be at least 3 characters.';return;}
  if(!/^[a-z0-9_]+$/.test(u)){msg.textContent='Only letters, numbers and underscores.';return;}
  if(!e.includes('@')){msg.textContent='Enter a valid email address.';return;}
  if(p.length<6){msg.textContent='Password must be at least 6 characters.';return;}
  const users=getUsers();
  if(users[u]){msg.textContent='That username is already taken.';return;}
  users[u]={email:e,password:btoa(p),createdAt:Date.now()};
  setUsers(users);setSession({username:u});hideAuthScreen();loadUserSession(u);
  showToast('Welcome to Code School, '+u+'! 🎉');
}
function doLogout(){
  saveProgress();setSession(null);S.currentUser=null;S.done=new Set();
  S.dark=false;S.view='home';
  document.body.classList.remove('dark');
  document.getElementById('dark-btn').textContent='🌙';
  document.getElementById('hdr-sub').textContent='';
  showV('home');showAuthScreen();
}
function loadUserSession(u){
  S.currentUser=u;
  const d=getUserData(u);
  S.done=new Set(d.done||[]);
  S.quizBest=d.quizBest||{};
  if(d.dark){S.dark=true;document.body.classList.add('dark');document.getElementById('dark-btn').textContent='☀️';}
  document.getElementById('acct-name').textContent=u;
  document.getElementById('acct-area').style.display='flex';
  renderSB();renderHome();
}
function saveProgress(){
  if(!S.currentUser)return;
  setUserData(S.currentUser,{done:[...S.done],dark:S.dark,quizBest:S.quizBest||{}});
}
function showAuthScreen(){document.getElementById('auth-screen').classList.remove('hidden');document.getElementById('acct-area').style.display='none';}
function hideAuthScreen(){document.getElementById('auth-screen').classList.add('hidden');}
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),3000);
}

// ── STATE ────────────────────────────────────────────────────────────────────
const S={
  view:'home',lessonId:null,phaseId:null,expandedPhase:'html',
  done:new Set(),dark:false,sbOpen:true,currentUser:null,quizBest:{},
  tab:{lv:'html',pv:'html'},code:{html:'',css:'',js:''}
};

// ── QUIZ ─────────────────────────────────────────────────────────────────────
const Q={active:false,lid:null,qs:[],cur:0,score:0,answered:false};

function startQuiz(lid){
  const l=lsOf(lid);
  if(!l||!l.quiz||!l.quiz.length){showToast('No quiz for this lesson yet.');return;}
  Q.lid=lid;Q.qs=l.quiz;Q.cur=0;Q.score=0;Q.answered=false;
  document.getElementById('quiz-overlay').classList.remove('hidden');
  renderQuiz();
}
function renderQuiz(){
  const q=Q.qs[Q.cur];
  const prev=S.quizBest[Q.lid];
  const progText=`${Q.cur+1} / ${Q.qs.length}${prev!=null?' · Best: '+prev+'%':''}`;
  document.getElementById('quiz-content').innerHTML=`
    <div class="quiz-hdr">
      <h2>🧠 Test Yourself</h2>
      <span class="quiz-prog">${progText}</span>
    </div>
    <p class="quiz-q">${esc(q.q)}</p>
    <div class="quiz-opts">
      ${q.opts.map((o,i)=>`<button class="quiz-opt" onclick="answerQ(${i})" id="qo${i}">${esc(o)}</button>`).join('')}
    </div>
    <div class="quiz-fb" id="qfb"></div>
    <button class="btn hidden" id="qnext" onclick="nextQ()">${Q.cur<Q.qs.length-1?'Next →':'See Results'}</button>
  `;
}
function answerQ(i){
  if(Q.answered)return;Q.answered=true;
  const correct=i===Q.qs[Q.cur].a;
  if(correct)Q.score++;
  document.querySelectorAll('.quiz-opt').forEach((b,idx)=>{
    b.disabled=true;
    if(idx===Q.qs[Q.cur].a)b.classList.add('correct');
    else if(idx===i&&!correct)b.classList.add('wrong');
  });
  const fb=document.getElementById('qfb');
  fb.style.color=correct?'var(--green)':'#c62828';
  fb.textContent=correct?'✅ Correct!':'❌ '+Q.qs[Q.cur].opts[Q.qs[Q.cur].a];
  document.getElementById('qnext').classList.remove('hidden');
}
function nextQ(){
  Q.answered=false;Q.cur++;
  if(Q.cur<Q.qs.length)renderQuiz();
  else showQuizResult();
}
function showQuizResult(){
  const pct=Math.round((Q.score/Q.qs.length)*100);
  const prev=S.quizBest[Q.lid]||0;
  const isNew=pct>prev;
  if(isNew){S.quizBest[Q.lid]=pct;saveProgress();}
  const msg=pct===100?'🏆 Perfect score!'
    :pct>=80?'🎉 Great job!'
    :pct>=60?'👍 Keep going!'
    :'📚 Review the lesson and try again.';
  document.getElementById('quiz-content').innerHTML=`
    <div class="quiz-result">
      <div class="quiz-score-big">${Q.score}/${Q.qs.length}</div>
      <div class="quiz-pct">${pct}%${isNew&&pct>0?' 🆕 New best!':''}</div>
      <p class="quiz-msg">${msg}</p>
      <div class="quiz-result-btns">
        <button class="btn" onclick="closeQuiz()">← Back to Lesson</button>
        <button class="btn sec" onclick="retryQuiz()">Try Again 🔄</button>
      </div>
    </div>
  `;
  if(pct===100)showToast('Perfect score! 🏆');
  else if(isNew&&pct>0)showToast('New best: '+pct+'%! 🎉');
}
function closeQuiz(){document.getElementById('quiz-overlay').classList.add('hidden');}
function retryQuiz(){Q.cur=0;Q.score=0;Q.answered=false;renderQuiz();}

// ── CHEAT SHEET ──────────────────────────────────────────────────────────────
let cheatTab='html';
function toggleCheat(){document.getElementById('cheat-panel').classList.toggle('open');}
function setCheatTab(t){
  cheatTab=t;
  document.querySelectorAll('.cheat-tab').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));
  renderCheat();
}
function renderCheat(){
  const sections=CHEAT[cheatTab]||[];
  document.getElementById('cheat-body').innerHTML=sections.map(s=>`
    <div class="cheat-section">
      <h4>${esc(s.h)}</h4>
      ${s.rows.map(r=>`
        <div class="cheat-row">
          <span class="cheat-code">${esc(r[0])}</span>
          <span class="cheat-desc">${esc(r[1])}</span>
        </div>`).join('')}
    </div>
  `).join('');
}

// ── HELPERS ──────────────────────────────────────────────────────────────────
function esc(s){if(s==null)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function phOf(id){return PHASES.find(p=>p.lessons.some(l=>l.id===id))}
function lsOf(id){for(const p of PHASES){const l=p.lessons.find(x=>x.id===id);if(l)return l}return null}
function nextOf(id){
  const ph=phOf(id);if(!ph)return null;
  const i=ph.lessons.findIndex(l=>l.id===id);
  if(i<ph.lessons.length-1)return{type:'lesson',lesson:ph.lessons[i+1]};
  if(ph.project)return{type:'project',phase:ph};
  return null;
}
function buildDoc(h,c,j){
  let d=h;
  const s='<style>'+c+'</style>';
  const jt='<scr'+'ipt>'+j+'</sc'+'ript>';
  if(d.includes('</head>'))d=d.replace('</head>',s+'</head>');
  else d='<!DOCTYPE html><html><head><meta charset="utf-8">'+s+'</head><body>'+d+'</body></html>';
  if(d.includes('</body>'))d=d.replace('</body>',jt+'</body>');else d+=jt;
  return d;
}

// ── PREVIEW ──────────────────────────────────────────────────────────────────
let pvTimer;
function schedPv(){clearTimeout(pvTimer);pvTimer=setTimeout(runPv,500)}
function runPv(){const f=document.getElementById(S.view==='pv'?'pif':'lif');if(f)f.srcdoc=buildDoc(S.code.html,S.code.css,S.code.js);}

// ── EDITOR ───────────────────────────────────────────────────────────────────
function saveTab(){const e=document.getElementById(S.view==='pv'?'ped':'led');if(e)S.code[S.tab[S.view]]=e.value;}
function setTab(tab,view){
  saveTab();S.tab[view]=tab;
  const vEl=document.getElementById(view);
  if(vEl)vEl.querySelectorAll('.tb-btn').forEach(b=>b.classList.toggle('on',b.textContent.toLowerCase()===tab));
  const e=document.getElementById(view==='pv'?'ped':'led');
  if(e){e.value=S.code[tab];e.className='ed';}
}
function onInput(view){const e=document.getElementById(view==='pv'?'ped':'led');if(e){S.code[S.tab[view]]=e.value;schedPv();}}
function loadEditor(view){
  S.tab[view]='html';
  const vEl=document.getElementById(view);
  if(vEl)vEl.querySelectorAll('.tb-btn').forEach(b=>b.classList.toggle('on',b.textContent.toLowerCase()==='html'));
  const e=document.getElementById(view==='pv'?'ped':'led');
  if(e){e.value=S.code.html;e.className='ed';}
  runPv();
}

// ── SIDEBAR ──────────────────────────────────────────────────────────────────
function renderSB(){
  let h='';
  for(const ph of PHASES){
    const done=ph.lessons.filter(l=>S.done.has(l.id)).length;
    const tot=ph.lessons.length;
    const open=S.expandedPhase===ph.id;
    const pct=tot>0?(done/tot)*100:0;
    h+=`<div>
      <button class="ph-btn" ${ph.comingSoon?'disabled':''} onclick="togglePh('${ph.id}')">
        <span style="font-size:18px">${ph.icon}</span>
        <div class="ph-meta">
          <div class="ph-tag">${esc(ph.label)}</div>
          <div class="ph-name">${esc(ph.title)}</div>
          ${!ph.comingSoon&&tot>0?`<div class="ph-bar"><div class="ph-fill" style="width:${pct}%"></div></div>`:''}
        </div>
        <span style="font-size:11px">${ph.comingSoon?'Soon':(open?'▲':'▼')}</span>
      </button>
      ${open?`<div>
        ${ph.lessons.map(l=>`<button class="ls-btn ${S.lessonId===l.id&&S.view==='lv'?'on':''}" onclick="goLesson('${l.id}')">
          <span class="ck ${S.done.has(l.id)?'done':''}">${S.done.has(l.id)?'✓':'○'}</span>${esc(l.title)}
        </button>`).join('')}
        ${ph.project?`<button class="pj-btn ${S.phaseId===ph.id&&S.view==='pv'?'on':''}" onclick="goProject('${ph.id}')">🏆 Project</button>`:''}
      </div>`:''}
    </div>`;
  }
  document.getElementById('sb').innerHTML=h;
}

// ── HOME ─────────────────────────────────────────────────────────────────────
function renderHome(){
  let h=`<h1>Welcome back, ${esc(S.currentUser||'there')}! 👋</h1>
  <p class="h-intro">Your personal roadmap from zero to shipping real web apps. Work through each phase, complete the challenges, test yourself with quizzes, and build real projects.</p>`;
  for(const ph of PHASES){
    const done=ph.lessons.filter(l=>S.done.has(l.id)).length;
    const tot=ph.lessons.length;
    const pct=tot>0?(done/tot)*100:0;
    h+=`<div class="pc ${ph.comingSoon?'soon':'go'}" ${!ph.comingSoon?`onclick="goLesson('${ph.lessons[0]?.id}')"`:''}>
      <div class="pc-ic">${ph.icon}</div>
      <div class="pc-info">
        <div class="pc-tag">${esc(ph.label)}</div>
        <div class="pc-name">${esc(ph.title)}</div>
        <div class="pc-desc">${esc(ph.desc)}</div>
        ${!ph.comingSoon&&tot>0?`<div class="pc-pg"><div class="pc-bar"><div class="pc-fill" style="width:${pct}%"></div></div><span class="pc-ct">${done}/${tot}</span></div>`:''}
      </div>
      ${ph.comingSoon?`<span class="soon-badge">Coming soon</span>`:`<button class="btn" onclick="event.stopPropagation();goLesson('${ph.lessons[0]?.id}')">${done>0?'Continue →':'Start →'}</button>`}
    </div>`;
  }
  document.getElementById('home').innerHTML=h;
}

// ── LESSON ────────────────────────────────────────────────────────────────────
function renderLesson(){
  const l=lsOf(S.lessonId);if(!l)return;
  const ph=phOf(l.id);
  const isDone=S.done.has(l.id);
  const next=nextOf(l.id);
  const best=S.quizBest[l.id];
  const isDebug=ph?.isDebug;
  let h=`<div class="crumb">
    <span class="ctag">${esc(ph?.label||ph?.title)} · ${esc(ph?.title)}</span>
    ${isDone?'<span class="dtag">✓ Complete</span>':''}
    ${l.quiz?`<span class="qtag" style="background:${best===100?'var(--green)':best!=null?'#e65100':'var(--acc)'};color:${best!=null?'#fff':'var(--text)'}">${best!=null?'Quiz: '+best+'%':'Quiz available'}</span>`:''}
  </div>
  <h2 class="lh">${isDebug?'🐛 ':esc(l.title)&&''}</h2>`;
  h=h.replace('</h2>','');
  h+=`${esc(l.title)}</h2>`;
  for(const b of l.content){
    if(b.t==='p')h+=`<p class="lt">${b.v}</p>`;
    else if(b.t==='c')h+=`<pre class="cb">${esc(b.v)}</pre>`;
    else if(b.t==='t')h+=`<div class="tip">${b.v}</div>`;
  }
  h+=`<div class="chal">
    <h3>${isDebug?'🎯':'🎯'} ${esc(l.ch.title)}</h3>
    <p class="desc">${l.ch.desc}</p>
    <details><summary>💡 Show hint</summary><pre class="cb" style="margin-top:10px;font-size:12px">${esc(l.ch.hint)}</pre></details>
  </div>
  <div class="lact">
    ${!isDone?`<button class="btn" onclick="markDone()">✓ Mark Complete</button>`:''}
    ${l.quiz?`<button class="btn sec" onclick="startQuiz('${l.id}')">🧠 Test Yourself</button>`:''}
    ${next?.type==='lesson'?`<button class="btn sec" onclick="goLesson('${next.lesson.id}')">Next: ${esc(next.lesson.title)} →</button>`:''}
    ${next?.type==='project'?`<button class="btn sec" onclick="goProject('${next.phase.id}')">🏆 Go to Project →</button>`:''}
  </div>`;
  document.getElementById('lcontent').innerHTML=h;
}

// ── PROJECT ───────────────────────────────────────────────────────────────────
function renderProject(){
  const ph=PHASES.find(p=>p.id===S.phaseId);if(!ph?.project)return;
  document.getElementById('pcontent').innerHTML=`
    <div class="ptag">${esc(ph.label)} · ${esc(ph.title)}</div>
    <h2>${esc(ph.project.title)}</h2>
    <p>${esc(ph.project.desc)}</p>`;
}

// ── NAVIGATION ───────────────────────────────────────────────────────────────
function showV(v){S.view=v;['home','lv','pv'].forEach(id=>document.getElementById(id).classList.toggle('hidden',id!==v));}
function goHome(){saveTab();S.lessonId=null;S.phaseId=null;showV('home');document.getElementById('hdr-sub').textContent='';renderHome();renderSB();}
function goLesson(id){
  if(!id)return;saveTab();
  const l=lsOf(id);if(!l)return;
  S.lessonId=id;S.phaseId=null;S.expandedPhase=phOf(id)?.id;
  S.code={html:l.code.html,css:l.code.css,js:l.code.js};
  showV('lv');document.getElementById('hdr-sub').textContent=l.title;
  renderLesson();loadEditor('lv');renderSB();
}
function goProject(id){
  saveTab();const ph=PHASES.find(p=>p.id===id);if(!ph?.project)return;
  S.phaseId=id;S.lessonId=null;S.expandedPhase=id;
  S.code={html:ph.project.code.html,css:ph.project.code.css,js:ph.project.code.js};
  showV('pv');document.getElementById('hdr-sub').textContent=ph.project.title;
  renderProject();loadEditor('pv');renderSB();
}
function togglePh(id){S.expandedPhase=S.expandedPhase===id?null:id;renderSB();}
function markDone(){
  if(S.lessonId){S.done.add(S.lessonId);saveProgress();renderLesson();renderSB();renderHome();showToast('Lesson complete! 🎉');}
}
function toggleSB(){S.sbOpen=!S.sbOpen;document.getElementById('sb').classList.toggle('closed',!S.sbOpen);}
function toggleDark(){S.dark=!S.dark;document.body.classList.toggle('dark',S.dark);document.getElementById('dark-btn').textContent=S.dark?'☀️':'🌙';saveProgress();}

// ── INIT ──────────────────────────────────────────────────────────────────────
(function(){
  const sess=getSession();
  if(sess?.username){
    const users=getUsers();
    if(users[sess.username]){hideAuthScreen();loadUserSession(sess.username);return;}
  }
  showAuthScreen();
})();

</script>
